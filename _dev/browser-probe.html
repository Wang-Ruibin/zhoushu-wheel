<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>咒术转盘浏览器验证</title>
<style>
html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}
#report{position:fixed;z-index:999;left:8px;top:8px;padding:7px 10px;border-radius:8px;background:#111;color:#fff;font:12px monospace;opacity:.88}
body.capture #report{display:none}
</style>
</head>
<body>
<div id="report" data-status="RUNNING">RUNNING</div>
<iframe id="app" title="咒术转盘测试页面"></iframe>
<script>
(function(){
'use strict';
const frame = document.getElementById('app');
const report = document.getElementById('report');
const params = new URLSearchParams(location.search);
const mode = params.get('mode') || 'smoke';
if (mode !== 'smoke') document.body.className = 'capture';
let reloaded = false;
function finish(ok, details){
  report.dataset.status = ok ? 'PASS' : 'FAIL';
  report.textContent = (ok ? 'PASS ' : 'FAIL ') + details;
  document.title = report.textContent;
}
function wait(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }
frame.onload = async function(){
  try {
    const win = frame.contentWindow;
    if (!reloaded) {
      reloaded = true;
      win.localStorage.setItem('zhoushu-wheel.debug', '1');
      win.location.reload();
      return;
    }
    await wait(900);
    const doc = frame.contentDocument;
    const api = win.ZW && win.ZW.__app;
    if (!doc || !api || !api.state || api.state.wheels.length !== 28) throw new Error('未加载 28 个转盘');
    if (mode === 'settings') { doc.getElementById('btnPanel').click(); await wait(350); finish(true, 'settings'); return; }
    if (mode === 'wheels') { doc.getElementById('btnSwitch').click(); await wait(350); finish(true, 'wheels'); return; }
    if (mode === 'chart') {
      const wheel = api.state.wheels.find(item => /^咒力总量$/.test(item.name)) || api.state.wheels[0];
      api.state.flow.path = [{ wheelId:wheel.id, wheel:wheel.name, label:(wheel.options[0] || {}).label || 'A（测试）', at:Date.now() }];
      api.state.charts = [{ id:'browser-chart', name:'浏览器维度图', at:Date.now(), after:'', dims:[] }];
      api.openChart('browser-chart'); await wait(900); finish(true, 'chart'); return;
    }
    api.state.settings.duration = 1;
    await api.spin();
    const result = doc.getElementById('result').textContent.trim();
    if (!result || result === '？') throw new Error('真实旋转没有结果');
    doc.getElementById('btnSwitch').click(); await wait(250);
    if (!doc.getElementById('overlay').classList.contains('open')) throw new Error('转盘面板没有打开');
    api.navCloseAll(); await wait(250);
    doc.getElementById('btnPanel').click(); await wait(250);
    if (!/浏览器存储/.test(doc.getElementById('sheet').textContent)) throw new Error('设置页没有保存状态');
    const before = api.state.wheels.length;
    const bad = await api.importDataText('{bad', async function(){ return true; });
    if (bad.ok || api.state.wheels.length !== before) throw new Error('坏导入破坏了状态');
    history.back(); await wait(250);
    finish(true, 'startup spin panels import history');
  } catch(error) { finish(false, error && error.message || String(error)); }
};
frame.src = '../index.html';
})();
</script>
</body>
</html>
