# gxnatri.top - static game "zhou zhuan pan" (spin wheel)
# AstrBot fully retired from the public domain on 2026-09-12.
# Its dashboard remains reachable privately via Tailscale: http://100.88.191.93
# Old config backup: /etc/nginx/sites-available/astrbot.bak-20260912

# Domain on port 80 -> HTTPS apex (certbot nginx plugin renews through this block)
server {
    listen 80;
    listen [::]:80;
    server_name gxnatri.top www.gxnatri.top;
    return 301 https://gxnatri.top$request_uri;
}

# AstrBot private access over Tailscale IP only (kept, off the public domain).
# Source-IP allowlist blocks Host-header spoofing from the public internet:
# only tailnet peers (100.64.0.0/10) and the VM itself may reach this block.
server {
    listen 80;
    server_name 100.88.191.93;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:6185;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# Unknown hosts on port 80 -> apex
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://gxnatri.top$request_uri;
}

# Unknown hosts on port 443 -> apex (cert needed to complete the handshake)
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/gxnatri.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gxnatri.top/privkey.pem;
    return 301 https://gxnatri.top$request_uri;
}

# The game itself
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name gxnatri.top www.gxnatri.top;

    ssl_certificate /etc/letsencrypt/live/gxnatri.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gxnatri.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/zw;
    index index.html;
    charset utf-8;

    # PWA: .webmanifest needs its MIME map. nginx `types` is a hash directive, so
    # declaring one at server level would drop every inherited mapping — the line
    # lives in /etc/nginx/mime.types on the VM instead:
    #   application/manifest+json  webmanifest;

    # always revalidate the entry page so game updates show immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
