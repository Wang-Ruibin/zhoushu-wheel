<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F3EFE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>咒术转盘</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="seal" aria-hidden="true">咒</span>
    <button class="title-pill" id="btnSwitch" aria-label="切换或管理转盘" aria-haspopup="dialog">
      <span class="pico" data-icon="menu"></span>
      <span class="pname" id="wheelName">咒术转盘</span>
      <span class="pico chev" data-icon="chevron"></span>
    </button>
  </header>
  <div class="flow-bar" id="flowBar" hidden></div>

  <main class="stage">
    <div class="result" id="result" role="status" aria-live="polite" aria-atomic="true" title="点开结果操作">？</div>
    <div class="wheel-wrap" id="wheelWrap"><canvas id="wheel"></canvas></div>
  </main>

  <footer class="controls">
    <button class="round" id="btnPanel" title="设置与记录" aria-label="设置与记录" data-icon="sliders"></button>
    <button class="round" id="btnEdit" title="编辑当前转盘选项" aria-label="编辑当前转盘选项" data-icon="edit"></button>
  </footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="面板">
  <div class="sheet" id="sheet" tabindex="-1"></div>
</div>

<div class="overlay confirm-overlay" id="confirmOverlay">
  <div class="dialog">
    <h4 id="cTitle">提示</h4>
    <p id="cDesc"></p>
    <input class="c-input" id="cInput" type="text" hidden>
    <div class="c-acts">
      <button class="btn ghost" id="cCancel">取消</button>
      <button class="btn" id="cOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<!-- 插件：普通 <script>（不是 ES module，这样双击 html 也能用），按顺序加载 -->
<script src="js/_ns.js"></script>
<script src="js/util.js"></script>
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/sound.js"></script>
<script src="js/spin.js"></script>
<script src="js/multi.js"></script>

<script>
(function(){
'use strict';

/* ============================== 命名空间转发 ==============================
   js/*.js 里的工具都挂在 window.ZW 上。这里把它们转成本文件里的短名，
   这样下面的业务代码写法和以前一模一样（$ / esc / clamp / colorOf …）。
   ⚠️ 加新的 js 文件时：在那个文件里 Object.assign(ZW, {...})，
      再到这里补一行转发（顺序要对齐 index.html 里 <script src> 的顺序）。
   ========================================================================= */
const { TAU, FONT, WFONT, PALETTES,
        $, $$, esc, uid, num, norm, clamp,
        hslToHex, hexToRgb, colorOf, textOn, shuffleArr,
        usePalette, paletteOf, paletteKeyNow,
        svg, ICONS, icon,
        audio, beep, tickSound, loadGearSfx, playGearSfx, gearTick, winSound, vibrate,
        useAudioConfig, hasGearSfx,
        spin, animateSpin, applySpinFx, startSpinFx, endSpinFx, spinFxKey, SPIN_FX,
        setResult, setLiveText, beginRolling, endRolling, useSpinHooks, prefersReducedMotion,
        FACE_WHEN, whenLabel, gradeIndex, matchWhen, isMultiWheel, faceSourceName, faceCount,
        lastResultOf, faceOf, optionsOf, faceDesc, useMultiHooks, byRef } = ZW;
/* 多面转盘模块也不认识 state，这里把主逻辑里的东西喂给它 */
useMultiHooks({
  parseGrade: label => parseGrade(label),
  grownLabel: (id, label) => grownLabel(id, label),
  flowPath: () => (state.flow && state.flow.path) || [],
  history: () => state.history || [],
  wheels: () => state.wheels || []
});

/* 图标（svg / ICONS / icon）在 js/icons.js 里 */

/* 维度图自动弹窗的停留时长（秒）→ 规范成 [下限, 上限] 里的数；没设/设成 0 用默认值。
   放在最前面是因为 normalize() 会用到它。 */
function chartDwellSec(v){
  const n = num(v);
  if (!(n > 0)) return CHART_DWELL_DEF;
  return clamp(n, CHART_DWELL_MIN, CHART_DWELL_MAX);
}
function chartAutoDwellMs(){
  return Math.round(chartDwellSec(state.settings.chartDwell) * 1000);
}

/* ============================== 数据 ============================== */
const LS_KEY = 'zhoushu-wheel.v1';
const HINT_KEY = 'zhoushu-wheel.hint';
const RECOVERY_KEY = 'zhoushu-wheel.import-recovery.v1';
const BASE_ALL = 0.0001;
const BASE_SETTINGS = {
  palette:'xuan', theme:'light', sound:true, vibrate:true,
  duration:4.2, rolling:true, autoFlip:false, historyLimit:50,
  autoSave:true,      // 改动后自动写回「转盘」文件夹（需要授权过一次）
  chartOnEnd:true,    // 流程结束时自动弹出属性维度图
  chartMid:true,      // 流程走到某个转盘、而这个位置正好有一张维度图时，也弹出来看一眼
  chartDwell:3.4,     // 中途自动弹出的维度图停留几秒（0 = 不自动弹）
  chartColor:'zhu',   // 维度图配色（CHART_INKS 的 key）
  wheelColor:'jin',   // 法轮配色（独立设置，默认赭金=黄铜）
  wheelAlpha:0.40,    // 法轮透明度
  spinFx:'bounce',    // 旋转的物理效果（SPIN_FX 的 key）
  fromFiles:false     // 仅内部用：true = 每次打开都以文件覆盖
};
/* ---- 维度图自动弹出的节奏（想微调改这里就行） ---- */
const CHART_SHOW_DELAY = 650;      // 抽完之后等多久弹出来（毫秒）；先让结果动效播完
const CHART_DWELL_MIN  = 1.0;      // 停留时长下限（秒）
const CHART_DWELL_MAX  = 30;       // 停留时长上限（秒）
const CHART_DWELL_DEF  = 3.4;      // 没设置过 / 设成 0 时的默认停留时长（秒）
const CHART_RESUME_GAP = 280;      // 收起后等多久再继续下一站（毫秒）；等收起动画走完
const STATE_VER = 3;
const END = '__end__', STAY = '__stay__';
const BASE_FLOW = { enabled:true, rootId:'', autoJump:true, autoSpin:false, delay:1.6, path:[], pendingId:'', retStack:[], paused:false };
const BASE_WHEELS = [
  { name:'穿越后的初始身份', labels:['咒术师','诅咒师','咒灵','咒骸','式神','咒具','魂穿原著角色','咒术高层','普通人'] },
  { name:'穿越后的时间点',   labels:['怀玉时期','0卷时期','剧情开始时','涩谷事变时期','死灭回游时期','新宿决战时期','68年后·外传','平安时代（千年前）','400年前'] },
  { name:'穿越后的地点',     opts:[['日本',40],['亚洲除日本其他地方',9],['北美洲',8],['欧洲',8],['澳洲',7],['非洲',6],['南美洲',5],['澳大利亚星人·自动刷',4]] },
  { name:'穿越后的年龄',     opts:[['刚出生的婴儿',3],['11岁是小学生',12],['16岁未成年',10],['刚满18岁',7],['24大好青年',9],['30岁壮年巅峰期',10],['40岁中年人',9],['55岁过半百',16],['66岁老年人',10],['75古稀之年',10],['88岁耄耋之年',5],['99极限斗罗',3]] },
  { name:'穿越后的性别',     opts:[['女',48],['男',40],['武装直升机',7],['不男不女',5]] },
  { name:'穿越后的颜值',     opts:[['E（面目可憎）',16],['咒术回战看多了诞生的咒灵',4],['EX（咒术魅魔）',8],['SSS（倾国倾城）',10],['SS（沉鱼落雁）',12],['S（国色天香）',12],['A（花容月貌）',11],['B（眉清目秀）',9],['C（其貌不扬）',9],['D（尖嘴猴腮）',8]] },
  { name:'道德水平',         opts:[['SS（光明磊落）',16],['SSS（高风亮节）',10],['EX（超凡入圣）',12],['E-（禽兽不如）',12],['E（丧心病狂）',11],['D（恬不知耻）',8],['C（见利忘义）',9],['B（见义勇为）',10],['A（安分守己）',10],['S（乐善好施）',10]] },
  { name:'穿越后的术式天赋', labels:['无下限术式','十种影法术','咒灵操术','无为转变','赤血操术','投射咒法','构筑术式','复制术式','纯体术·无术式'] },
  { name:'穿越后的金手指',   labels:['咒力量十倍','无限咒力','熟知全部剧情','随身咒具库','一次时间回溯','弱化版六眼','主角光环','系统面板','没有金手指'] },
  { name:'最终结局',         labels:['成为最强','与挚友并肩','死在涩谷','被咒灵同化','苟到大结局','改写历史','成为咒灵王','回到原来的世界'] }
];
/* v3 新增的内置转盘（老存档升级时按名字补进来） */
const V3_PRESETS = ['穿越后的地点', '穿越后的年龄', '穿越后的性别', '穿越后的颜值', '道德水平'];
const WHEEL_CATEGORIES = ['角色', '属性', '能力', '事件', '结局', '自定义'];
function inferWheelCategory(name){
  const s = String(name || '');
  if (/事件|成长/.test(s)) return '事件';
  if (/结局|等级评定/.test(s)) return '结局';
  if (/咒力|体术|体质|天赋|道德|声望|颜值/.test(s)) return '属性';
  if (/术式|技巧|金手指|身份/.test(s)) return '能力';
  if (/穿越|地点|性别|时间/.test(s)) return '角色';
  return '自定义';
}

function makeOption(label, weight, color, next){
  return { id:uid(), label:String(label == null ? '' : label), weight: weight == null ? 1 : num(weight),
           color: color || null, next: next || '' };
}
/* 存档里的一项选项 → 运行时选项（纯字符串/数字也认；字段做兜底，脏数据不会让程序打不开） */
function normOption(o){
  if (typeof o === 'string' || typeof o === 'number') return makeOption(o);
  return { id:(o && o.id) || uid(),
           label:String((o && o.label) == null ? '' : o.label),
           weight:(o && o.weight == null) ? 1 : num(o.weight),
           color:(o && o.color) || null,
           next:(o && typeof o.next === 'string') ? o.next : '' };
}
function makeWheel(name, labels){
  return { id:uid(), name:name, category:'自定义', next:'', branch:false, grade:null, removeAfterPick:false,
           multi:false, faceBy:'', faces:[], options:(labels || []).map(l => makeOption(l)) };
}
/* 内置转盘定义 → 运行时转盘（支持带权重的 opts） */
function wheelFromDef(def){
  return {
    id:uid(), name:def.name, category:def.category || inferWheelCategory(def.name), next:'', branch:!!def.branch, grade:(def.grade === true ? true : (def.grade === false ? false : null)),
    removeAfterPick:false, multi:false, faceBy:'', faces:[],
    options: def.opts ? def.opts.map(p => makeOption(p[0], p[1])) : (def.labels || []).map(l => makeOption(l))
  };
}
function seed(){
  const s = {
    version:STATE_VER, currentId:null,
    wheels: BASE_WHEELS.map(wheelFromDef),
    charts: [],
    settings: Object.assign({}, BASE_SETTINGS),
    history: [], flow: Object.assign({}, BASE_FLOW)
  };
  s.currentId = s.wheels[0].id;
  const byName = n => s.wheels.filter(w => w.name === n)[0];
  const link = (from, to) => { const a = byName(from), b = byName(to); if (a) a.next = b ? b.id : END; };
  const branch = (wName, optLabel, toName) => {
    const w = byName(wName), t = byName(toName);
    if (!w || !t) return;
    const o = w.options.filter(x => x.label === optLabel)[0];
    if (o) o.next = t.id;
  };
  link('穿越后的初始身份', '穿越后的时间点');
  link('穿越后的时间点', '穿越后的地点');
  link('穿越后的地点', '穿越后的年龄');
  link('穿越后的年龄', '穿越后的性别');
  link('穿越后的性别', '穿越后的颜值');
  link('穿越后的颜值', '道德水平');
  link('道德水平', '穿越后的术式天赋');
  link('穿越后的术式天赋', '穿越后的金手指');
  link('穿越后的金手指', '最终结局');
  const last = byName('最终结局'); if (last) last.next = END;
  // 示例分支：不同选项去不同转盘
  branch('穿越后的初始身份', '魂穿原著角色', '穿越后的术式天赋');
  branch('穿越后的初始身份', '咒灵', '最终结局');
  branch('穿越后的初始身份', '普通人', '最终结局');
  s.flow.rootId = s.wheels[0].id;
  return s;
}
/* v2 → v3：把新增的内置转盘补进老存档，并接回原来的链路 */
function upgradeToV3(s){
  const have = {};
  s.wheels.forEach(w => { have[w.name] = w; });
  const add = [];
  V3_PRESETS.forEach(name => {
    if (have[name]) return;
    const def = BASE_WHEELS.filter(b => b.name === name)[0];
    if (def) add.push(wheelFromDef(def));
  });
  if (!add.length) return s;
  const anchor = have['穿越后的时间点'];
  const tail = have['穿越后的术式天赋'];
  const at = anchor ? s.wheels.indexOf(anchor) + 1 : s.wheels.length;
  s.wheels.splice.apply(s.wheels, [at, 0].concat(add));
  const oldNext = (anchor && anchor.next) || (tail ? tail.id : END);
  add.forEach((w, i) => { w.next = i < add.length - 1 ? add[i + 1].id : oldNext; });
  if (anchor && (!anchor.next || anchor.next === (tail ? tail.id : END))) anchor.next = add[0].id;
  if (s.flow && !s.flow.rootId && s.wheels.length) s.flow.rootId = s.wheels[0].id;
  return s;
}
function normalize(d){
  const s = {
    version:STATE_VER,
    wheels:[],
    currentId: d && d.currentId,
    settings: Object.assign({}, BASE_SETTINGS, (d && d.settings) || {}),
    history: (d && Array.isArray(d.history)) ? d.history.filter(h => h && h.label) : []
  };
  const ws = (d && Array.isArray(d.wheels)) ? d.wheels : [];
  s.wheels = ws.filter(w => w && typeof w === 'object').map(w => ({
    id: w.id || uid(),
    name: String(w.name == null ? '未命名转盘' : w.name),
    category: WHEEL_CATEGORIES.indexOf(w.category) >= 0 ? w.category : inferWheelCategory(w.name),
    removeAfterPick: !!w.removeAfterPick,
    next: (w.next && typeof w.next === 'string') ? w.next : '',
    branch: !!w.branch,
    grade: (w.grade === true ? true : (w.grade === false ? false : null)),
    /* 多面转盘：multi / faceBy（存 id）/ faces[]（每个面一套 when + options） */
    multi: w.multi === true || (Array.isArray(w.faces) && w.faces.length > 0),
    faceBy: (typeof w.faceBy === 'string') ? w.faceBy : '',
    faces: (Array.isArray(w.faces) ? w.faces : []).map(f => ({
      when: (f && f.when && typeof f.when === 'object') ? f.when : { type:'else' },
      options: ((f && Array.isArray(f.options)) ? f.options : []).map(o => normOption(o))
    })),
    options: (Array.isArray(w.options) ? w.options : []).map(o => normOption(o))
  }));
  if (s.wheels.length) {
    s.currentId = s.wheels[0].id;
    if (d && d.currentId && s.wheels.some(w => w.id === d.currentId)) s.currentId = d.currentId;
  }
  s.settings.duration = clamp(num(s.settings.duration) || 4.2, 1, 12);
  if (!PALETTES[s.settings.palette]) s.settings.palette = 'xuan';
  if (s.settings.theme !== 'dark') s.settings.theme = 'light';
  if (!s.settings.historyLimit) s.settings.historyLimit = 50;
  if (s.settings.autoSave !== false) s.settings.autoSave = true;
  if (s.settings.chartOnEnd !== false) s.settings.chartOnEnd = true;
  if (s.settings.chartMid !== false) s.settings.chartMid = true;      // 老的存档没有 → 默认开
  s.settings.chartDwell = chartDwellSec(s.settings.chartDwell);
  if (!s.settings.chartColor) s.settings.chartColor = 'zhu';
  if (!s.settings.wheelColor) s.settings.wheelColor = 'jin';
  s.settings.wheelAlpha = clamp(num(s.settings.wheelAlpha) || 0.40, 0.05, 1);
  if (!s.settings.spinFx) s.settings.spinFx = 'bounce';
  /* 老存档里的效果名迁移：摇摆 → 2D滚筒，甩出（已移除）→ 颠簸 */
  if (s.settings.spinFx === 'sway') s.settings.spinFx = 'drum2d';
  if (s.settings.spinFx === 'lean') s.settings.spinFx = 'bounce';
  s.lastChart = (d && d.lastChart && Array.isArray(d.lastChart.dims) && d.lastChart.dims.length)
    ? { at: num(d.lastChart.at) || Date.now(), dims: d.lastChart.dims.filter(x => x && x.label) } : null;
  /* 属性维度图：点「新建」时把当时的属性定格成一张图，之后不再改变 */
  s.charts = (d && Array.isArray(d.charts) ? d.charts : [])
    .filter(c => c && Array.isArray(c.dims) && c.dims.length)
    .map((c, i) => ({
      id: c.id || uid(),
      name: String(c.name == null ? ('属性维度图 ' + (i + 1)) : c.name),
      at: num(c.at) || Date.now(),
      after: (typeof c.after === 'string') ? c.after : '',
      dims: c.dims.filter(x => x && x.label).map(x => ({ wheel:String(x.wheel || ''), label:String(x.label), value: num(x.value) }))
    }))
    .slice(-60);
  // v1 → v2：整体换成纸张/手绘皮肤，旧默认配色「鲜艳」一并迁移到「宣纸」
  if (num(d && d.version) < 2 && s.settings.palette === 'vivid') s.settings.palette = 'xuan';
  // v2 → v3：补齐新增的内置转盘（地点 / 年龄 / 性别 / 颜值 / 道德水平）
  if (num(d && d.version) < 3) upgradeToV3(s);
  const f = (d && d.flow && typeof d.flow === 'object') ? d.flow : {};
  s.flow = {
    enabled: f.enabled !== false,
    rootId: typeof f.rootId === 'string' ? f.rootId : '',
    autoJump: f.autoJump !== false,
    autoSpin: !!f.autoSpin,
    delay: clamp(num(f.delay) || 1.6, 0.4, 8),
    path: (Array.isArray(f.path) ? f.path : []).filter(p => p && p.label).slice(-40),
    pendingId:'', retStack:[], paused:false, roundAt:0, grow:{}
  };
  if (s.flow.path.length) s.flow.path.forEach(p => { if (p && typeof p.wheel !== 'string') p.wheel = ''; });
  if (s.flow.rootId && !s.wheels.some(w => w.id === s.flow.rootId)) s.flow.rootId = '';
  return s;
}
function load(){
  let s = null;
  try { const raw = localStorage.getItem(LS_KEY); if (raw) s = normalize(JSON.parse(raw)); } catch(e){ s = null; }
  if (!s || !s.wheels.length) s = seed();
  if (!s.wheels.some(w => w.id === s.currentId)) s.currentId = s.wheels[0].id;
  return s;
}
const storageStatus = { ok:true, at:0, error:'' };
let storageErrorShown = false;
function save(){
  let ok = true;
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    storageStatus.ok = true;
    storageStatus.at = Date.now();
    storageStatus.error = '';
    storageErrorShown = false;
  } catch(e) {
    ok = false;
    storageStatus.ok = false;
    storageStatus.error = (e && e.message) || '浏览器拒绝写入';
    if (!storageErrorShown) {
      storageErrorShown = true;
      setTimeout(() => toast('保存失败：改动目前只在本次会话中，请立即导出备份'), 0);
    }
  }
  scheduleSync();
  return ok;
}
let saveTimer = null;
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 200); }

let state = load();
let importRecoveryRaw = (() => {
  try { return localStorage.getItem(RECOVERY_KEY) || ''; } catch(e) { return ''; }
})();
/* js/util.js 的 colorOf 需要知道当前调色板；它不认识 state，所以从这里注入 */
usePalette(() => state && state.settings ? state.settings.palette : 'xuan');
/* 声音模块同理：音效 / 震动开关也从这里喂进去 */
useAudioConfig({ sound: () => !!(state && state.settings && state.settings.sound),
                 vibrate: () => !!(state && state.settings && state.settings.vibrate) });
const ui = { view:'none', mtab:'wheels', treeOpen:{}, targetCtx:null, flowCollapsed:false, resultLabel:'', resultOptId:'',
             faceWheelId:'', faceEdit:'auto', faceWhenIdx:-1 };
/* 跨模块共享的运行时变量在 js/core.js 里。转盘角度 rot 由 js/spin.js 每帧改写、
   绘制这边要读，所以集中放 core；绘制里统一写 core.rot（别用本地副本，会不同步）。 */
const core = ZW.core;
let wheelSize = 0;                     // 逻辑边长同时同步到 core.wheelSize（别的模块要用）
function getRot(){ return core.rot; }
function setRot(v){ core.rot = v; }
/* 给 js/spin.js 用的读写口 + 重绘触发（模块之间只通过这些函数来往，不碰内部变量） */
Object.assign(ZW.rot = ZW.rot || {}, { get:getRot, set:setRot });

function currentWheel(){
  if (!state.wheels.length) state.wheels.push(makeWheel('新转盘', ['选项 1', '选项 2']));
  return state.wheels.filter(w => w.id === state.currentId)[0] || state.wheels[0];
}
/* ★ 多面转盘的唯一收口：一个转盘「此刻该展示的全部选项」。
   ⚠️ 凡是"要展示 / 要抽"的地方都得走这里，别直接读 w.options ——
      否则多面转盘在那些地方会显示成兜底面。
      （编辑界面是例外：那里要能编辑任意一个面，走 faceOptions(w, faceIndex)。）*/
function wheelOptions(w){
  const x = w || currentWheel();
  return isMultiWheel(x) ? (optionsOf(x) || []) : (x.options || []);
}
/* 某张面（index = -1 表示兜底面）的选项 —— 给编辑界面用 */
function faceOptions(w, index){
  if (!isMultiWheel(w)) return w.options || [];
  if (index < 0) return w.options || [];
  const f = (w.faces || [])[index];
  return (f && Array.isArray(f.options)) ? f.options : [];
}
function activeOptions(w){ return wheelOptions(w).filter(o => num(o.weight) > 0); }

/* ============================== 转盘几何 ============================== */
function layoutSectors(opts, wheel){
  // 颜色按「转盘里当前展示的完整顺序」取，停用某个选项后其余颜色不会跳变
  // ⚠️ 多面转盘要按「当前这一面」的顺序取色，所以这里不能用 w.options
  const w = wheel || currentWheel();
  const all = wheelOptions(w);
  let total = 0;
  opts.forEach(o => { total += Math.max(BASE_ALL, num(o.weight)); });
  let a = -Math.PI / 2;
  return opts.map(o => {
    const span = TAU * (Math.max(BASE_ALL, num(o.weight)) / total);
    const ci = Math.max(0, all.indexOf(o));
    const sec = { opt:o, start:a, end:a + span, mid:a + span / 2, span:span, color:colorOf(w, o, ci) };
    a += span;
    return sec;
  });
}
function winnerIndex(secs, rotation){
  const p = -Math.PI / 2;
  for (let i = 0; i < secs.length; i++) {
    const rel = norm(p - rotation - secs[i].start);
    if (rel < secs[i].span - 1e-9) return i;
  }
  return secs.length - 1;
}
function pickIndex(opts){
  const ws = opts.map(o => Math.max(0, num(o.weight)));
  const total = ws.reduce((a, b) => a + b, 0);
  if (total <= 0) return Math.floor(Math.random() * opts.length);
  let r = Math.random() * total;
  for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r < 0) return i; }
  return ws.length - 1;
}
function parseBatch(text){
  return String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    let m = l.match(/^(.*?)\s*[*×xX]\s*(\d+(?:\.\d+)?)$/) || l.match(/^(.*?)\s*[,，、\t]\s*(\d+(?:\.\d+)?)$/);
    if (m && m[1].trim()) return { label:m[1].trim(), weight:num(m[2]) };
    return { label:l, weight:1 };
  }).filter(o => o.label);
}

/* ============================== 绘制 ============================== */
const canvas = $('#wheel');
const ctx = canvas.getContext('2d');
const resultEl = $('#result');
const wheelWrap = $('#wheelWrap');   // 旋转按钮已移除：点转盘 / 空格键都能开始
/* 这几个 DOM 引用也要给 js/spin.js 用，挂到 ZW.dom 上（原来的短名保持不动） */
Object.assign(ZW.dom = ZW.dom || {}, { canvas, ctx, resultEl, wheelWrap });

function cssVar(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}
function requestDraw(){
  if (core.drawQueued) return;
  core.drawQueued = true;
  requestAnimationFrame(() => { core.drawQueued = false; draw(); });
}
function fitWheel(){
  const stage = $('.stage');
  const availW = stage.clientWidth - 6;
  const availH = stage.clientHeight - resultEl.offsetHeight - 26;
  const size = Math.max(150, Math.min(availW, availH, 470));
  if (Math.abs(wheelSize - size) < 0.5) return;
  wheelSize = size;
  core.wheelSize = size;
  wheelWrap.style.width = size + 'px';
  wheelWrap.style.height = size + 'px';

/* 把一段文字切成两行：优先在标点处切，并让两段宽度尽量接近 */
function splitTwoLines(text, budget, measure){
  const n = String(text).length;
  if (n < 2) return null;
  const soft = '（(）)·、，,。：:；;—-—/／ 　';
  const closing = '）)」』】〕］';
  let best = null;
  for (let i = 1; i < n; i++) {
    const a = text.slice(0, i), b = text.slice(i);
    const wa = measure(a), wb = measure(b);
    if (wa > budget || wb > budget) continue;
    const okBreak = soft.indexOf(text[i]) >= 0 || soft.indexOf(text[i - 1]) >= 0;
    let score = Math.abs(wa - wb);
    if (okBreak) score -= budget * 0.6;
    if (closing.indexOf(text[i]) >= 0) score += budget * 0.8;   // 别让第二行以右括号开头
    if (!best || score < best.score) best = { a:a, b:b, score:score };
  }
  return best ? [best.a, best.b] : null;
}
function draw(){
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  if (!cw || !ch) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const W = Math.round(cw * dpr), H = Math.round(ch * dpr);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);

  const cx = cw / 2, cy = ch / 2, R = Math.min(cw, ch) / 2;
  const cRing = cssVar('--w-ring', '#fff');
  const cHub  = cssVar('--w-hub', '#f6f2e8');
  const cPtr  = cssVar('--w-pointer', '#fff');
  const cSep  = cssVar('--w-sep', 'rgba(255,255,255,.86)');
  const ring = R * 0.05, R2 = R - ring, hubR = R * 0.155;

  // 底盘（纸白外圈）
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.fillStyle = cRing;
  ctx.shadowColor = 'rgba(110,95,70,.20)';
  ctx.shadowBlur = R * 0.10;
  ctx.shadowOffsetY = R * 0.025;
  ctx.fill();
  ctx.restore();
  // 手绘墨线圈（固定种子 → 每帧一致，不会抖动）
  ctx.save();
  ctx.strokeStyle = cssVar('--ink', '#2A241C');
  ctx.lineWidth = Math.max(1, R * 0.0055);
  ctx.lineJoin = 'round';
  sketchCircle(cx, cy, R - Math.max(1, R * 0.006), 7, 2, 0.30);
  ctx.restore();

  const w = currentWheel();
  const opts = activeOptions(w);
  if (!opts.length) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R2, 0, TAU);
    ctx.fillStyle = cSep; ctx.fill();
    ctx.fillStyle = cssVar('--muted', '#9C9384');
    ctx.font = '600 ' + Math.round(R * 0.085) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('暂无选项', cx, cy);
    ctx.font = '500 ' + Math.round(R * 0.055) + 'px ' + FONT;
    ctx.fillText('点右下角编辑内容', cx, cy + R * 0.13);
    ctx.restore();
    drawHub(cx, cy, R, hubR, cHub, cPtr, cSep);
    return;
  }

  const secs = layoutSectors(opts, w);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(getRot());
  // 扇形
  secs.forEach(s => {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, R2, s.start, s.end);
    ctx.closePath();
    ctx.fillStyle = s.color;
    ctx.fill();
  });
  // 分隔线
  ctx.lineWidth = Math.max(1.2, R2 * 0.006);
  ctx.strokeStyle = cSep;
  secs.forEach(s => {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(s.start) * R2, Math.sin(s.start) * R2);
    ctx.stroke();
  });
  // 文字
  /* 排版策略：
     ① 单行能放下、字号也够看 → 单行（短标签和以前完全一样）
     ② 单行得把字缩到「看不清」才行 → 改排两行：两段沿半径**并排**（横跨扇区宽度），
        每段只用一半长度，所以字号能大一倍左右，多出三四个字也放得下
     ③ 两行都塞不进（扇区太窄/文字太长）→ 按能放下的字号画出来，不截断，
        超出转盘的部分被圆盘裁掉（就是你说的「冲突的字允许被转盘遮挡」） */
  const maxLen = R2 * 0.945 - hubR * 1.25;
  const MIN_FS = Math.max(9.5, R2 * 0.048);
  const pad = R2 * 0.055;
  const measureAt = (size, t) => { ctx.font = '600 ' + size.toFixed(1) + 'px ' + WFONT; return ctx.measureText(t).width; };
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, R2, 0, TAU); ctx.clip();      // 超出转盘的文字被挡住
  secs.forEach(s => {
    const label = (s.opt.label || '').trim();
    if (!label) return;
    ctx.save();
    ctx.rotate(s.mid);
    let flip = false;
    if (state.settings.autoFlip && Math.cos(norm(s.mid + getRot())) < 0) { flip = true; ctx.rotate(Math.PI); }
    ctx.textAlign = flip ? 'left' : 'right';
    ctx.textBaseline = 'middle';
    const baseFs = clamp(Math.min(R2 * 0.125, s.span * R2 * 0.52), MIN_FS, 27);
    const xOuter = flip ? -pad - maxLen : R2 - pad;
    /* ① 单行：先求能放下的最大字号 */
    let f1 = baseFs;
    while (f1 > MIN_FS && measureAt(f1, label) > maxLen) f1 -= 0.5;
    const singleOk = measureAt(f1, label) <= maxLen;
    /* ② 两行：两段并排，各自只用整段长度 */
    const readable = Math.max(baseFs * 0.72, 11);
    let f2 = 0, parts = null;
    if (!singleOk || f1 < readable) {
      for (let size = baseFs; size >= MIN_FS; size -= 0.5) {
        const p = splitTwoLines(label, maxLen, t => measureAt(size, t));
        if (!p) continue;
        /* 两行要横着占地方：最靠内的那行半径越小，切向越窄，窄过两行高度就塞不下 */
        const wMax = Math.max(measureAt(size, p[0]), measureAt(size, p[1]));
        const rIn = Math.max(hubR * 1.2, R2 - pad - wMax);
        const halfArc = Math.max(3, rIn * Math.sin(Math.min(s.span, Math.PI * 0.95) / 2));
        if (size * 1.24 <= halfArc * 2) { parts = p; f2 = size; break; }
      }
    }
    const useTwo = !!parts && f2 > f1 + 0.4;
    const fs = useTwo ? f2 : f1;
    ctx.font = '600 ' + fs.toFixed(1) + 'px ' + WFONT;
    ctx.fillStyle = textOn(s.color);
    ctx.shadowColor = 'rgba(0,0,0,.16)';
    ctx.shadowBlur = 3;
    if (useTwo) {
      const lh = fs * 1.24;
      ctx.fillText(parts[0], xOuter, -lh / 2);
      ctx.fillText(parts[1], xOuter,  lh / 2);
    } else {
      ctx.fillText(label, xOuter, 0);        // 不截断：超出圆盘的部分由上面的 clip 遮住
    }
    ctx.restore();
  });
  ctx.restore();
  ctx.restore();

  drawHub(cx, cy, R, hubR, cHub, cPtr, cSep);
}
function drawHub(cx, cy, R, hubR, cHub, cPtr, cSep){
  ctx.save();
  ctx.translate(cx, cy);
  // 小巧针尖：与中心圆盘同色，尖头只探出很短一截
  const baseY = -hubR * 0.5;          // 针尾（藏在圆盘里）
  const tipY  = -R * 0.22;            // 针尖高度：越接近 -R*0.155 越短
  const len   = baseY - tipY;         // 可见长度
  const pw    = R * 0.040;            // 半宽（保持不变）
  ctx.beginPath();
  ctx.moveTo(0, tipY);
  ctx.bezierCurveTo(pw * 1.55, tipY + len * 0.36, pw * 1.22, baseY, 0, baseY);
  ctx.bezierCurveTo(-pw * 1.22, baseY, -pw * 1.55, tipY + len * 0.36, 0, tipY);
  ctx.closePath();
  ctx.fillStyle = cPtr;                                   // = 中心圆盘色（--w-hub / --w-pointer）
  ctx.shadowColor = 'rgba(90,75,50,.22)';
  ctx.shadowBlur = R * 0.030;
  ctx.shadowOffsetY = R * 0.008;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = Math.max(1, R * 0.004);                 // 墨色细描边：两种主题下都有对比
  ctx.strokeStyle = cssVar('--ink', '#2A241C');
  ctx.globalAlpha = 0.5;
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(0, 0, hubR, 0, TAU);
  ctx.fillStyle = cHub; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, hubR - 0.5, 0, TAU);
  ctx.lineWidth = 1; ctx.strokeStyle = cSep; ctx.stroke();
  // 中心手绘墨圈
  ctx.strokeStyle = cssVar('--ink', '#2A241C');
  ctx.lineWidth = Math.max(1, R * 0.005);
  sketchCircle(0, 0, hubR * 1.04, 23, 1, 0.34);
  ctx.restore();
}
/* 手绘圈：固定种子生成轻微抖动，两次描边模拟毛笔重叠 */
function sketchCircle(cx, cy, r, seed, passes, alphaBase){
  const N = 96;
  for (let p = 0; p < passes; p++) {
    let s = seed + p * 977;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * TAU;
      const rr = r + (rnd() - 0.5) * r * 0.017 - p * r * 0.007;
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    ctx.globalAlpha = alphaBase * (p === 0 ? 1 : 0.62);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ============================== 分支流程 ============================== */
let jumpTimer = null, arriveTimer = null;
function wheelById(id){ return state.wheels.filter(w => w.id === id)[0] || null; }
function optById(wid, oid){
  const w = wheelById(wid);
  /* 走 findOptionById：兜底面和各层的面都找得到（多面转盘必需） */
  return w ? findOptionById(w, oid) : null;
}
function slotText(v){
  if (!v) return '未设置';
  if (v === END) return '流程结束';
  if (v === STAY) return '留在本盘';
  const t = wheelById(v);
  return t ? t.name : '（目标已删除）';
}
function nextOf(wheel, opt){
  const v = (opt && opt.next) || (wheel && wheel.next) || '';
  if (v === END) return { kind:'end' };
  if (v === STAY) return { kind:'stay' };
  if (v) {
    const t = wheelById(v);
    return t ? { kind:'wheel', id:t.id, wheel:t } : { kind:'none' };
  }
  /* 都没设 → 跟随「转盘页的列表顺序」里的下一个普通转盘（分支转盘跳过）；
     已经是最后一个就收尾。想停在原地请显式设「留在本盘」。 */
  const alt = wheel ? nextInOrderAfter(wheel.id) : null;
  if (alt) return { kind:'wheel', id:alt.id, wheel:alt, byOrder:true };
  return { kind:'end', byOrder:true };
}
let chartAutoTimer = null;
let chartFlowDone = null;          // 自动弹图时「收起之后接着要做什么」（流程继续往下一站）
/* 自动弹出的维度图被收起来了 → 通知流程继续。
   不管是到点自动收、还是用户自己按的关闭/返回，都从这里走；
   否则「用户提前关掉」会把流程永久卡在原地（pendingId 还在、但没有定时器了）。 */
function afterChartDismiss(){
  if (!chartFlowDone) return;
  const done = chartFlowDone;
  chartFlowDone = null;            // 先清再调，避免 done 里再触发一次
  try { done(); } catch(e){}
}
/* 自动弹出某张维度图，停留「设置里的秒数」后自动收起，然后执行 done（流程继续往下走）。
   · 弹出前会等一下（CHART_SHOW_DELAY），让抽奖的结果动效先播完
   · 弹出时刻用户已经开着别的面板 → 不抢焦点，直接把流程交给 done（不卡住）
   · 停留期间用户自己关掉 → 走 afterChartDismiss()，流程照常继续
   · 停留到点时图上又叠了别的面板 → 只认「这张图看过了」，流程交给 done 里的 continueFlow 兜底 */
function showChartThen(chart, done){
  if (!chart) { if (done) done(); return; }
  clearTimeout(chartAutoTimer);
  chartAutoTimer = setTimeout(() => {
    chartAutoTimer = null;
    if (isOverlayOpen()) { if (done) done(); return; }
    ui.chartItem = chart;
    navTo('chart');
    toast('本站属性维度图 · ' + chartDwellSec(state.settings.chartDwell) + ' 秒后继续', { action:'现在继续', fn:() => navGoBack() });
    chartFlowDone = () => {
      hideToast();
      setTimeout(() => { if (done) done(); }, CHART_RESUME_GAP);
    };
    chartAutoTimer = setTimeout(() => {
      chartAutoTimer = null;
      /* 还停在维度图上 → 正常收起（navGoBack 会走 afterChartDismiss）；
         已经被别的东西盖住了 → 只认「这张图看过了」 */
      if (isOverlayOpen() && ui.view === 'chart' && ui.chartItem === chart) navGoBack();
      else afterChartDismiss();
    }, chartAutoDwellMs());
  }, CHART_SHOW_DELAY);
}
/* 位置正好在某个转盘之后的维度图 */
function chartAfter(wheelId){
  const hit = (state.charts || []).filter(c => c.after === wheelId);
  return hit.length ? hit[hit.length - 1] : null;
}
/* 流程走到这个转盘时要不要顺手弹一张维度图（开关 + 停留时长都算上） */
function chartMidAt(wheelId){
  if (state.settings.chartMid === false) return null;
  if (!(chartDwellSec(state.settings.chartDwell) > 0)) return null;
  return chartAfter(wheelId);
}
/* 收好尾之后真正跳到下一站：定时器回调、维度图收起回调、手动「→ 下一站」都走这里。
   这一段是从 flowJump 里抽出来的：多一条路进来就少一个"忘了清 pendingId"的坑。 */
function continueFlow(id){
  const f = state.flow;
  if (!f || !f.autoJump || f.paused || f.finished) return false;
  const target = wheelById(id);
  if (!target) { f.pendingId = ''; renderFlowBar(); return false; }
  clearJump();
  f.pendingId = '';
  switchTo(id, { silent:true, spin: f.autoSpin });
  return true;
}
/* 流程走完时：如果有维度图，就自动展示（可在设置里关掉「流程结束时弹出属性维度图」） */
function showChartForEnd(){
  if (state.settings.chartOnEnd === false) return;
  const list = state.charts || [];
  if (!list.length) return;
  const last = list.slice().sort((a, b) => chartSlotIndex(a) - chartSlotIndex(b))[list.length - 1];   // 位置最靠后的那张
  showChartThen(last, null);
}
/* 给界面用：这个转盘的「默认下一站」实际会去哪儿 */
function defaultTargetLabel(w){
  const nx = nextOf(w, null);
  if (nx.kind === 'wheel') return nx.wheel.name + (nx.byOrder ? '（按列表顺序）' : '');
  if (nx.kind === 'end') return nx.byOrder ? '流程结束（已是最后一个）' : '流程结束';
  if (nx.kind === 'stay') return '留在本盘';
  return '未设置';
}
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }
function clearJump(){
  if (jumpTimer) { clearTimeout(jumpTimer); jumpTimer = null; }
  if (arriveTimer) { clearTimeout(arriveTimer); arriveTimer = null; }
}
async function switchTo(id, opts){
  opts = opts || {};
  const target = wheelById(id);
  if (!target) return;
  clearJump();
  if (id === state.currentId) { if (opts.spin) spin(); return; }
  const stage = $('.stage');
  /* 拿不到舞台元素也要能跳（比如 DOM 被改过 / 别的地方复用了跳转逻辑），
     不能让"少一个淡出动画"把整条流程打断 */
  if (stage) stage.classList.add('fading');
  await wait(160);
  state.currentId = id;
  ui.flowCollapsed = true;              // 跳转后先收起流程条，避免抢视线
  setResult('？', false);
  resultEl.classList.remove('small');
  refreshTitle();
  requestDraw();
  save();
  if (stage) stage.classList.remove('fading');

  if (opts.spin) arriveTimer = setTimeout(() => { arriveTimer = null; spin(); }, 500);

function resetFlow(){
  const f = state.flow;
  clearJump();
  f.path = []; f.pendingId = ''; f.finished = false; f.retStack = []; f.paused = false;
  f.grow = {};                                   // 新一轮：清空成长累计
  f.roundAt = Date.now();                        // 新的一轮：属性图从这一刻重新算
  const rootId = (f.rootId && wheelById(f.rootId)) ? f.rootId : state.currentId;
  save();

/* 列表顺序里，某个转盘之后的下一个「非分支」转盘（分支转盘不进默认顺序） */
function nextInOrderAfter(wheelId){
  const idx = state.wheels.findIndex(w => w.id === wheelId);
  if (idx < 0) return null;
  for (let i = idx + 1; i < state.wheels.length; i++) {
    if (!state.wheels[i].branch) return state.wheels[i];
  }
  return null;
}
function flowJump(w, opt, label){
  const f = state.flow;
  if (!f.enabled) return;
  if (!Array.isArray(f.retStack)) f.retStack = [];
  f.path.push({ wheelId:w.id, wheel:w.name, label:label, at:Date.now() });
  if (f.path.length > 160) f.path = f.path.slice(-120);
  ui.flowCollapsed = false;

  const explicit = !!(opt && opt.next);
  let nx = nextOf(w, opt);
  /* 分支转盘本身不在默认顺序里：抽完如果没为这个选项设目标，
     就回到「当初从哪个转盘拐进来的」，接着那个转盘的默认下一站往下走 */
  if (w.branch && !explicit) {
    let guard = 0;
    while (nx.kind === 'none' && f.retStack.length && guard++ < 30) {
      const back = f.retStack.pop();
      const origin = back ? wheelById(back.origin) : null;
      if (!origin) continue;
      nx = nextOf(origin, null);
      /* 「接着原转盘的默认顺序」：
         - 原盘没设默认下一站 → 顺着列表顺序找下一个普通转盘
         - 原盘的默认下一站就是这条分支自己（或另一个分支）→ 同上，避免自己跳回自己
         - 只有明确写了「结束」才真的结束 */
      if (nx.kind === 'none' || (nx.kind === 'wheel' && (nx.wheel.id === w.id || nx.wheel.branch))) {
        const alt = nextInOrderAfter(origin.id);
        nx = alt ? { kind:'wheel', id:alt.id, wheel:alt } : { kind:'none' };
      }
      if (origin.branch && nx.kind === 'none') continue;   // 原转盘自己也是分支 → 继续往外找
      break;
    }
  }
  if (nx.kind === 'end') {
    f.pendingId = ''; f.finished = true;
    saveRoundChart();                               // 记录一下本局结果（供导出/统计）
    save(); renderFlowBar();
    toast('流程结束：' + label, { action:'重新开始', fn:resetFlow });
    showChartForEnd();                              // 按位置自动展示维度图
    return;
  }
  if (nx.kind === 'wheel') {
    /* 防死循环：最近 12 步里出现「长度 1~4 的循环重复 3 轮以上」→ 临时暂停自动跳转
       （只暂停，不改开关；点「继续」/手动切换/重来即恢复） */
    const loopLen = f.autoJump && !f.paused ? loopDetected() : 0;
    if (loopLen) {
      f.paused = true; f.pendingId = '';
      save(); renderFlowBar();
      const where = loopLen === 1 ? ('「' + w.name + '」') : (loopLen + ' 个转盘之间');
      toast('流程在 ' + where + ' 反复循环，已临时暂停自动跳转', { action:'继续连转', fn:() => { state.flow.paused = false; renderFlowBar(); toast('已恢复自动跳转'); } });
      return;
    }
    /* 顺序走到维度图那一位：先弹出来看一眼，自动收起后再继续往下一站。
       只在"会自动往下走"的时候才弹（手动模式 / 已暂停时点「→ 下一站」就行，别抢注意力）。
       开关：「中途自动弹出维度图」(chartMid)，停留时长见设置里的 chartDwell。 */
    const midChart = (f.autoJump && !f.paused) ? chartMidAt(w.id) : null;
    if (midChart) {
      if (nx.wheel.branch) f.retStack.push({ origin: w.id }); else f.retStack.length = 0;
      f.pendingId = nx.id;
      const here = state.currentId;                 // 收图那一刻还停在本盘才算数
      save(); renderFlowBar();
      showChartThen(midChart, () => {
        if (state.currentId !== here) {             // 用户自己换了转盘 → 别把他拽回来
          if (state.flow.pendingId === nx.id) { state.flow.pendingId = ''; renderFlowBar(); }
          return;
        }
        continueFlow(nx.id);
      });
      return;
    }
    if (nx.wheel.branch) f.retStack.push({ origin: w.id });   // 拐进分支：记住回来的路
    else f.retStack.length = 0;                               // 回到主线：偏离结束
    f.pendingId = nx.id;
    save(); renderFlowBar();
    if (!f.autoJump || f.paused) return;           // 手动模式 / 已暂停：点顶部「→ 下一站」再走
    jumpTimer = setTimeout(() => {
      jumpTimer = null;
      continueFlow(nx.id);
    }, Math.max(400, num(f.delay) * 1000));
    return;
  }
  if (!w.branch) f.retStack.length = 0;            // 主线停在原地，同样算偏离结束
  f.pendingId = '';
  save(); renderFlowBar();
}
/* 最近 12 步里是否出现长度 1~4 的循环（重复 3 轮以上）→ 返回循环长度，否则 0 */
function loopDetected(){
  const p = state.flow.path;
  if (!p || p.length < 6) return 0;
  const ids = p.slice(-12).map(x => x.wheelId);
  for (let len = 1; len <= 4; len++) {
    const need = len * 3;
    if (ids.length < need) continue;
    let same = true;
    for (let i = ids.length - need + len; i < ids.length; i++) {
      if (ids[i] !== ids[i - len]) { same = false; break; }
    }
    if (same) return len;
  }
  return 0;
}
let flowCollapseTimer = null;

/* ============================== 属性维度（等级 → 维度图） ==============================
   像「E- / E / D / C / B / A / S / SS / SSS / EX」这种带等级的转盘，
   抽完一轮后汇总成一张雷达图。分值 = 等级 × 10（E- = 17，EX = 100）。
   ==================================================================================== */
const GRADES = { F:1, E:2, D:3, C:4, B:5, A:6, S:7, SS:8, SSS:9, EX:10 };
function parseGrade(label){
  const m = String(label == null ? '' : label).match(/^\s*(EX|SSS|SS|S|A|B|C|D|E|F)\s*([+\-＋－]?)/i);
  if (!m) return null;
  let v = GRADES[m[1].toUpperCase()];
  if (v == null) return null;
  if (m[2] === '+' || m[2] === '＋') v += 0.3;
  else if (m[2] === '-' || m[2] === '－') v -= 0.3;
  return Math.max(0, Math.min(10, v));
}
/* 这个转盘算不算「属性盘」：手动指定优先，否则看选项里等级标签的比例
   注意：按「当前展示的全部选项」判断，不受临时停用（权重 0）影响；
        多面转盘按**当前命中的那一面**看。 */
function isGradeWheel(w){
  if (!w) return false;
  if (w.grade === true) return true;
  if (w.grade === false) return false;
  const opts = wheelOptions(w);
  if (!opts.length) return false;
  const hit = opts.filter(o => parseGrade(o.label) != null).length;
  return hit >= Math.ceil(opts.length * 0.6);
}
/* ===== 成长：转到「XX+N」就给对应属性升 N 级（EX 封顶） ===== */
const GRADE_LADDER = ['E-', 'E', 'D', 'C', 'B', 'A', 'S', 'SS', 'SSS', 'EX'];
/* 简称 → 转盘名（成长转盘里写的是「体术」「评级」这种简称） */
const GROW_ALIAS = [
  ['体术', '体术水平'], ['体质', '体质（基础体质）'], ['咒操', '咒力操纵'], ['操纵', '咒力操纵'],
  ['效率', '咒力效率'], ['评级', '等级评定'], ['高级技巧', '高级技巧会几个'],
  ['颜值', '穿越后的颜值'], ['道德', '道德水平'], ['咒力总量', '咒力总量'], ['天赋', '天赋']
];
/* 成长文字里那个「名字」最长多少字。
   ⚠️ 超过这个长度就解析不到（会安静地不生效）—— 所以：
      · 转盘名超过 24 字的，写成长时请用简称（部分匹配也算），或者把转盘名改短
      · 编辑器里会对过长的写法给出提示，见 growHintFor() */
const GROW_WORD_MAX = 24;

function growTargetWheel(word){
  const clean = String(word || '').replace(/[\s（(【\[].*$/, '').replace(/[的了之]$/, '').trim();
  if (!clean) return null;
  const ws = state.wheels || [];
  let w = ws.filter(x => x.name === clean)[0];
  if (!w) w = ws.filter(x => x.name.indexOf(clean) >= 0)[0];
  if (!w) {
    const a = GROW_ALIAS.filter(pr => clean.indexOf(pr[0]) >= 0 || pr[0].indexOf(clean) >= 0)[0];
    if (a) w = ws.filter(x => x.name === a[1])[0] || ws.filter(x => x.name.indexOf(a[1].replace(/（.*$/, '')) >= 0)[0];
  }
  return w || null;
}
/* 编辑器用：这个成长写法能不能对上转盘？
   返回 null 表示没问题；否则返回一句提示。 */
function growHintFor(label){
  const s = String(label || '');
  if (!/[＋+]/.test(s)) return null;
  if (/无属性成长|虚度光阴/.test(s)) return null;          // 明确不成长
  const words = [];
  const mAll = s.match(/[（(]([^）)]*)[＋+]/);
  [mAll ? mAll[1] : null, s].filter(Boolean).forEach(body => {
    const re = new RegExp('([^＋+\\d（()）]{1,' + GROW_WORD_MAX + '}?)\\s*[＋+]\\s*(\\d+)', 'g');
    let m;
    while ((m = re.exec(body))) m[1].split(/[与和、,，]/).forEach(nm => words.push(nm));
  });
  if (!words.length) return null;                          // 没解析到词，不以为是成长
  const bad = words.filter(w => !growTargetWheel(w));
  if (bad.length) return '看不出「' + bad.join('、') + '」对应哪个转盘 —— 这个成长不会生效（写转盘名或它的一部分）';
  /* 词太长的情况：整体写法可能已经被正则截断 */
  if (s.length > GROW_WORD_MAX && !/无属性成长/.test(s)) {
    const anyByName = words.some(w => growTargetWheel(w));
    if (!anyByName && s.length > GROW_WORD_MAX) return '写法太长了，成长词最多 ' + GROW_WORD_MAX + ' 字';
  }
  return null;
}
/* 解析一次抽屉结果的成长项：[{ wheel, steps }]；「虚度光阴（无属性成长）」返回空
   支持这些写法：
     体术+1                        简称（走别名表）
     咒力操纵+1 / 剑术造诣+1        转盘名（或名字的一部分）
     体质（基础体质）+1             **写全名、带括号**也行（见下面"括号名"那段）
     我掌握了咒力的核心！（咒操与效率+1）   括号里的补充说明；「与/和/、」隔开的多目标共用 +N
     我悟了！（阴阳术+1）（剑术+1）         多个括号各算各的 */
function parseGrowth(label){
  const s = String(label || '');
  if (/无属性成长|虚度光阴/.test(s)) return [];
  const out = [], seen = {};
  const push = (word, n) => {
    const w = growTargetWheel(word);
    if (!w || seen[w.id]) return;
    seen[w.id] = 1;
    out.push({ wheel: w, steps: Math.max(1, Math.min(5, n)) });
  };
  const scan = (body, allowParens) => {
    /* allowParens：允许匹配段里出现括号 —— 用来认「（咒操与效率+1）」这种整段，
       以及「体质（基础体质）+1」这种名字自带括号的写法 */
    const cls = allowParens ? '[^＋+\\d）)]' : '[^＋+\\d（()）]';
    const re = new RegExp('(' + cls + '{1,' + GROW_WORD_MAX + '}?)\\s*[＋+]\\s*(\\d+)', 'g');
    let m;
    while ((m = re.exec(body))) {
      const n = parseInt(m[2], 10) || 1;
      m[1].split(/[与和、,，]/).forEach(nm => push(nm, n));   // 「咒操与效率+1」→ 两个目标共用 +1
    }
  };
  scan(s, false);                       // ① 正常扫一遍（不含括号的写法）
  /* ② 名字自带括号的情况：「体质（基础体质）+1」
        上面的扫描会在括号处截断，解析不出「体质（基础体质）」→ 这里补一轮特殊处理。
        做法：找「（…）」紧跟 +N 的片段，把括号里的内容**并进**它前面的词。
        ⚠️ 这一步只在"值本身带括号"时才做，避免把「我悟了！（阴阳术+1）」
           这种"说明文字里带成长"的写法误读成一整个长名字。 */
  {
    const re2 = /([^＋+\d（()）]{1,24})\s*[（(]([^）)]*)[）)]\s*[＋+]\s*(\d+)/g;
    let m2;
    while ((m2 = re2.exec(s))) {
      const n = parseInt(m2[3], 10) || 1;
      if (growTargetWheel(m2[1] + '（' + m2[2] + '）')) push(m2[1] + '（' + m2[2] + '）', n);
    }
  }
  /* ③ 括号里的补充说明也可能带成长：我掌握了咒力的核心！（咒操与效率+1）
        也可能有多个括号：我悟了！（阴阳术+1）（剑术+1） */
  {
    const re3 = new RegExp('[（(]([^）)]{1,80}?)[）)]\\s*(?=[（(]|$)', 'g');
    let m3;
    while ((m3 = re3.exec(s))) scan(m3[1], true);
  }
  return out;
}
/* 把标签沿「阶梯」上移 steps 级：等级型走 E-…EX，数字型（3个/不会）按该盘自己的选项排序，顶格即封顶 */
function growLabel(wheel, label, steps){
  if (!wheel || !steps) return label;
  const base = String(label || '').replace(/[（(].*$/, '').trim();
  const li = GRADE_LADDER.indexOf(base);
  if (li >= 0) {
    const next = GRADE_LADDER[Math.min(GRADE_LADDER.length - 1, li + steps)];
    /* 在该盘**当前展示的**选项里找哪一项是这个等级（多面转盘要看当前那一面） */
    const full = wheelOptions(wheel).filter(o => String(o.label).replace(/[（(].*$/, '').trim() === next)[0];
    return full ? full.label : next;      // 「C」→ 该盘里的「C（三级）」
  }
  const numOf = v => { const m = String(v).match(/(\d+)/); return m ? parseInt(m[1], 10) : (/不会|无|零/.test(v) ? 0 : null); };
  const cur = numOf(base);
  if (cur != null) {
    const opts = wheelOptions(wheel);
    const nums = opts.map(o => numOf(o.label)).filter(v => v != null).sort((a, b) => a - b);
    if (nums.length) {
      const want = Math.min(nums[nums.length - 1], cur + steps);
      const hit = opts.filter(o => numOf(o.label) === want)[0];
      if (hit) return hit.label;
    }
  }
  return label;
}
/* 叠加本轮已累计的成长 */
function grownLabel(wheelId, label){
  const g = (state.flow.grow || {})[wheelId];
  if (!g || label == null) return label;
  return growLabel(wheelById(wheelId), label, g);
}
/* 本轮某个属性最近一次抽到的原始标签 */
function lastLabelOf(wheelId){

  if (!state.flow.grow || typeof state.flow.grow !== 'object') state.flow.grow = {};
  const msgs = [];
  list.forEach(({ wheel, steps }) => {
    const raw = lastLabelOf(wheel.id);

    const beforeTxt = before || '—';
    const grown = grownLabel(wheel.id, raw == null ? growLabel(wheel, GRADE_LADDER[0], 0) : raw);

    while (fs2 > 9 && ctx.measureText(valTxt).width > avail) { fs2 -= 0.5; ctx.font = '700 ' + fs2 + 'px ' + WFONT; }

let chartRaf = 0;
function startChartAnim(cv, dims, fromDims){
  cancelAnimationFrame(chartRaf);
  const fromMap = {};
  (fromDims || []).forEach(d => { fromMap[d.wheel] = num(d.value); });
  const fromVals = dims.map(d => (fromMap[d.wheel] != null ? fromMap[d.wheel] : 0));
  const hasPrev = (fromDims || []).length > 0;
  const t0 = performance.now(), dur = 3000;         // 和音效等长（3 秒）
  const growth = GEAR_TURN_AT;                      // 数据图形在蓄力段就长好
  loadGearSfx();
  let played = playGearSfx();
  let triedSynth = false;
  (function frame(now){
    const t = clamp((now - t0) / dur, 0, 1);       // 钳到 0~1，避免时钟差异算出负进度
    if (!played) {                                  // 真音效还没解码好：等着补播，绝不误用合成音
      loadGearSfx();
      played = playGearSfx();
      if (!played && !hasGearSfx() && !triedSynth) { triedSynth = true; gearTick(); }
    }
    const gm = gearMotion(t);
    drawRadar(cv, dims, clamp(t / growth, 0, 1), fromVals, gm.deg, gm.dy, gm.sc);   // 法轮：前段抖动、后段转 45°
    if (t < 1) chartRaf = requestAnimationFrame(frame);
  })(t0);
}

function chartLiveDims(item){
  const full = chartDims();                       // 本轮到目前为止抽过的全部属性
  if (!item) return dimsUpTo('');
  const a = (item.after == null) ? '' : item.after;
  /* ① 放在「列表最前 / 所有转盘之后」→ 这两处本来就是"整轮"的位置，直接统计本轮全部 */
  if (a === '__top__' || !a) return full.length ? full : (item.dims || []);
  /* ② 指定了某个转盘之后 → 只统计它之前的属性盘（没抽到的显示 0，这是刻意的：
        位置靠前的图本来就该是"那一刻的快照"，只有 0 才是真实情况） */
  const scoped = dimsUpTo(a);
  if (scoped.length) return scoped;
  /* ③ 那个范围里一个属性盘都没有（比如放在成长盘后面，属性盘还在更后面）→
        退回本轮全部，否则这张图永远是空的 */
  return full.length ? full : (item.dims || []);
}

let toastTimer = null;
function toast(msg, opts){
  const el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>';
  if (opts && opts.action) {
    const b = document.createElement('button');
    b.className = 'toast-act';
    b.textContent = opts.action;
    b.onclick = () => { hideToast(); try { opts.fn && opts.fn(); } catch(e){} };
    el.appendChild(b);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, (opts && opts.action) ? 3400 : 1800);
}
function hideToast(){ $('#toast').classList.remove('show'); }

function askDialog(o){
  o = o || {};
  return new Promise(resolve => {
    const ov = $('#confirmOverlay');
    $('#cTitle').textContent = o.title || '提示';
    const d = $('#cDesc'); d.textContent = o.desc || ''; d.hidden = !o.desc;
    const inp = $('#cInput');
    const isInput = o.value !== undefined && o.value !== null;
    inp.hidden = !isInput;
    if (isInput) inp.value = o.value;
    const ok = $('#cOk');
    ok.textContent = o.ok || '确定';
    ok.classList.toggle('danger', !!o.danger);
    ov.classList.add('open');
    if (isInput) setTimeout(() => { try { inp.focus(); inp.select(); } catch(e){} }, 60);
    const finish = v => {
      ov.classList.remove('open');
      ok.onclick = null; $('#cCancel').onclick = null; inp.onkeydown = null; ov.onclick = null;
      resolve(v);
    };
    ok.onclick = () => finish(isInput ? inp.value : true);
    $('#cCancel').onclick = () => finish(isInput ? null : false);
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ok.click(); } };
    ov.onclick = e => { if (e.target === ov) finish(isInput ? null : false); };
  });
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast('已复制'); return; } catch(e){}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); ta.remove(); toast('已复制');
  } catch(e){ toast('复制失败，请长按手动选择'); }
}

        : '<div class="empty">依据的那个转盘还没有选项</div>') + '</div>' +
        '<div class="hint">也可以直接编辑下面的文字，手写要匹配的内容。</div>' +
        '<input class="opt-input" style="width:100%" data-field="faceWhenValue" value="' + esc(when.value || '') + '" placeholder="要匹配的文字">';
    }
  }
  return head + '<div class="sheet-body">' +
    '<div class="hint">依据：<b>' + esc(src ? src.name : '（没设置）') + '</b>' +
      (src ? '（本轮最近一次：' + esc(lastResultOf(src) || '还没抽过') + '）' : '') + '</div>' +
    '<div class="sec-title">条件</div>' +
    '<div class="tools">' + FACE_WHEN.map(x =>
      '<button class="mini' + (when.type === x[0] ? ' on' : '') + '" data-act="setFaceWhenType" data-val="' + x[0] + '" title="' + esc(x[2]) + '">' +
      x[1] + '</button>').join('') + '</div>' +
    '<div class="hint">' + esc((FACE_WHEN.filter(x => x[0] === when.type)[0] || FACE_WHEN[5])[2]) + '</div>' +
    valueBlock +
    '<div class="hint">这个面当前是：<b>' + esc(whenLabel(when)) + '</b></div>' +
  '</div>';
}

/* 按 id 找一个选项 —— 兜底面和各层的面都要找。
   ⚠️ 凡是"按 id 定位选项"的地方都该用它（输入、删除、改色、跳转目标…），
      只查 w.options 会让多面转盘的面里那些选项变成"点了没反应"。 */
function findOptionById(w, id){
  if (!w || !id) return null;
  const hit = (w.options || []).filter(o => o.id === id)[0];
  if (hit) return hit;
  const faces = Array.isArray(w.faces) ? w.faces : [];
  for (let i = 0; i < faces.length; i++) {
    const arr = (faces[i] && Array.isArray(faces[i].options)) ? faces[i].options : [];
    const f = arr.filter(o => o.id === id)[0];
    if (f) return f;
  }
  return null;
}
/* 编辑操作（增删/改色/乱序/清空/批量）作用在「当前编辑的那一面」上。
   ⚠️ 普通转盘就是 w.options；多面转盘要看「选项内容」页顶上选了哪一面。 */
function editOpts(w, create){
  const x = w || currentWheel();
  if (!isMultiWheel(x)) return x.options;
  const idx = editFaceIndex(x);
  if (idx < 0) return x.options;
  const f = (x.faces || [])[idx];
  if (!f) return x.options;
  if (!Array.isArray(f.options) && create) f.options = [];
  if (!Array.isArray(f.options)) f.options = [];
  return f.options;
}
function editOptsName(w){
  const x = w || currentWheel();
  if (!isMultiWheel(x)) return '';
  const idx = editFaceIndex(x);
  return idx < 0 ? '兜底面' : ('第 ' + (idx + 1) + ' 面');
}

/* 成长写法的自查提示：选项里写了「XX+N」但 XX 对不上任何转盘时提醒一下 ——
   因为那种情况是**安静地不生效**的（不会报错，只是转了也白转）。 */
function growHintBlock(w, list){

    bad.map(l => '· <b>' + esc(l) + '</b> —— ' + esc(growHintFor(l))).join('<br>') +
    '<br>写法：<b>转盘名+1</b>，或者转盘名的一部分（如「咒力+1」→ 咒力总量）。' +
    '转盘名超过 ' + GROW_WORD_MAX + ' 字时请写简称。</div>';
}
