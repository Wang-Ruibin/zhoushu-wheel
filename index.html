/* ============================== 导航：单一视图栈 + 返回键 ==============================
   · 所有面板都是「压栈」的一层，任何位置返回 = 退回上一层
   · 浏览器 / 安卓返回手势、Esc、左上返回键 三者走同一条 navBack()
   · 关掉整个面板时把之前压入的历史条目一次性回退，避免污染浏览历史
   ================================================================================= */
const NAV = { stack: [], swallowPop: 0, lastFocus: null, hideTimer: null };
const scrollMemo = {};
function isOverlayOpen(){ return $('#overlay').classList.contains('open'); }
function topNav(){ return NAV.stack.length ? NAV.stack[NAV.stack.length - 1] : null; }
function navDepth(){ return Math.max(0, NAV.stack.length - 1); }   // 已压入的历史条目数
function navHist(){ try { history.pushState({ nav: NAV.stack.length }, ''); } catch(e){} }
function showOverlay(){
  const ov = $('#overlay');
  NAV.lastFocus = document.activeElement;
  ov.classList.remove('closing');
  ov.classList.add('open');
}
function hideOverlay(){
  const ov = $('#overlay');
  if (!ov.classList.contains('open')) return;
  ov.classList.add('closing');
  clearTimeout(NAV.hideTimer);
  NAV.hideTimer = setTimeout(() => {
    ov.classList.remove('open', 'closing');
    const lf = NAV.lastFocus;
    if (lf && lf.focus && document.contains(lf)) { try { lf.focus(); } catch(e){} }
  }, 200);
}
/* 栈顶永远是「当前状态」；返回 = 弹出栈顶并应用新的栈顶 */
function navPush(entry, dir){
  NAV.stack.push(entry);
  ui.view = entry.view;
  if (entry.mtab) ui.mtab = entry.mtab;
  navHist();
  renderSheet(dir || 'push');
}
function navTo(view, opts){
  opts = opts || {};
  if (!NAV.stack.length) NAV.stack.push({ view:'none', mtab:ui.mtab });   // 根：主页
  const cur = topNav();
  if (cur && cur.view === view && !opts.force) {                          // 已在同一层：只切标签
    if (opts.mtab && opts.mtab !== ui.mtab) { navPush({ view:view, mtab:opts.mtab }, 'swap'); return; }
    if (opts.mtab) ui.mtab = opts.mtab;
    renderSheet('swap');
    return;
  }
  const first = !isOverlayOpen();
  navPush({ view:view, mtab: opts.mtab || ui.mtab }, opts.dir || 'push');
  if (first) {
    showOverlay();
    const sh = $('#sheet');
    if (sh && sh.focus) { try { sh.focus({ preventScroll:true }); } catch(e){} }
  }
}
function navBack(){
  if (navDepth() <= 0) {                      // 已在根：交给浏览器（真的退出页面）
    if (isOverlayOpen()) { NAV.stack.length = 0; ui.view = 'none'; hideOverlay(); return true; }
    return false;
  }
  NAV.stack.pop();
  const prev = topNav();
  ui.view = prev.view;
  if (prev.mtab) ui.mtab = prev.mtab;
  if (prev.view === 'none') hideOverlay();
  else renderSheet('pop');
  return true;
}
function navCloseAll(){
  const n = navDepth();
  const wasChart = ui.view === 'chart';
  NAV.stack.length = 0;
  ui.view = 'none';
  hideOverlay();
  if (n > 0) { NAV.swallowPop = 1; try { history.go(-n); } catch(e){} }
  if (wasChart) afterChartDismiss();          // 自动弹的维度图被关了 → 流程接着走
}
/* 界面上的「返回 / Esc」：本地退一层，同时把浏览器历史也退一格，
   否则会留下“按了没反应”的历史条目（下次真的按返回键会空跳） */
function navGoBack(){
  if (chartAutoTimer) { clearTimeout(chartAutoTimer); chartAutoTimer = null; }
  hideToast();                      // 自动弹图的提示条别跟着飘在下一站
  if (navDepth() <= 0) { if (isOverlayOpen()) navCloseAll(); return false; }
  const wasChart = ui.view === 'chart';
  NAV.swallowPop++;
  try { history.go(-1); } catch(e){ NAV.swallowPop--; }
  const r = navBack();
  if (wasChart) afterChartDismiss();          // 自动弹的维度图被关了 → 流程接着走
  return r;
}
/* 兼容旧调用点 */
function openSheet(view, mtab){ navTo(view, mtab ? { mtab:mtab } : null); }
function closeSheet(){ navCloseAll(); }

function renderSheet(dir){
  const sheet = $('#sheet');
  const key = ui.view + '|' + ui.mtab;
  const prevBody = sheet.querySelector('.sheet-body');
  if (prevBody && sheet.dataset.scrollKey) scrollMemo[sheet.dataset.scrollKey] = prevBody.scrollTop;
  let cls = 'sheet', html = '';
  if (ui.view === 'manager')      { cls = 'sheet full'; html = viewManager(); }
  else if (ui.view === 'batch')   { html = viewBatch(); }
  else if (ui.view === 'target')  { html = viewTarget(); }
  else if (ui.view === 'chart')   { cls = 'sheet chart-sheet'; html = viewChart(); }
  else if (ui.view === 'newpick') { html = viewNewPick(); }
  else if (ui.view === 'newchart'){ html = viewNewChart(); }
  else if (ui.view === 'faces')   { html = viewFaces(); }
  else if (ui.view === 'facewhen'){ html = viewFaceWhen(); }
  else if (ui.view === 'result')  { html = viewResult(); }
  sheet.className = cls;
  const ovEl = $('#overlay');
  if (ovEl) ovEl.classList.toggle('center', ui.view === 'chart');   // 维度图：居中显示
  sheet.innerHTML = '<div class="sheet-inner' + (dir ? ' ' + dir : '') + '">' + html + '</div>';
  const body = sheet.querySelector('.sheet-body');
  if (body) body.scrollTop = scrollMemo[key] || 0;
  sheet.dataset.scrollKey = key;
  if (ui.view === 'chart') {                     // 维度图：画布就绪后播放生长/变形动画
    const dims = ui.chartDims || [];
    const from = ui.chartFrom || null;
    requestAnimationFrame(() => {
      const cv = $('#chartCv');
      if (cv && dims.length) startChartAnim(cv, dims, from);
    });
  }
}

/* ============================== 动作处理 ============================== */
function refreshTitle(){
  const w = currentWheel();
  $('#wheelName').textContent = w ? w.name : '咒术转盘';
  renderFlowBar();
}
function applyTheme(){
  document.documentElement.dataset.theme = state.settings.theme === 'dark' ? 'dark' : 'light';
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = state.settings.theme === 'dark' ? '#141317' : '#F3EFE4';
  requestDraw();
}
function moveWheel(id, dir){
  const i = state.wheels.findIndex(w => w.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= state.wheels.length) return;
  const t = state.wheels[i]; state.wheels[i] = state.wheels[j]; state.wheels[j] = t;
  save(); renderSheet();
}
/* shuffleArr 在 js/util.js 里 */
function exportData(){
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '咒术转盘备份-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('已导出备份文件');
  } catch(e){ toast('导出失败'); }
}
function stateOptionCount(s){
  return (s.wheels || []).reduce((total, wheel) => {
    const faceTotal = (wheel.faces || []).reduce((n, facet) => n + ((facet.options || []).length), 0);
    return total + (wheel.options || []).length + faceTotal;
  }, 0);
}
function importSummary(raw, next){
  const version = Math.max(1, num(raw && raw.version) || 1);
  const warnings = [];
  if (version > STATE_VER) warnings.push('备份来自更高版本，未知字段可能无法保留');
  if (!(raw && Array.isArray(raw.history))) warnings.push('备份没有历史记录');
  if (next.wheels.some(w => !wheelOptions(w).some(o => num(o.weight) > 0))) warnings.push('包含没有可抽选项的转盘');
  return {
    version,
    wheels:next.wheels.length,
    options:stateOptionCount(next),
    history:next.history.length,
    warnings
  };
}
function importSummaryText(summary){
  const lines = [
    '备份版本：v' + summary.version,
    '内容：' + summary.wheels + ' 个转盘、' + summary.options + ' 个选项、' + summary.history + ' 条历史',
    '导入前会自动保留当前数据，可在设置里“撤销上次导入”。'
  ];
  if (summary.warnings.length) lines.push('注意：' + summary.warnings.join('；'));
  return lines.join('\n');
}
function markStorageFailure(error){
  storageStatus.ok = false;
  storageStatus.error = (error && error.message) || '浏览器拒绝写入';
}
function replaceStateWithRecovery(next, beforeRaw){
  const nextRaw = JSON.stringify(next);
  try {
    localStorage.setItem(RECOVERY_KEY, beforeRaw);
    localStorage.setItem(LS_KEY, nextRaw);
  } catch(e) {
    try { localStorage.setItem(LS_KEY, beforeRaw); } catch(ignore){}
    markStorageFailure(e);
    return false;
  }
  importRecoveryRaw = beforeRaw;
  state = next;
  storageStatus.ok = true;
  storageStatus.at = Date.now();
  storageStatus.error = '';
  storageErrorShown = false;
  scheduleSync();
  return true;
}
async function importDataText(text, confirmImport){
  let raw, next;
  try {
    raw = JSON.parse(text);
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('根内容不是对象');
    next = normalize(raw);
  } catch(e) {
    return { ok:false, error:'文件格式不正确' };
  }
  if (!next.wheels.length) return { ok:false, error:'文件里没有转盘数据' };
  const summary = importSummary(raw, next);
  const confirmed = confirmImport
    ? await confirmImport(summary)
    : await askDialog({ title:'确认导入备份', desc:importSummaryText(summary), ok:'导入' });
  if (!confirmed) return { ok:false, cancelled:true, summary };
  const beforeRaw = JSON.stringify(state);
  if (!replaceStateWithRecovery(next, beforeRaw)) {
    return { ok:false, error:'无法创建恢复点，当前数据没有改变', summary };
  }
  applyTheme(); refreshTitle(); requestDraw(); renderSheet();
  return { ok:true, summary };
}
async function restoreImportState(confirmRestore){
  if (!importRecoveryRaw) return false;
  let previous;
  try { previous = normalize(JSON.parse(importRecoveryRaw)); } catch(e) { return false; }
  if (!previous.wheels.length) return false;
  const confirmed = confirmRestore
    ? await confirmRestore(previous)
    : await askDialog({ title:'撤销上次导入', desc:'恢复导入前的 ' + previous.wheels.length + ' 个转盘；当前数据会成为新的恢复点。', ok:'恢复' });
  if (!confirmed) return false;
  const currentRaw = JSON.stringify(state);
  if (!replaceStateWithRecovery(previous, currentRaw)) return false;
  applyTheme(); refreshTitle(); requestDraw(); renderSheet();
  return true;
}
function dropLayerIf(view){ const t = topNav(); if (t && t.view === view) NAV.stack.pop(); }
async function handleAction(act, id, el){
  const w = currentWheel();
  switch (act) {
    case 'close': closeSheet(); break;
    case 'back': navGoBack(); break;
    case 'addWheel': {
      const name = await askDialog({ title:'新建转盘', desc:'给新转盘起个名字', value:'新转盘', ok:'创建' });
      if (name === null) return;
      const nw = makeWheel((name || '').trim() || '新转盘', ['选项 1', '选项 2', '选项 3', '选项 4']);
      state.wheels.push(nw); state.currentId = nw.id;
      save(); refreshTitle(); requestDraw();
      dropLayerIf('newpick');
      navTo('manager', { mtab:'content' });        // 建完直接进它的选项内容，返回即回列表
      toast('已创建「' + nw.name + '」');
      break;
    }
    case 'newPick': navTo('newpick'); break;
    case 'pickRoot':
      ui.targetCtx = { kind:'root', wheel:'', opt:'', cur: state.flow.rootId || '' };
      navTo('target'); break;
    case 'pickDefTarget':
      ui.targetCtx = { kind:'def', wheel:w.id, opt:'', cur: w.next || '' };
      navTo('target'); break;
    case 'chartUp': case 'chartDown': {
      const c = state.charts.filter(x => x.id === id)[0];
      if (!c) break;
      moveChart(c, act === 'chartUp' ? -1 : 1);
      renderSheet('swap');
      toast('维度图位置：' + chartPositionText(c));
      break;
    }
    case 'openChartItem': {
      const c = state.charts.filter(x => x.id === id)[0];
      if (!c) break;
      ui.chartItem = c;
      navTo('chart');
      break;
    }
    case 'newChartItem':
      ui.newChartName = ui.newChartName || ('属性维度图 ' + (state.charts.length + 1));
      navTo('newchart');
      break;
    case 'setAnchor': {
      const inp = $('#newChartName');
      if (inp && inp.value) ui.newChartName = inp.value;
      ui.newChartAnchor = el.dataset.val || '';
      renderSheet('swap');
      break;
    }
    case 'doCreateChart': {
      const inp = $('#newChartName');
      const nm = inp ? inp.value : ui.newChartName;
      const r = createChartSnapshot(nm, ui.newChartAnchor || '');
      if (!r.ok) { toast(r.msg); break; }
      ui.chartItem = r.item;
      dropLayerIf('newchart');
      navTo('chart');
      toast(r.prev ? '已生成，从「' + r.prev.name + '」变形过来' : '已生成第一张维度图');
      break;
    }
    case 'delChart': {
      const c = state.charts.filter(x => x.id === id)[0];
      if (!c) break;
      const okDel = await askDialog({ title:'删除维度图', desc:'确定删除「' + c.name + '」？删掉后它的快照就没了。', ok:'删除', danger:true });
      if (!okDel) return;
      state.charts = state.charts.filter(x => x.id !== id);
      if (ui.chartItem && ui.chartItem.id === id) ui.chartItem = null;
      save();
      if (ui.view === 'chart') navGoBack();
      else { ui.view = 'manager'; renderSheet('swap'); }
      toast('已删除');
      break;
    }
    case 'use':
      state.currentId = id; state.flow.retStack = []; state.flow.paused = false;
      save(); refreshTitle(); requestDraw(); renderSheet();
      toast('已切换到「' + currentWheel().name + '」'); break;
    case 'rename': {
      const x = wheelById(id);
      if (!x) break;
      const name = await askDialog({ title:'重命名转盘', desc:'数据文件里的转盘名也会用这个名字', value:x.name, ok:'保存' });
      if (name === null) return;
      const v = String(name).trim();
      if (!v) { toast('名字不能为空'); break; }
      x.name = v;
      save(); refreshTitle(); renderSheet();
      toast('已改名为「' + v + '」');
      break;
    }
    case 'dup': {
      const src = state.wheels.filter(x => x.id === id)[0];
      if (!src) break;
      /* 复制要连"多面"的整套配置一起复制（面 + 分面依据），不然副本会变成普通转盘 */
      const copyOpt = o => ({ id:uid(), label:o.label, weight:o.weight, color:o.color, next:o.next || '' });
      const nw = { id:uid(), name:src.name + ' 副本', next:src.next || '',
                   branch:!!src.branch, grade:(src.grade === true ? true : (src.grade === false ? false : null)),
                   removeAfterPick:src.removeAfterPick,
                   multi:!!src.multi, faceBy:src.faceBy || '',
                   faces:(src.faces || []).map(f => ({
                     when: Object.assign({}, f.when || { type:'else' }),
                     options:(f.options || []).map(copyOpt)
                   })),
                   options:src.options.map(copyOpt) };
      state.wheels.splice(state.wheels.indexOf(src) + 1, 0, nw);
      save(); renderSheet(); toast('已复制转盘' + (src.multi ? '（含 ' + nw.faces.length + ' 个面）' : '')); break;
    }
    case 'del': {
      if (state.wheels.length <= 1) { toast('至少要保留一个转盘'); break; }
      const wheel = state.wheels.filter(x => x.id === id)[0];
      if (!wheel) break;
      const ok = await askDialog({ title:'删除转盘', desc:'确定删除「' + wheel.name + '」及其 ' + wheel.options.length + ' 个选项？', ok:'删除', danger:true });
      if (!ok) return;
      state.wheels = state.wheels.filter(x => x.id !== id);
      if (state.currentId === id) state.currentId = state.wheels[0].id;
      save(); refreshTitle(); requestDraw(); renderSheet(); break;
    }
    case 'toggleBranch': {
      const x = wheelById(id);
      if (!x) break;
      x.branch = !x.branch;
      if (x.branch) { x.next = ''; }                 // 分支转盘不参与默认链
      save(); renderSheet(); renderFlowBar();
      toast(x.branch
        ? '「' + x.name + '」已标记为分支转盘：不进默认顺序，只能被选项分支指到'
        : '「' + x.name + '」已恢复为普通转盘');
      break;
    }
    case 'up': moveWheel(id, -1); break;
    case 'down': moveWheel(id, 1); break;
    case 'addOpt':
      editOpts(w, true).push(makeOption(''));
      save(); renderSheet(); requestDraw();
      (function(){ const rows = $$('#sheet .opt-row'); const last = rows[rows.length - 1];
        if (last) { const inp = last.querySelector('.opt-input'); if (inp) inp.focus(); } })();
      break;
    case 'delOpt': {
      const arr = editOpts(w, true);
      const i = arr.map(o => o.id).indexOf(id);
      if (i >= 0) arr.splice(i, 1);
      save(); renderSheet(); requestDraw(); break;
    }
    case 'autoColor':
      (editOpts(w, true).filter(o => o.id === id)[0] || {}).color = null;
      save(); renderSheet(); requestDraw(); break;
    case 'shuffle': shuffleArr(editOpts(w, true)); save(); renderSheet(); requestDraw(); break;
    case 'recolor': editOpts(w, true).forEach(o => { o.color = null; }); save(); renderSheet(); requestDraw(); toast('已按主题重新配色'); break;
    case 'clearOpts': {
      const ok = await askDialog({ title:'清空选项',
        desc:'将删除「' + w.name + '」' + (editOptsName(w) ? '的' + editOptsName(w) : '') + '的全部选项', ok:'清空', danger:true });
      if (!ok) return;
      const arr = editOpts(w, true);
      arr.length = 0;                       // 原地清空，别换数组引用（多面转盘的面里存的也是它）
      save(); renderSheet(); requestDraw(); break;
    }
    case 'batch': navTo('batch'); break;
    case 'batchApply': {
      const mode = el.dataset.mode;
      const text = ($('#batchText') || {}).value || '';
      const list = parseBatch(text);
      if (!list.length) { toast('没有解析到内容'); break; }
      const opts = list.map(o => makeOption(o.label, o.weight));
      const arr = editOpts(w, true);
      if (mode === 'append') { opts.forEach(o => arr.push(o)); }
      else { arr.length = 0; opts.forEach(o => arr.push(o)); }
      save(); requestDraw();
      if (ui.view === 'batch') navGoBack();          // 回到进来时那一页（并把栈同步好）
      else { ui.view = 'manager'; ui.mtab = 'content'; renderSheet('swap'); }
      toast((mode === 'append' ? '已追加 ' : '已覆盖为 ') + opts.length + ' 个选项' + (editOptsName(w) ? '（' + editOptsName(w) + '）' : ''));
      break;
    }
    case 'setPalette': state.settings.palette = el.dataset.val; save(); renderSheet(); requestDraw(); break;
    case 'setTheme': state.settings.theme = el.dataset.val; applyTheme(); save(); renderSheet(); break;
    case 'exportData': exportData(); break;
    case 'saveFolder': saveToFolder(); break;
    case 'reloadFiles': reloadFromFiles(); break;
    case 'importData': $('#fileImport').click(); break;
    case 'restoreImport':
      if (await restoreImportState()) toast('已恢复导入前的数据');
      else if (!storageStatus.ok) toast('恢复失败：浏览器存储不可用');
      break;
    case 'copyData': copyText(JSON.stringify(state)); break;
    case 'resetAll': {
      const ok = await askDialog({ title:'恢复默认', desc:'将清除全部转盘、选项与历史记录，恢复为初始内容', ok:'恢复', danger:true });
      if (!ok) return;
      state = seed(); save(); applyTheme(); refreshTitle(); requestDraw(); renderSheet(); toast('已恢复默认内容'); break;
    }

    /* ---- 分支流程 ---- */
    case 'pickNext': {
      const o = optById(w.id, id);
      if (!o) break;
      ui.targetCtx = { kind:'opt', wheel:w.id, opt:o.id, cur:o.next || '' };
      navTo('target'); break;
    }
    case 'setTarget': {
      const ctx = ui.targetCtx || {}, val = el.dataset.val || '';
      if (ctx.kind === 'root') state.flow.rootId = val;
      else if (ctx.kind === 'def') { const x = wheelById(ctx.wheel); if (x) x.next = val; }
      else if (ctx.kind === 'opt') { const o = optById(ctx.wheel, ctx.opt); if (o) o.next = val; }
      if (val) state.flow.enabled = true;
      save();
      navBack(); renderFlowBar();
      toast(val ? '已设置为「' + slotText(val) + '」' : '已清除设置');
      break;
    }
    case 'setSpinFx': {
      state.settings.spinFx = el.dataset.val || 'bounce';
      save(); renderSheet('swap');
      const fx = SPIN_FX.filter(x => x[0] === spinFxKey())[0];
      toast('旋转效果：' + fx[1]);
      break;
    }
    case 'setWheelColor': {
      state.settings.wheelColor = el.dataset.val || 'jin';
      save(); renderSheet('swap');
      toast('法轮颜色：' + (CHART_INKS.filter(x => x[0] === wheelInkKey())[0][1]));
      break;
    }
    case 'setChartColor': {
      state.settings.chartColor = el.dataset.val || 'zhu';
      save(); renderSheet('swap');
      toast('维度图颜色：' + (CHART_INKS.filter(x => x[0] === chartInkKey())[0][1]));
      break;
    }
    case 'expandFlow': expandFlowBar(); break;
    case 'gradeAuto': {
      const x = wheelById(id);
      if (!x) break;
      x.grade = null; save(); renderSheet('swap');
      toast('「' + x.name + '」已恢复自动判断（' + (isGradeWheel(x) ? '会计入' : '不会计入') + '属性图）');
      break;
    }
    case 'copyResult': copyText(ui.resultLabel || resultEl.textContent); break;
    case 'spinAgain': closeSheet(); setTimeout(() => spin(), 240); break;
    case 'removeWinner': {
      const ww = currentWheel();
      const oo = findOptionById(ww, ui.resultOptId);
      if (!oo) { toast('这个选项已经不在了'); break; }
      if (wheelOptions(ww).filter(x => num(x.weight) > 0).length <= 1) { toast('至少要保留一个选项'); break; }
      /* 从它实际所在的那一组里删（可能是某个面，也可能就是兜底面） */
      const arr = editOpts(ww, true);
      const at = arr.map(x => x.id).indexOf(oo.id);
      if (at >= 0) arr.splice(at, 1);
      else ww.options = ww.options.filter(x => x.id !== oo.id);
      ui.resultOptId = '';
      save(); requestDraw(); closeSheet();
      toast('已把「' + oo.label + '」移出转盘');
      break;
    }
    case 'editWheel': {
      const wid = id || (el && el.dataset ? el.dataset.id : '');
      const x = wheelById(wid);
      if (!x) break;
      state.currentId = x.id; save(); refreshTitle(); requestDraw();
      // 选项内容永远是「转盘列表」的下一层：不在列表上就先垫一层，保证返回必定回到列表
      const atList = isOverlayOpen() && ui.view === 'manager' && ui.mtab === 'wheels';
      if (!atList) navTo('manager', { mtab:'wheels', force:true });
      navTo('manager', { mtab:'content', force:true });
      break;
    }
    case 'clearLinks': {
      const ok = await askDialog({ title:'清除所有连接', desc:'将删除全部「默认下一站」与选项上的跳转设置', ok:'清除', danger:true });
      if (!ok) return;
      /* ⚠️ 面里的选项也有跳转设置，一起清（别只清兜底面） */
      const clearWheel = x => {
        x.next = '';
        x.options.forEach(o => { o.next = ''; });
        (x.faces || []).forEach(f => (f.options || []).forEach(o => { o.next = ''; }));
      };
      state.wheels.forEach(clearWheel);
      state.flow.rootId = ''; state.flow.path = []; state.flow.pendingId = '';
      save(); renderSheet(); renderFlowBar(); toast('已清除所有连接'); break;
    }
    case 'gotoStep': {
      const f = state.flow, i = num(el.dataset.idx), p = f.path[i];
      if (!p) break;
      clearJump();
      f.path = f.path.slice(0, i); f.pendingId = ''; f.finished = false;
      ui.flowCollapsed = false;
      save();
      if (p.wheelId && wheelById(p.wheelId)) switchTo(p.wheelId, { silent:true });
      else renderFlowBar();
      break;
    }
    case 'resetFlow': ui.flowCollapsed = false; resetFlow(); break;
    case 'goPending': {
      const pid = state.flow.pendingId;
      state.flow.pendingId = '';
      state.flow.paused = false;                    // 手动点「下一站」= 明确要继续
      if (pid && wheelById(pid)) switchTo(pid, { silent:false, spin:false });
      else renderFlowBar();
      break;
    }
    case 'resumeFlow': {
      state.flow.paused = false;
      save(); renderFlowBar();
      toast('已恢复自动跳转');
      break;
    }
    case 'backFlow': navGoBack(); break;

    /* ---- 多面转盘 ----
       和「分支」是两件事：分支改"跳到哪"，多面改"这个盘显示什么"。 */
    case 'toggleMulti': {
      const x = wheelById(id);
      if (!x) break;
      if (isMultiWheel(x)) {
        const okOff = await askDialog({ title:'恢复成普通转盘',
          desc:'「' + x.name + '」的 ' + faceCount(x) + ' 个面会被删掉，只留下兜底面（也就是现在的选项内容）。确定吗？',
          ok:'恢复', danger:true });
        if (!okOff) return;
        x.multi = false; x.faces = []; x.faceBy = '';
        save(); renderSheet(); renderFlowBar(); requestDraw();
        toast('「' + x.name + '」已恢复为普通转盘');
        break;
      }
      /* 打开多面：先猜一个分面依据（前一个属性盘最像），猜错了再自己改 */
      const i = state.wheels.indexOf(x);
      let guess = null;
      for (let k = i - 1; k >= 0; k--) if (isGradeWheel(state.wheels[k])) { guess = state.wheels[k]; break; }
      if (!guess) guess = state.wheels.filter(y => y.id !== x.id && isGradeWheel(y))[0] || null;
      x.multi = true;
      x.faceBy = guess ? guess.id : '';
      if (!Array.isArray(x.faces) || !x.faces.length) {
        /* 默认给两个面，条件留空等用户填（填好之前不会命中，用兜底面） */
        const mid = GRADE_LADDER[Math.floor(GRADE_LADDER.length / 2)];
        x.faces = [
          { when:{ type:'gradeAtLeast', value:mid }, options:[] },
          { when:{ type:'else' }, options:[] }
        ];
      }
      save(); renderSheet(); renderFlowBar(); requestDraw();
      ui.faceWheelId = x.id;
      navTo('faces');
      toast(guess ? ('已设为多面转盘，按「' + guess.name + '」分面（不对可以改）') : '已设为多面转盘，先选一个「按哪个转盘分面」');
      break;
    }
    case 'openFaces': {
      ui.faceWheelId = id || currentWheel().id;
      navTo('faces');
      break;
    }
    case 'setFaceBy': {
      const x = wheelById(id);
      if (!x) break;
      x.faceBy = el.dataset.val || '';
      save(); renderSheet('swap'); requestDraw();
      const src = faceSource(x);
      toast(src ? ('现在按「' + src.name + '」分面') : '已清除分面依据（只会用兜底面）');
      break;
    }
    case 'addFace': {
      const x = wheelById(id);
      if (!x) break;
      x.faces = Array.isArray(x.faces) ? x.faces : [];
      x.faces.push({ when:{ type:'gradeAtLeast', value:'A' }, options:[] });
      ui.faceWheelId = x.id;
      save(); renderSheet(); requestDraw();
      ui.faceWhenIdx = x.faces.length - 1;
      navTo('facewhen');
      toast('加了一个面，先设它的条件');
      break;
    }
    case 'delFace': {
      const x = wheelById(id), i = num(el.dataset.idx);
      if (!x || !x.faces || !x.faces[i]) break;
      const okDel = await askDialog({ title:'删除这个面',
        desc:'第 ' + (i + 1) + ' 面（' + faceWhenText(x.faces[i]) + '）的选项会一起删掉。确定吗？', ok:'删除', danger:true });
      if (!okDel) return;
      x.faces.splice(i, 1);
      save(); renderSheet(); requestDraw();
      toast('已删除');
      break;
    }
    case 'faceUp': case 'faceDown': {
      const x = wheelById(id), i = num(el.dataset.idx);
      if (!x || !x.faces) break;
      const j = i + (act === 'faceUp' ? -1 : 1);
      if (j < 0 || j >= x.faces.length) break;
      const t = x.faces[i]; x.faces[i] = x.faces[j]; x.faces[j] = t;
      save(); renderSheet('swap'); requestDraw();
      break;
    }
    case 'editFace': {
      const x = wheelById(id);
      if (!x) break;
      const i = num(el.dataset.idx);
      ui.faceWheelId = x.id;
      ui.faceEdit = i < 0 ? -1 : i;
      if (state.currentId !== x.id) { state.currentId = x.id; save(); refreshTitle(); requestDraw(); }
      if (ui.view !== 'faces') { navTo('faces'); }
      navTo('manager', { mtab:'content', force:true });
      break;
    }
    case 'pickEditFace': {
      ui.faceEdit = el.dataset.val === 'auto' ? 'auto' : num(el.dataset.val);
      renderSheet('swap');
      requestDraw();
      break;
    }
    case 'pickFaceWhen': {
      ui.faceWheelId = id;
      ui.faceWhenIdx = num(el.dataset.idx);
      navTo('facewhen');
      break;
    }
    case 'setFaceWhenType': {
      const x = wheelById(ui.faceWheelId), i = num(ui.faceWhenIdx);
      const f = x && x.faces ? x.faces[i] : null;
      if (!f) break;
      const t = el.dataset.val || 'else';
      f.when = { type:t };
      if (t !== 'else' && t !== 'labelIs' && t !== 'labelHas') f.when.value = 'A';
      save(); renderSheet('swap'); requestDraw();
      break;
    }
    case 'setFaceWhenValue': {
      const x = wheelById(ui.faceWheelId), i = num(ui.faceWhenIdx);
      const f = x && x.faces ? x.faces[i] : null;
      if (!f) break;
      f.when = Object.assign({}, f.when, { value: el.dataset.val || '' });
      save(); renderSheet('swap'); requestDraw();
      break;
    }

    /* ---- 记录页 ---- */
    case 'clearHistory': {
      const ok = await askDialog({ title:'清空记录', desc:'确定清空全部抽奖历史？', ok:'清空', danger:true });
      if (!ok) return;
      state.history = []; save(); renderSheet(); break;
    }
    case 'copyHistory':
      copyText(state.history.map(h => h.label + '（' + (h.wheel || '') + '）').join('\n')); break;
  }
}


/* ---- 转盘列表：按住 / 长按拖动排序 ---- */
let rowHold = null, rowDrag = null, suppressClickUntil = 0;
function clearRowHold(){ if (rowHold) { clearTimeout(rowHold.timer); rowHold = null; } }
function beginRowDrag(){
  if (!rowHold) return;
  const el = rowHold.el, list = el.closest('.list');
  const rect = el.getBoundingClientRect();
  rowDrag = { el:el, list:list, id:el.dataset.id, startY:rowHold.y, target:null, line:null };
  rowHold = null;
  el.classList.add('dragging');
  document.body.classList.add('row-dragging');
  if (list) {
    const line = document.createElement('div');
    line.className = 'drop-line';
    list.appendChild(line);
    rowDrag.line = line;
  }
  vibrate(12);
  beep(560, 0.05, 'sine', 0.028);
  updateDropLine(rect.top + rect.height / 2);
}
function updateDropLine(y){
  const d = rowDrag;
  if (!d || !d.line || !d.list) return;
  const rows = $$('.wheel-row', d.list).filter(r => r !== d.el);
  let idx = rows.length;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].getBoundingClientRect();
    if (y < r.top + r.height / 2) { idx = i; break; }
  }
  d.target = idx;
  const ref = rows[idx];
  const top = ref ? ref.offsetTop : d.list.scrollHeight;
  d.line.style.top = Math.max(0, top - 1) + 'px';
}
function autoScrollBy(y){
  const body = $('#sheet .sheet-body');
  if (!body) return;
  const r = body.getBoundingClientRect();
  if (y < r.top + 44) body.scrollTop = Math.max(0, body.scrollTop - 12);
  else if (y > r.bottom - 44) body.scrollTop = body.scrollTop + 12;
}
function onRowPointerMove(e){
  if (rowHold) {
    const moved = Math.abs(e.clientY - rowHold.y) + Math.abs(e.clientX - rowHold.x);
    if (rowHold.type === 'mouse') { if (moved > 5) beginRowDrag(); }
    else if (moved > 10) clearRowHold();          // 触屏上移动＝滚动列表，不算长按
  }
  if (!rowDrag) return;
  rowDrag.el.style.transform = 'translateY(' + (e.clientY - rowDrag.startY) + 'px)';
  autoScrollBy(e.clientY);
  updateDropLine(e.clientY);
  if (e.cancelable) e.preventDefault();
}
function endRowDrag(drop){
  clearRowHold();
  const d = rowDrag;
  if (!d) return;
  rowDrag = null;
  suppressClickUntil = Date.now() + 400;          // 拖完别把这次松手当成点击
  d.el.classList.remove('dragging');
  d.el.style.transform = '';
  document.body.classList.remove('row-dragging');
  if (d.line && d.line.parentNode) d.line.parentNode.removeChild(d.line);
  if (!drop) return;
  const from = state.wheels.findIndex(w => w.id === d.id);
  if (from < 0) return;
  const arr = state.wheels.slice();
  const moved = arr.splice(from, 1)[0];
  const to = Math.max(0, Math.min(arr.length, d.target == null ? from : d.target));
  if (to === from) return;
  arr.splice(to, 0, moved);
  state.wheels = arr;
  save(); renderSheet('swap');
  toast('「' + moved.name + '」已移到第 ' + (to + 1) + ' 位');
}

/* ============================== 事件绑定 ============================== */
function bindEvents(){
  $('#btnSwitch').addEventListener('click', () => navTo('manager', { mtab:'wheels' }));
  $('#btnPanel').addEventListener('click', () => navTo('manager', { mtab:'settings' }));
  $('#btnEdit').addEventListener('click', () => {
    const w = currentWheel();
    if (w) handleAction('editWheel', w.id, { dataset:{ id:w.id } });
  });
  canvas.addEventListener('click', spin);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  resultEl.addEventListener('click', () => {
    if (spinning) return;
    const t = resultEl.textContent.trim();
    if (!t || t === '？') return;
    clearJump();                                  // 打开结果面板时暂停自动跳转
    navTo('result');
  });

  const overlay = $('#overlay');
  overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (isOverlayOpen()) { e.preventDefault(); navGoBack(); }
      return;
    }
    if (e.code === 'Space' && !isOverlayOpen()) {
      const tag = (document.activeElement || {}).tagName;

/* ============================== 单文件转盘数据（「转盘」文件夹） ==============================
   每个转盘一个数据文件，双击打开网页时自动读取。
   为什么数据文件是 .js 而不是 .json：file:// 页面被禁止 fetch 本地 json（CORS），
   而 <script src> 加载本地 js 是允许的，所以数据文件里是「纯 JSON + 一行注册调用」。
   读不到文件夹就退回页面内置数据，程序照样能用。
   ==================================================================================== */
const WHEEL_DIR = '转盘';
const FILE_INDEX = '_index.js';
let fileWheelCount = 0;
let dirHandle = null;        // 已授权写入的「转盘」文件夹
let dirUsable = false;       // 本次会话能不能直接写文件
let booting = true;          // 启动阶段不触发自动写回
function registerWheelFile(def){ (window.__ZW_WHEELS = window.__ZW_WHEELS || []).push(def); }
function loadWheelFiles(done, bust){
  window.__ZW_REGISTER = registerWheelFile;
  window.__ZW_WHEELS = [];
  const q = bust ? ('?t=' + Date.now()) : '';
  let finished = false;
  const finish = () => { if (!finished) { finished = true; done((window.__ZW_WHEELS || []).slice()); } };
  const idx = document.createElement('script');
  idx.src = WHEEL_DIR + '/' + FILE_INDEX + q;
  idx.onerror = () => { finished = true; done([]); };          // 没有文件夹 → 用内置数据
  idx.onload = () => {
    const list = window.__ZW_INDEX || [];
    if (!list.length) { finish(); return; }
    let left = list.length;
    const tick = () => { if (--left <= 0) finish(); };
    list.forEach(f => {
      const s = document.createElement('script');
      s.src = WHEEL_DIR + '/' + f + q;
      s.onload = tick; s.onerror = tick;                       // 单个文件坏了也不卡住
      document.head.appendChild(s);
    });
    setTimeout(finish, 5000);                                  // 兜底
  };
  document.head.appendChild(idx);
}
/* ---- 多面转盘的存档读写 ----
   存进数据文件时 faceBy 写「转盘名」（和 next 一样，方便手改）；
   内存里存 id。faces[].when 里的名字类条件直接存原文。 */
function faceToFile(f){
  const out = { when: f.when || { type:'else' }, options: f.options.map(o => {
    const z = { label:o.label, weight:num(o.weight) };
    if (o.color) z.color = o.color;
    if (o.next) z.next = slotText(o.next);
    return z;
  }) };
  return out;
}
function applyWheelFiles(defs){
  if (!defs || !defs.length) return false;
  const wheels = defs.filter(d => d && d.name).map(d => {
    const w = { id:uid(), name:String(d.name), category:WHEEL_CATEGORIES.indexOf(d.category) >= 0 ? d.category : inferWheelCategory(d.name), next:'', branch:!!d.branch,
                grade:(d.grade === true ? true : (d.grade === false ? false : null)),
                removeAfterPick:!!d.removeAfterPick, options:[] };
    w._order = (typeof d.order === 'number' && isFinite(d.order)) ? d.order : null;
    w._nextName = typeof d.next === 'string' ? d.next : '';
    w.options = (Array.isArray(d.options) ? d.options : []).map(o => {
      if (typeof o === 'string' || typeof o === 'number') return makeOption(o);
      const op = makeOption(o.label, o.weight == null ? 1 : o.weight, o.color || null);
      op._nextName = typeof o.next === 'string' ? o.next : '';
      return op;
    });
    /* 多面转盘：先原样收着，等下面的 byName 建好再解析 faceBy / 选项跳转 */
    w.multi = d.multi === true || (Array.isArray(d.faces) && d.faces.length > 0);
    w._faceByName = typeof d.faceBy === 'string' ? d.faceBy : '';
    w._facesRaw = Array.isArray(d.faces) ? d.faces : [];
    return w;
  });
  if (!wheels.length) return false;
  const byName = {};
  wheels.forEach(w => { byName[w.name] = w; });
  const resolve = v => {
    if (!v) return '';
    if (v === '结束' || v === 'END' || v === '__end__') return END;
    if (v === '留在本盘' || v === '__stay__') return STAY;
    return byName[v] ? byName[v].id : '';
  };
  wheels.forEach(w => {
    w.next = resolve(w._nextName); delete w._nextName;
    w.options.forEach(o => { o.next = resolve(o._nextName); delete o._nextName; });
    /* 面：选项的 next 也要解析，faceBy 用名字换成 id */
    w.faces = (w._facesRaw || []).map(f => ({
      when: (f && f.when && typeof f.when === 'object') ? f.when : { type:'else' },
      options: ((f && Array.isArray(f.options)) ? f.options : []).map(o => {
        if (typeof o === 'string' || typeof o === 'number') return makeOption(o);
        const op = makeOption(o.label, o.weight == null ? 1 : o.weight, o.color || null);
        op.next = resolve(typeof o.next === 'string' ? o.next : '');
        return op;
      })
    }));
    delete w._facesRaw;
    const src = w._faceByName ? byName[w._faceByName] : null;
    w.faceBy = src ? src.id : String(w._faceByName || '');
    delete w._faceByName;
    if (!w.multi) { w.multi = false; w.faces = []; w.faceBy = ''; }
  });
  // 文件里写了 "order" 就按它排序（方便手改顺序），没写就按文件顺序
  if (wheels.some(w => w._order != null)) {
    wheels.forEach((w, i) => { if (w._order == null) w._order = i + 1; });
    wheels.sort((a, b) => a._order - b._order);
  }
  wheels.forEach(w => { delete w._order; });
  state.wheels = wheels;                                   // 文件为准
  if (!state.wheels.some(x => x.id === state.currentId)) state.currentId = state.wheels[0].id;
  if (!state.flow.rootId || !state.wheels.some(x => x.id === state.flow.rootId)) state.flow.rootId = state.wheels[0].id;
  state.flow.path = []; state.flow.pendingId = '';
  fileWheelCount = wheels.length;
  return true;
}
/* 当前数据 → 文件文本（格式与数据文件夹里完全一致，可以来回改）
   idx = 这个转盘在列表里的位置（0 起），会写成显式的 "order" 字段 */
/* 一个选项写成文件里的那一行 */
function optionFileLine(o, last){
  const no = wheelById(o.next);
  let line = '    { "label": ' + JSON.stringify(o.label);
  if (num(o.weight) !== 1) line += ', "weight": ' + num(o.weight);
  if (o.color) line += ', "color": ' + JSON.stringify(o.color);
  if (o.next === END) line += ', "next": "结束"';
  else if (o.next === STAY) line += ', "next": "留在本盘"';
  else if (no) line += ', "next": ' + JSON.stringify(no.name);
  line += ' }' + (last ? '' : ',');
  return line;
}
function wheelFileText(w, idx){
  const order = (typeof idx === 'number' && idx >= 0) ? (idx + 1) : (state.wheels.indexOf(w) + 1);
  const L = [];
  L.push('/* 咒术转盘 · 单转盘数据文件');
  L.push('   转盘名：' + w.name);
  L.push('   顺序：第 ' + order + ' 位（order 字段；顺序也可以在网页的「转盘」页拖动调整）');
  L.push('   改完保存、刷新网页即可生效（浏览器直接读这个文件）');
  L.push('   next 写「转盘名字」表示下一步去哪个转盘；写 "结束" 表示流程到此为止；不写就留在本盘');
  L.push('   branch: true 表示这是「分支转盘」：不在默认顺序里，只能被别的转盘的选项分支指到；');
  L.push('           它抽完若没给该选项设 next，会自动接着「拐进来的那个转盘」的默认下一站继续。');
  if (w.multi) {
    const src = faceSource(w);
    L.push('   multi/faceBy/faces 表示这是「多面转盘」：**照常参与默认顺序**，位置随便放，');
    L.push('           但展示什么内容取决于 faceBy 那个转盘抽到了什么（可以写多个面，按顺序取第一个命中的）。');
    L.push('           faces 里没命中的时候用最下面那个 options（兜底面）。');
    L.push('           当前分面依据：' + (src ? src.name : '（没设置）'));
  }
  L.push('   weight 是权重（决定扇区大小与概率），留空默认 1；color 可写 "#B23A2F" 固定扇区颜色 */');
  L.push('window.__ZW_REGISTER({');
  L.push('  "order": ' + order + ',');
  L.push('  "name": ' + JSON.stringify(w.name) + ',');
  L.push('  "category": ' + JSON.stringify(w.category || inferWheelCategory(w.name)) + ',');
  const nw = wheelById(w.next);
  L.push('  "next": ' + (w.next === END ? '"结束"' : (nw ? JSON.stringify(nw.name) : '""')) + ',');
  if (w.branch) L.push('  "branch": true,');
  if (w.grade === true) L.push('  "grade": true,');
  if (w.grade === false) L.push('  "grade": false,');
  if (w.multi) {
    L.push('  "multi": true,');
    L.push('  "faceBy": ' + JSON.stringify((faceSource(w) || {}).name || '') + ',');
    L.push('  "faces": [');
    (w.faces || []).forEach((f, i) => {
      L.push('    { "when": ' + JSON.stringify(f.when || { type:'else' }) + ', "options": [');
      (f.options || []).forEach((o, j) => L.push(optionFileLine(o, j === f.options.length - 1)));
      L.push('    ] }' + (i < w.faces.length - 1 ? ',' : ''));
    });
    L.push('  ],');
    L.push('  // ↑ 面都按条件从上往下试，第一个命中的生效；下面 options 是兜底面');
  }
  L.push('  "removeAfterPick": ' + (!!w.removeAfterPick) + ',');
  L.push('  "options": [');
  w.options.forEach((o, j) => L.push(optionFileLine(o, j === w.options.length - 1)));
  L.push('  ]');
  L.push('});');
  L.push('');
  return L.join('\n');
}
function wheelFileName(w, i){
  return String(i + 1).padStart(2, '0') + '-' + String(w.name).replace(/[\\/:*?"<>|]/g, '_') + '.js';
}
function indexFileText(wheels){
  const head = ['/* 转盘清单 —— 这里的顺序就是网页里「转盘」页的顺序，也是「按列表顺序串联」的顺序。',
                '   顺序变化时这个文件会跟着重写（文件名前的 01/02… 也是顺序，每个文件里还有 "order" 字段）。',
                '   新增转盘：照抄一份上面的文件、改名，再把文件名加到下面这个列表里。',
                '   当前顺序：'];
  wheels.forEach((w, i) => {
    head.push('     ' + (i + 1) + '. ' + w.name +
      (w.branch ? '  [分支转盘·不进默认顺序]' : '') +
      (isMultiWheel(w) ? '  [多面转盘·按「' + ((faceSource(w) || {}).name || '？') + '」分面]' : '') +
      '  →  ' + wheelFileName(w, i));
  });
  head.push('*/');
  return head.concat(['window.__ZW_INDEX = ['])
    .concat(wheels.map((w, i) => '  ' + JSON.stringify(wheelFileName(w, i)) + (i < wheels.length - 1 ? ',' : '')))
    .concat(['];', '']).join('\n');
}
function downloadText(name, text){
  const blob = new Blob([text], { type:'text/javascript' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
/* 记住「转盘」文件夹的授权，下次打开尽量免选（Chrome/Edge） */
function idbOpen(){
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('zswheel-db', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch(e) { rej(e); }
  });
}
async function idbSet(k, v){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(v, k);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(k){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readonly');
    const q = tx.objectStore('kv').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
/* 拿到可写目录：interactive=true 时允许弹一次目录选择/授权 */
async function getDir(interactive){
  if (!window.showDirectoryPicker) return null;
  try {
    if (!dirHandle) { try { dirHandle = (await idbGet('dir')) || null; } catch(e){ dirHandle = null; } }
    if (dirHandle) {
      let p = 'denied';
      try { p = await dirHandle.queryPermission({ mode:'readwrite' }); } catch(e) { p = 'denied'; }
      if (p === 'granted') return dirHandle;
      if (!interactive) return null;
      const r = await dirHandle.requestPermission({ mode:'readwrite' });
      if (r === 'granted') return dirHandle;
      dirHandle = null;
    }
    if (!interactive) return null;
    dirHandle = await window.showDirectoryPicker({ mode:'readwrite', id:'zswheel-dir' });
    try { await idbSet('dir', dirHandle); } catch(e){}
    return dirHandle;
  } catch(e) { return null; }
}
/* 把当前转盘写回「转盘」文件夹（顺带清掉已删除转盘留下的旧文件） */
async function syncToFolder(opts){
  opts = opts || {};
  const wheels = state.wheels;
  if (!wheels.length) return false;
  const dir = await getDir(!!opts.interactive);
  if (!dir) { if (opts.interactive) toast('没有拿到文件夹写入权限'); return false; }
  try {
    const keep = {};
    for (let i = 0; i < wheels.length; i++) {
      const name = wheelFileName(wheels[i], i);
      keep[name] = 1;
      const fh = await dir.getFileHandle(name, { create:true });
      const ws = await fh.createWritable();
      await ws.write(wheelFileText(wheels[i], i));
      await ws.close();
    }
    const fh2 = await dir.getFileHandle(FILE_INDEX, { create:true });
    const ws2 = await fh2.createWritable();
    await ws2.write(indexFileText(wheels));
    await ws2.close();
    // 清掉已经不存在的转盘文件（只动 01-xx.js 这种命名的）
    try {
      for await (const h of dir.values()) {
        if (h.kind === 'file' && /^\d{2}-.*\.js$/.test(h.name) && !keep[h.name]) await dir.removeEntry(h.name);
      }
    } catch(e){}
    dirUsable = true;
    ui.fileError = '';
    ui.lastSync = Date.now();
    if (opts.toast) toast('已写回 ' + wheels.length + ' 个文件到「' + WHEEL_DIR + '」');
    return true;
  } catch(e) {
    dirUsable = false;
    ui.fileError = (e && e.message) || String(e || '未知错误');
    if (opts.toast) toast('写回失败：' + ((e && e.message) || e));
    return false;
  }
}
let syncTimer = null, hintedNoDir = false;
function scheduleSync(){
  if (booting || state.settings.autoSave === false) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    syncTimer = null;
    syncToFolder({}).then(ok => {
      if (ok) {
        if (isOverlayOpen() && ui.view === 'manager' && ui.mtab === 'settings') renderSheet('swap');
      } else if (!hintedNoDir && fileWheelCount && !booting) {
        hintedNoDir = true;
        toast('改动已存进浏览器；要同步到「' + WHEEL_DIR + '」数据文件，需要授权一次目录', { action:'授权并写回', fn:() => saveToFolder() });
      }
    });
  }, 900);
}
/* 手动「重新读取文件」：会用文件内容覆盖网页上的转盘 */
async function reloadFromFiles(){
  const ok = await askDialog({ title:'重新读取数据文件', ok:'读取',
    desc:'会用「' + WHEEL_DIR + '」文件夹里的内容覆盖网页上的转盘。网页上还没写回文件的改动会丢失，确定吗？' });
  if (!ok) return;
  loadWheelFiles(defs => {
    if (!defs.length) { toast('没读到数据文件'); return; }
    applyWheelFiles(defs); save();
    refreshTitle(); requestDraw(); renderSheet();
    toast('已从文件读取 ' + defs.length + ' 个转盘');
  }, true);
}
function fileStatusShort(){
  if (!fileWheelCount) return '数据文件：没读到「' + WHEEL_DIR + '」文件夹（当前用网页内置数据）';
  if (ui.fileError) return '数据文件：<b>写回失败</b> —— ' + esc(ui.fileError);
  if (dirUsable) return '数据文件：已同步' + (ui.lastSync ? '（' + fmtTime(ui.lastSync) + ' 写回，含顺序）' : '（含顺序）');
  return '数据文件：<b>未授权写入</b> —— 顺序等改动目前只存在浏览器里';
}
function fileStatusText(){
  const a = fileWheelCount
    ? '已读到「' + WHEEL_DIR + '」里的 <b>' + fileWheelCount + '</b> 个数据文件'
    : '没读到「' + WHEEL_DIR + '」文件夹（当前用网页内置数据）';
  const b = ui.fileError
    ? '，<b>文件写回失败</b>：' + esc(ui.fileError) + '；浏览器内的数据仍然保留'
    : dirUsable
    ? '，文件夹<b>已授权写入</b>' + (ui.lastSync ? '（上次写回 ' + fmtTime(ui.lastSync) + '）' : '')
    : '，文件夹<b>尚未授权</b>：改动先存在浏览器里（刷新不丢），点下面「保存回文件夹」选一次目录即可自动同步';
  return a + b + '。';
}
async function saveToFolder(){
  const wheels = state.wheels;
  if (!wheels.length) { toast('还没有转盘'); return; }
  if (await syncToFolder({ interactive:true, toast:true })) { renderSheet('swap'); return; }
  if (!window.showDirectoryPicker) {
    // 老浏览器：退回逐个下载
    wheels.forEach((w, i) => setTimeout(() => downloadText(wheelFileName(w, i), wheelFileText(w, i)), i * 350));
    setTimeout(() => downloadText(FILE_INDEX, indexFileText(wheels)), wheels.length * 350 + 200);
    toast('正在下载 ' + (wheels.length + 1) + ' 个文件（浏览器可能询问是否允许多个下载）');
  }
}

/* ============================== 调试出口 ==============================
   平时什么都不做（`ZW.__app` 保持 undefined），所以对用户零影响。
   想在浏览器里做验证时，在地址栏 / 控制台先设一个开关再刷新：

     localStorage.setItem('zhoushu-wheel.debug', '1')   // 然后刷新

   之后控制台就能直接用内部函数了（不用改代码、不用暴露给普通用户）：
     __app.state         当前存档
     __app.ui            界面状态（含 chartDims / chartItem）
     __app.openChart()   打开第一张维度图（等价于点「记录」页里那张）
     __app.spin()        抽一次
     __app.flowJump(...) 手动推进流程
   ==================================================================== */
function exposeDebug(){
  try { if (localStorage.getItem('zhoushu-wheel.debug') !== '1') return; } catch(e){ return; }
  ZW.__app = {
    version: ZW.version,
    get state(){ return state; },
    get ui(){ return ui; },
    get nav(){ return NAV; },
    openChart: id => {
      const c = id ? (state.charts.filter(x => x.id === id)[0] || null) : state.charts[0];
      if (!c) { toast('还没有维度图'); return null; }
      clearTimeout(chartAutoTimer); chartAutoTimer = null;   // 手动打开：别被自动收起打断
      chartFlowDone = null;
      ui.chartItem = c;
      navTo('chart');
      return c;
    },
    closeChart: () => navGoBack(),
    spin: () => spin(),
    flowJump: (wid, label) => {
      const w = wheelById(wid) || currentWheel();
      flowJump(w, { label: label || '（调试）' }, label || '（调试）');
      return w;
    },
    draw: () => draw(),
    canvasCalls: () => {
      const cv = $('#chartCv');
      if (!cv || !cv.getContext) return null;
      const c = cv.getContext('2d');
      return { width: cv.width, height: cv.height, calls: c && c.__calls ? c.__calls.length : '(真实浏览器里没有记账)' };
    },
    help: 'ZW.__app：state / ui / nav / openChart(id?) / closeChart() / spin() / flowJump(id,label) / draw()'
  };
  console.log('调试出口已开启 →', ZW.__app.help);
}

/* ============================== 启动 ============================== */
/* 启动之前把 js/spin.js 需要的依赖注入齐（放在这里是因为要用到上面所有定义） */
useSpinHooks({
  draw:           () => draw(),
  requestDraw:    () => requestDraw(),
  winnerIndex:    (secs, r) => winnerIndex(secs, r),
  layoutSectors:  (opts, w) => layoutSectors(opts, w),
  pickIndex:      opts => pickIndex(opts),
  currentWheel:   () => currentWheel(),
  activeOptions:  w => activeOptions(w),
  setResultLabel: (label, optId) => { ui.resultLabel = label; ui.resultOptId = optId; },
  addHistory:     (w, label) => addHistory(w, label),
  applyGrowth:    label => applyGrowth(label),
  flowJump:       (w, opt, label) => flowJump(w, opt, label),
  clearJump:      () => clearJump(),
  pendingClear:   () => { state.flow.pendingId = ''; },
  expandFlowBar:  () => { ui.flowCollapsed = false; renderFlowBar(); },
  openContent:    () => openSheet('manager', 'content'),
  saveSoon:       () => saveSoon(),
  toast:          (m, o) => toast(m, o),
  copyText:       t => copyText(t),
  config: {
    sound:    () => state.settings.sound !== false,
    vibrate:  () => state.settings.vibrate !== false,
    duration: () => state.settings.duration,
    rolling:  () => state.settings.rolling,
    spinFx:   () => state.settings.spinFx,
    autoFlip: () => state.settings.autoFlip
  }
});

function boot(){
  $$('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
  refreshTitle();
  applyTheme();
  bindEvents();
  fitWheel();
  requestDraw();
  loadGearSfx();                                  // 提前解码齿轮音，第一次打开维度图就能响
  booting = false;
  exposeDebug();                                  // 开了调试开关才生效（见上面的说明）
  try {
    if (!localStorage.getItem(HINT_KEY)) {
      localStorage.setItem(HINT_KEY, '1');
      setTimeout(() => toast('点转盘开始 · 点结果看操作 · 空格也行'), 700);
    }
  } catch(e){}
}
function init(){
  const hadLocal = (() => { try { return !!localStorage.getItem(LS_KEY); } catch(e){ return false; } })();
  loadWheelFiles(defs => {
    fileWheelCount = defs.length;
    /* 关键：默认「浏览器缓存为准」——
       文件只在「第一次打开」或用户点「从文件重新读取」时生效，
       否则网页上的增删改会在刷新后被文件覆盖（以前就是这个坑）。 */
    const useFiles = defs.length && (!hadLocal || state.settings.fromFiles === true);
    if (useFiles) { applyWheelFiles(defs); save(); }
    if (defs.length) {
      getDir(false).then(d => {
        dirUsable = !!d;
        if (dirUsable && isOverlayOpen() && ui.mtab === 'settings') renderSheet('swap');
      });
    }
    boot();
  });
}
init();
})();
</script>
