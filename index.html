<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F3EFE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>咒术转盘</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="seal" aria-hidden="true">咒</span>
    <button class="title-pill" id="btnSwitch" aria-label="切换或管理转盘" aria-haspopup="dialog">
      <span class="pico" data-icon="menu"></span>
      <span class="pname" id="wheelName">咒术转盘</span>
      <span class="pico chev" data-icon="chevron"></span>
    </button>
  </header>
  <div class="flow-bar" id="flowBar" hidden></div>

  <main class="stage">
    <div class="result" id="result" role="button" tabindex="0" aria-label="当前没有结果" title="点开结果操作">？</div>
    <span class="sr-only" id="resultLive" role="status" aria-live="polite" aria-atomic="true"></span>
    <div class="wheel-wrap" id="wheelWrap"><canvas id="wheel" role="button" tabindex="0" aria-label="旋转当前转盘"></canvas></div>
  </main>

  <footer class="controls">
    <button class="round" id="btnPanel" title="设置与记录" aria-label="设置与记录" data-icon="sliders"></button>
    <button class="round" id="btnEdit" title="编辑当前转盘选项" aria-label="编辑当前转盘选项" data-icon="edit"></button>
  </footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="面板">
  <div class="sheet" id="sheet" tabindex="-1"></div>
</div>

<div class="overlay confirm-overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="cTitle" aria-describedby="cDesc">
  <div class="dialog" tabindex="-1">
    <h4 id="cTitle">提示</h4>
    <p id="cDesc"></p>
    <input class="c-input" id="cInput" type="text" hidden>
    <div class="c-acts">
      <button class="btn ghost" id="cCancel">取消</button>
      <button class="btn" id="cOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';

/* ============================== 命名空间转发 ==============================
   js/*.js 里的工具都挂在 window.ZW 上。这里把它们转成本文件里的短名，
   这样下面的业务代码写法和以前一模一样（$ / esc / clamp / colorOf …）。
   ⚠️ 加新的 js 文件时：在那个文件里 Object.assign(ZW, {...})，
      再到这里补一行转发（顺序要对齐 index.html 里 <script src> 的顺序）。
   ========================================================================= */
const { TAU,
        FONT,
        WFONT,
        PALETTES,
        $,
        $$,
        esc,
        uid,
        num,
        norm,
        clamp,
        random,
        setRandomSeed,
        randomSeed,
        randomDraws,
        replayCode,
        parseReplayCode,
        hslToHex,
        hexToRgb,
        colorOf,
        textOn,
        shuffleArr,
        usePalette,
        paletteOf,
        paletteKeyNow,
        svg,
        ICONS,
        icon,
        audio,
        beep,
        tickSound,
        loadGearSfx,
        playGearSfx,
        gearTick,
        winSound,
        vibrate,
        useAudioConfig,
        hasGearSfx,
        spin,
        animateSpin,
        applySpinFx,
        startSpinFx,
        endSpinFx,
        spinFxKey,
        SPIN_FX,
        setResult,
        setLiveText,
        beginRolling,
        endRolling,
        useSpinHooks,
        prefersReducedMotion,
        FACE_WHEN,
        whenLabel,
        gradeIndex,
        matchWhen,
        isMultiWheel,
        faceSourceName,
        faceCount,
        lastResultOf,
        faceOf,
        optionsOf,
        faceDesc,
        useMultiHooks,
        byRef,
        state,
        chartDwellSec,
        RECOVERY_KEY,
        currentWheel,
        activeOptions,
        layoutSectors,
        seed,
        wheelById,
        save,
        nextOf,
        nextInOrderAfter,
        BASE_FLOW,
        optById,
        wheelOptions,
        STAY,
        END,
        saveSoon,
        makeWheel,
        pushUndo,
        storageStatus,
        CHART_DWELL_MIN,
        profileIndex,
        undoStack,
        findOptionById,
        wheelMatchesFilter,
        inferWheelCategory,
        editFaceIndex,
        faceOptions,
        slotText,
        defaultTargetLabel,
        simulateWheel,
        editOpts,
        editOptsName,
        STATE_VER,
        normalize,
        undoToast,
        version,
        LS_KEY,
        PROFILE_PREFIX,
        loadState,
        storageErrorReset,
        moveWheel,
        makeOption,
        parseBatch,
        addProfile,
        renameProfile,
        deleteProfile,
        undoLast,
        switchProfile,
        WHEEL_CATEGORIES,
        winnerIndex,
        pickIndex,
        addHistory,
        HINT_KEY } = ZW;
/* 多面转盘模块也不认识 state，这里把主逻辑里的东西喂给它 */
useMultiHooks({
  parseGrade: label => parseGrade(label),
  grownLabel: (id, label) => grownLabel(id, label),
  flowPath: () => (state.flow && state.flow.path) || [],
  history: () => state.history || [],
  wheels: () => state.wheels || []
});

/* 图标（svg / ICONS / icon）在 js/icons.js 里 */

/* 维度图自动弹窗的停留时长（秒）→ 规范成 [下限, 上限] 里的数；没设/设成 0 用默认值。
   放在最前面是因为 normalize() 会用到它。 */
function chartAutoDwellMs(){
  return Math.round(chartDwellSec(state.settings.chartDwell) * 1000);
}

/* ============================== 数据 ============================== */
const CHART_SHOW_DELAY = 650;      // 抽完之后等多久弹出来（毫秒）；先让结果动效播完
const CHART_RESUME_GAP = 280;      // 收起后等多久再继续下一站（毫秒）；等收起动画走完


let importRecoveryRaw = (() => {
  try { return localStorage.getItem(RECOVERY_KEY) || ''; } catch(e) { return ''; }
})();
const ui = { view:'none', mtab:'wheels', treeOpen:{}, targetCtx:null, flowCollapsed:false, resultLabel:'', resultOptId:'',
             faceWheelId:'', faceEdit:'auto', faceWhenIdx:-1, wheelQuery:'', wheelFilter:'all', simResults:null };
/* 跨模块共享的运行时变量在 js/core.js 里。转盘角度 rot 由 js/spin.js 每帧改写、
   绘制这边要读，所以集中放 core；绘制里统一写 core.rot（别用本地副本，会不同步）。 */
const core = ZW.core;
let wheelSize = 0;                     // 逻辑边长同时同步到 core.wheelSize（别的模块要用）
function getRot(){ return core.rot; }
function setRot(v){ core.rot = v; }
/* 给 js/spin.js 用的读写口 + 重绘触发（模块之间只通过这些函数来往，不碰内部变量） */
Object.assign(ZW.rot = ZW.rot || {}, { get:getRot, set:setRot });

const canvas = $('#wheel');
const ctx = canvas.getContext('2d');
const resultEl = $('#result');
const resultLive = $('#resultLive');
const wheelWrap = $('#wheelWrap');   // 旋转按钮已移除：点转盘 / 空格键都能开始
/* 这几个 DOM 引用也要给 js/spin.js 用，挂到 ZW.dom 上（原来的短名保持不动） */
Object.assign(ZW.dom = ZW.dom || {}, { canvas, ctx, resultEl, resultLive, wheelWrap });

function cssVar(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}
function requestDraw(){
  if (core.drawQueued) return;
  core.drawQueued = true;
  requestAnimationFrame(() => { core.drawQueued = false; draw(); });
}
function fitWheel(){
  const stage = $('.stage');
  const availW = stage.clientWidth - 6;
  const availH = stage.clientHeight - resultEl.offsetHeight - 26;
  const size = Math.max(150, Math.min(availW, availH, 470));
  if (Math.abs(wheelSize - size) < 0.5) return;
  wheelSize = size;
  core.wheelSize = size;
  wheelWrap.style.width = size + 'px';
  wheelWrap.style.height = size + 'px';
}
/* 把一段文字切成两行：优先在标点处切，并让两段宽度尽量接近 */
function splitTwoLines(text, budget, measure){
  const n = String(text).length;
  if (n < 2) return null;
  const soft = '（(）)·、，,。：:；;—-—/／ 　';
  const closing = '）)」』】〕］';
  let best = null;
  for (let i = 1; i < n; i++) {
    const a = text.slice(0, i), b = text.slice(i);
    const wa = measure(a), wb = measure(b);
    if (wa > budget || wb > budget) continue;
    const okBreak = soft.indexOf(text[i]) >= 0 || soft.indexOf(text[i - 1]) >= 0;
    let score = Math.abs(wa - wb);
    if (okBreak) score -= budget * 0.6;
    if (closing.indexOf(text[i]) >= 0) score += budget * 0.8;   // 别让第二行以右括号开头
    if (!best || score < best.score) best = { a:a, b:b, score:score };
  }
  return best ? [best.a, best.b] : null;
}
function draw(){
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  if (!cw || !ch) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const W = Math.round(cw * dpr), H = Math.round(ch * dpr);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);

  const cx = cw / 2, cy = ch / 2, R = Math.min(cw, ch) / 2;
  const cRing = cssVar('--w-ring', '#fff');
  const cHub  = cssVar('--w-hub', '#f6f2e8');
  const cPtr  = cssVar('--w-pointer', '#fff');
  const cSep  = cssVar('--w-sep', 'rgba(255,255,255,.86)');
  const ring = R * 0.05, R2 = R - ring, hubR = R * 0.155;

  // 底盘（纸白外圈）
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.fillStyle = cRing;
  ctx.shadowColor = 'rgba(110,95,70,.20)';
  ctx.shadowBlur = R * 0.10;
  ctx.shadowOffsetY = R * 0.025;
  ctx.fill();
  ctx.restore();
  // 手绘墨线圈（固定种子 → 每帧一致，不会抖动）
  ctx.save();
  ctx.strokeStyle = cssVar('--ink', '#2A241C');
  ctx.lineWidth = Math.max(1, R * 0.0055);
  ctx.lineJoin = 'round';
  sketchCircle(cx, cy, R - Math.max(1, R * 0.006), 7, 2, 0.30);
  ctx.restore();

  const w = currentWheel();
  const opts = activeOptions(w);
  if (!opts.length) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R2, 0, TAU);
    ctx.fillStyle = cSep; ctx.fill();
    ctx.fillStyle = cssVar('--muted', '#9C9384');
    ctx.font = '600 ' + Math.round(R * 0.085) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('暂无选项', cx, cy);
    ctx.font = '500 ' + Math.round(R * 0.055) + 'px ' + FONT;
    ctx.fillText('点右下角编辑内容', cx, cy + R * 0.13);
    ctx.restore();
    drawHub(cx, cy, R, hubR, cHub, cPtr, cSep);
    return;
  }

  const secs = layoutSectors(opts, w);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(getRot());
  // 扇形
  secs.forEach(s => {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, R2, s.start, s.end);
    ctx.closePath();
    ctx.fillStyle = s.color;
    ctx.fill();
  });
  // 分隔线
  ctx.lineWidth = Math.max(1.2, R2 * 0.006);
  ctx.strokeStyle = cSep;
  secs.forEach(s => {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(s.start) * R2, Math.sin(s.start) * R2);
    ctx.stroke();
  });
  // 文字
  /* 排版策略：
     ① 单行能放下、字号也够看 → 单行（短标签和以前完全一样）
     ② 单行得把字缩到「看不清」才行 → 改排两行：两段沿半径**并排**（横跨扇区宽度），
        每段只用一半长度，所以字号能大一倍左右，多出三四个字也放得下
     ③ 两行都塞不进（扇区太窄/文字太长）→ 按能放下的字号画出来，不截断，
        超出转盘的部分被圆盘裁掉（就是你说的「冲突的字允许被转盘遮挡」） */
  const maxLen = R2 * 0.945 - hubR * 1.25;
  const MIN_FS = Math.max(9.5, R2 * 0.048);
  const pad = R2 * 0.055;
  const measureAt = (size, t) => { ctx.font = '600 ' + size.toFixed(1) + 'px ' + WFONT; return ctx.measureText(t).width; };
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, R2, 0, TAU); ctx.clip();      // 超出转盘的文字被挡住
  secs.forEach(s => {
    const label = (s.opt.label || '').trim();
    if (!label) return;
    ctx.save();
    ctx.rotate(s.mid);
    let flip = false;
    if (state.settings.autoFlip && Math.cos(norm(s.mid + getRot())) < 0) { flip = true; ctx.rotate(Math.PI); }
    ctx.textAlign = flip ? 'left' : 'right';
    ctx.textBaseline = 'middle';
    const baseFs = clamp(Math.min(R2 * 0.125, s.span * R2 * 0.52), MIN_FS, 27);
    const xOuter = flip ? -pad - maxLen : R2 - pad;
    /* ① 单行：先求能放下的最大字号 */
    let f1 = baseFs;
    while (f1 > MIN_FS && measureAt(f1, label) > maxLen) f1 -= 0.5;
    const singleOk = measureAt(f1, label) <= maxLen;
    /* ② 两行：两段并排，各自只用整段长度 */
    const readable = Math.max(baseFs * 0.72, 11);
    let f2 = 0, parts = null;
    if (!singleOk || f1 < readable) {
      for (let size = baseFs; size >= MIN_FS; size -= 0.5) {
        const p = splitTwoLines(label, maxLen, t => measureAt(size, t));
        if (!p) continue;
        /* 两行要横着占地方：最靠内的那行半径越小，切向越窄，窄过两行高度就塞不下 */
        const wMax = Math.max(measureAt(size, p[0]), measureAt(size, p[1]));
        const rIn = Math.max(hubR * 1.2, R2 - pad - wMax);
        const halfArc = Math.max(3, rIn * Math.sin(Math.min(s.span, Math.PI * 0.95) / 2));
        if (size * 1.24 <= halfArc * 2) { parts = p; f2 = size; break; }
      }
    }
    const useTwo = !!parts && f2 > f1 + 0.4;
    const fs = useTwo ? f2 : f1;
    ctx.font = '600 ' + fs.toFixed(1) + 'px ' + WFONT;
    ctx.fillStyle = textOn(s.color);
    ctx.shadowColor = 'rgba(0,0,0,.16)';
    ctx.shadowBlur = 3;
    if (useTwo) {
      const lh = fs * 1.24;
      ctx.fillText(parts[0], xOuter, -lh / 2);
      ctx.fillText(parts[1], xOuter,  lh / 2);
    } else {
      ctx.fillText(label, xOuter, 0);        // 不截断：超出圆盘的部分由上面的 clip 遮住
    }
    ctx.restore();
  });
  ctx.restore();
  ctx.restore();

  drawHub(cx, cy, R, hubR, cHub, cPtr, cSep);
}
function drawHub(cx, cy, R, hubR, cHub, cPtr, cSep){
  ctx.save();
  ctx.translate(cx, cy);
  // 小巧针尖：与中心圆盘同色，尖头只探出很短一截
  const baseY = -hubR * 0.5;          // 针尾（藏在圆盘里）
  const tipY  = -R * 0.22;            // 针尖高度：越接近 -R*0.155 越短
  const len   = baseY - tipY;         // 可见长度
  const pw    = R * 0.040;            // 半宽（保持不变）
  ctx.beginPath();
  ctx.moveTo(0, tipY);
  ctx.bezierCurveTo(pw * 1.55, tipY + len * 0.36, pw * 1.22, baseY, 0, baseY);
  ctx.bezierCurveTo(-pw * 1.22, baseY, -pw * 1.55, tipY + len * 0.36, 0, tipY);
  ctx.closePath();
  ctx.fillStyle = cPtr;                                   // = 中心圆盘色（--w-hub / --w-pointer）
  ctx.shadowColor = 'rgba(90,75,50,.22)';
  ctx.shadowBlur = R * 0.030;
  ctx.shadowOffsetY = R * 0.008;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = Math.max(1, R * 0.004);                 // 墨色细描边：两种主题下都有对比
  ctx.strokeStyle = cssVar('--ink', '#2A241C');
  ctx.globalAlpha = 0.5;
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(0, 0, hubR, 0, TAU);
  ctx.fillStyle = cHub; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, hubR - 0.5, 0, TAU);
  ctx.lineWidth = 1; ctx.strokeStyle = cSep; ctx.stroke();
  // 中心手绘墨圈
  ctx.strokeStyle = cssVar('--ink', '#2A241C');
  ctx.lineWidth = Math.max(1, R * 0.005);
  sketchCircle(0, 0, hubR * 1.04, 23, 1, 0.34);
  ctx.restore();
}
/* 手绘圈：固定种子生成轻微抖动，两次描边模拟毛笔重叠 */
function sketchCircle(cx, cy, r, seed, passes, alphaBase){
  const N = 96;
  for (let p = 0; p < passes; p++) {
    let s = seed + p * 977;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * TAU;
      const rr = r + (rnd() - 0.5) * r * 0.017 - p * r * 0.007;
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    ctx.globalAlpha = alphaBase * (p === 0 ? 1 : 0.62);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* 声音与震动（audio / beep / tickSound / winSound / loadGearSfx / playGearSfx / gearTick / vibrate）
   在 js/sound.js 里 */

/* 旋转（setResult / setLiveText / SPIN_FX / applySpinFx / animateSpin / spin）
   在 js/spin.js 里 —— 那边的函数从 ZW.dom 和注入的 hooks 拿依赖 */

function fmtTime(t){
  const d = new Date(t || Date.now());
  const p = n => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ============================== 分支流程 ============================== */
let jumpTimer = null, arriveTimer = null;
let chartAutoTimer = null;
let chartFlowDone = null;          // 自动弹图时「收起之后接着要做什么」（流程继续往下一站）
/* 自动弹出的维度图被收起来了 → 通知流程继续。
   不管是到点自动收、还是用户自己按的关闭/返回，都从这里走；
   否则「用户提前关掉」会把流程永久卡在原地（pendingId 还在、但没有定时器了）。 */
function afterChartDismiss(){
  if (!chartFlowDone) return;
  const done = chartFlowDone;
  chartFlowDone = null;            // 先清再调，避免 done 里再触发一次
  try { done(); } catch(e){}
}
/* 自动弹出某张维度图，停留「设置里的秒数」后自动收起，然后执行 done（流程继续往下走）。
   · 弹出前会等一下（CHART_SHOW_DELAY），让抽奖的结果动效先播完
   · 弹出时刻用户已经开着别的面板 → 不抢焦点，直接把流程交给 done（不卡住）
   · 停留期间用户自己关掉 → 走 afterChartDismiss()，流程照常继续
   · 停留到点时图上又叠了别的面板 → 只认「这张图看过了」，流程交给 done 里的 continueFlow 兜底 */
function showChartThen(chart, done){
  if (!chart) { if (done) done(); return; }
  clearTimeout(chartAutoTimer);
  chartAutoTimer = setTimeout(() => {
    chartAutoTimer = null;
    if (isOverlayOpen()) { if (done) done(); return; }
    ui.chartItem = chart;
    navTo('chart');
    toast('本站属性维度图 · ' + chartDwellSec(state.settings.chartDwell) + ' 秒后继续', { action:'现在继续', fn:() => navGoBack() });
    chartFlowDone = () => {
      hideToast();
      setTimeout(() => { if (done) done(); }, CHART_RESUME_GAP);
    };
    chartAutoTimer = setTimeout(() => {
      chartAutoTimer = null;
      /* 还停在维度图上 → 正常收起（navGoBack 会走 afterChartDismiss）；
         已经被别的东西盖住了 → 只认「这张图看过了」 */
      if (isOverlayOpen() && ui.view === 'chart' && ui.chartItem === chart) navGoBack();
      else afterChartDismiss();
    }, chartAutoDwellMs());
  }, CHART_SHOW_DELAY);
}
/* 位置正好在某个转盘之后的维度图 */
function chartAfter(wheelId){
  const hit = (state.charts || []).filter(c => c.after === wheelId);
  return hit.length ? hit[hit.length - 1] : null;
}
/* 流程走到这个转盘时要不要顺手弹一张维度图（开关 + 停留时长都算上） */
function chartMidAt(wheelId){
  if (state.settings.chartMid === false) return null;
  if (!(chartDwellSec(state.settings.chartDwell) > 0)) return null;
  return chartAfter(wheelId);
}
/* 收好尾之后真正跳到下一站：定时器回调、维度图收起回调、手动「→ 下一站」都走这里。
   这一段是从 flowJump 里抽出来的：多一条路进来就少一个"忘了清 pendingId"的坑。 */
function continueFlow(id){
  const f = state.flow;
  if (!f || !f.autoJump || f.paused || f.finished) return false;
  const target = wheelById(id);
  if (!target) { f.pendingId = ''; renderFlowBar(); return false; }
  clearJump();
  f.pendingId = '';
  switchTo(id, { silent:true, spin: f.autoSpin });
  return true;
}
/* 流程走完时：如果有维度图，就自动展示（可在设置里关掉「流程结束时弹出属性维度图」） */
function showChartForEnd(done){
  if (state.settings.chartOnEnd === false) return false;
  const list = state.charts || [];
  if (!list.length) return false;
  const last = list.slice().sort((a, b) => chartSlotIndex(a) - chartSlotIndex(b))[list.length - 1];   // 位置最靠后的那张
  showChartThen(last, done || null);
  return true;
}
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }
function clearJump(){
  if (jumpTimer) { clearTimeout(jumpTimer); jumpTimer = null; }
  if (arriveTimer) { clearTimeout(arriveTimer); arriveTimer = null; }
}
async function switchTo(id, opts){
  opts = opts || {};
  const target = wheelById(id);
  if (!target) return;
  clearJump();
  if (id === state.currentId) { if (opts.spin) spin(); return; }
  const stage = $('.stage');
  /* 拿不到舞台元素也要能跳（比如 DOM 被改过 / 别的地方复用了跳转逻辑），
     不能让"少一个淡出动画"把整条流程打断 */
  if (stage) stage.classList.add('fading');
  await wait(160);
  state.currentId = id;
  ui.flowCollapsed = true;              // 跳转后先收起流程条，避免抢视线
  setResult('？', false);
  resultEl.classList.remove('small');
  refreshTitle();
  requestDraw();
  save();
  if (stage) stage.classList.remove('fading');
  if (!opts.silent) toast('已跳到「' + target.name + '」');
  if (opts.spin) arriveTimer = setTimeout(() => { arriveTimer = null; spin(); }, 500);
}
function resetFlow(){
  const f = state.flow;
  clearJump();
  f.path = []; f.pendingId = ''; f.finished = false; f.retStack = []; f.paused = false;
  f.grow = {};                                   // 新一轮：清空成长累计
  setRandomSeed(state.settings.randomSeed || ''); // 同一种子重新开始会得到同一轮结果
  f.roundAt = Date.now();                        // 新的一轮：属性图从这一刻重新算
  const rootId = (f.rootId && wheelById(f.rootId)) ? f.rootId : state.currentId;
  save();
  renderFlowBar();
  if (rootId !== state.currentId) switchTo(rootId, { silent:true });

function flowJump(w, opt, label){
  const f = state.flow;
  if (!f.enabled) return;
  if (!Array.isArray(f.retStack)) f.retStack = [];
  f.path.push({ wheelId:w.id, wheel:w.name, label:label, at:Date.now() });
  if (f.path.length > 160) f.path = f.path.slice(-120);
  ui.flowCollapsed = false;

  const explicit = !!(opt && opt.next);
  let nx = nextOf(w, opt);
  /* 分支转盘本身不在默认顺序里：抽完如果没为这个选项设目标，
     就回到「当初从哪个转盘拐进来的」，接着那个转盘的默认下一站往下走 */
  if (w.branch && !explicit) {
    let guard = 0;
    while (nx.kind === 'none' && f.retStack.length && guard++ < 30) {
      const back = f.retStack.pop();
      const origin = back ? wheelById(back.origin) : null;
      if (!origin) continue;
      nx = nextOf(origin, null);
      /* 「接着原转盘的默认顺序」：
         - 原盘没设默认下一站 → 顺着列表顺序找下一个普通转盘
         - 原盘的默认下一站就是这条分支自己（或另一个分支）→ 同上，避免自己跳回自己
         - 只有明确写了「结束」才真的结束 */
      if (nx.kind === 'none' || (nx.kind === 'wheel' && (nx.wheel.id === w.id || nx.wheel.branch))) {
        const alt = nextInOrderAfter(origin.id);
        nx = alt ? { kind:'wheel', id:alt.id, wheel:alt } : { kind:'none' };
      }
      if (origin.branch && nx.kind === 'none') continue;   // 原转盘自己也是分支 → 继续往外找
      break;
    }
  }
  if (nx.kind === 'end') {
    f.pendingId = ''; f.finished = true;
    saveRoundChart();                               // 记录一下本局结果（供导出/统计）
    save(); renderFlowBar();
    toast('流程结束：' + label, { action:'重新开始', fn:resetFlow });
    const finish = () => { if (!isOverlayOpen()) navTo('complete'); };
    if (!showChartForEnd(finish)) setTimeout(finish, CHART_SHOW_DELAY);
    return;
  }
  if (nx.kind === 'wheel') {
    /* 防死循环：最近 12 步里出现「长度 1~4 的循环重复 3 轮以上」→ 临时暂停自动跳转
       （只暂停，不改开关；点「继续」/手动切换/重来即恢复） */
    const loopLen = f.autoJump && !f.paused ? loopDetected() : 0;
    if (loopLen) {
      f.paused = true; f.pendingId = '';
      save(); renderFlowBar();
      const where = loopLen === 1 ? ('「' + w.name + '」') : (loopLen + ' 个转盘之间');
      toast('流程在 ' + where + ' 反复循环，已临时暂停自动跳转', { action:'继续连转', fn:() => { state.flow.paused = false; renderFlowBar(); toast('已恢复自动跳转'); } });
      return;
    }
    /* 顺序走到维度图那一位：先弹出来看一眼，自动收起后再继续往下一站。
       只在"会自动往下走"的时候才弹（手动模式 / 已暂停时点「→ 下一站」就行，别抢注意力）。
       开关：「中途自动弹出维度图」(chartMid)，停留时长见设置里的 chartDwell。 */
    const midChart = (f.autoJump && !f.paused) ? chartMidAt(w.id) : null;
    if (midChart) {
      if (nx.wheel.branch) f.retStack.push({ origin: w.id }); else f.retStack.length = 0;
      f.pendingId = nx.id;
      const here = state.currentId;                 // 收图那一刻还停在本盘才算数
      save(); renderFlowBar();
      showChartThen(midChart, () => {
        if (state.currentId !== here) {             // 用户自己换了转盘 → 别把他拽回来
          if (state.flow.pendingId === nx.id) { state.flow.pendingId = ''; renderFlowBar(); }
          return;
        }
        continueFlow(nx.id);
      });
      return;
    }
    if (nx.wheel.branch) f.retStack.push({ origin: w.id });   // 拐进分支：记住回来的路
    else f.retStack.length = 0;                               // 回到主线：偏离结束
    f.pendingId = nx.id;
    save(); renderFlowBar();
    if (!f.autoJump || f.paused) return;           // 手动模式 / 已暂停：点顶部「→ 下一站」再走
    jumpTimer = setTimeout(() => {
      jumpTimer = null;
      continueFlow(nx.id);
    }, Math.max(400, num(f.delay) * 1000));
    return;
  }
  if (!w.branch) f.retStack.length = 0;            // 主线停在原地，同样算偏离结束
  f.pendingId = '';
  save(); renderFlowBar();
}
/* 最近 12 步里是否出现长度 1~4 的循环（重复 3 轮以上）→ 返回循环长度，否则 0 */
function loopDetected(){
  const p = state.flow.path;
  if (!p || p.length < 6) return 0;
  const ids = p.slice(-12).map(x => x.wheelId);
  for (let len = 1; len <= 4; len++) {
    const need = len * 3;
    if (ids.length < need) continue;
    let same = true;
    for (let i = ids.length - need + len; i < ids.length; i++) {
      if (ids[i] !== ids[i - len]) { same = false; break; }
    }
    if (same) return len;
  }
  return 0;
}
let flowCollapseTimer = null;

/* ============================== 属性维度（等级 → 维度图） ==============================
   像「E- / E / D / C / B / A / S / SS / SSS / EX」这种带等级的转盘，
   抽完一轮后汇总成一张雷达图。分值 = 等级 × 10（E- = 17，EX = 100）。
   ==================================================================================== */
const GRADES = { F:1, E:2, D:3, C:4, B:5, A:6, S:7, SS:8, SSS:9, EX:10 };
function parseGrade(label){
  const m = String(label == null ? '' : label).match(/^\s*(EX|SSS|SS|S|A|B|C|D|E|F)\s*([+\-＋－]?)/i);
  if (!m) return null;
  let v = GRADES[m[1].toUpperCase()];
  if (v == null) return null;
  if (m[2] === '+' || m[2] === '＋') v += 0.3;
  else if (m[2] === '-' || m[2] === '－') v -= 0.3;
  return Math.max(0, Math.min(10, v));
}
/* 这个转盘算不算「属性盘」：手动指定优先，否则看选项里等级标签的比例
   注意：按「当前展示的全部选项」判断，不受临时停用（权重 0）影响；
        多面转盘按**当前命中的那一面**看。 */
function isGradeWheel(w){
  if (!w) return false;
  if (w.grade === true) return true;
  if (w.grade === false) return false;
  const opts = wheelOptions(w);
  if (!opts.length) return false;
  const hit = opts.filter(o => parseGrade(o.label) != null).length;
  return hit >= Math.ceil(opts.length * 0.6);
}
/* ===== 成长：转到「XX+N」就给对应属性升 N 级（EX 封顶） ===== */
const GRADE_LADDER = ['E-', 'E', 'D', 'C', 'B', 'A', 'S', 'SS', 'SSS', 'EX'];
/* 简称 → 转盘名（成长转盘里写的是「体术」「评级」这种简称） */
const GROW_ALIAS = [
  ['体术', '体术水平'], ['体质', '体质（基础体质）'], ['咒操', '咒力操纵'], ['操纵', '咒力操纵'],
  ['效率', '咒力效率'], ['评级', '等级评定'], ['高级技巧', '高级技巧会几个'],
  ['颜值', '穿越后的颜值'], ['道德', '道德水平'], ['咒力总量', '咒力总量'], ['天赋', '天赋']
];
/* 成长文字里那个「名字」最长多少字。
   ⚠️ 超过这个长度就解析不到（会安静地不生效）—— 所以：
      · 转盘名超过 24 字的，写成长时请用简称（部分匹配也算），或者把转盘名改短
      · 编辑器里会对过长的写法给出提示，见 growHintFor() */
const GROW_WORD_MAX = 24;

function growTargetWheel(word){
  const clean = String(word || '').replace(/[\s（(【\[].*$/, '').replace(/[的了之]$/, '').trim();
  if (!clean) return null;
  const ws = state.wheels || [];
  let w = ws.filter(x => x.name === clean)[0];
  if (!w) w = ws.filter(x => x.name.indexOf(clean) >= 0)[0];
  if (!w) {
    const a = GROW_ALIAS.filter(pr => clean.indexOf(pr[0]) >= 0 || pr[0].indexOf(clean) >= 0)[0];
    if (a) w = ws.filter(x => x.name === a[1])[0] || ws.filter(x => x.name.indexOf(a[1].replace(/（.*$/, '')) >= 0)[0];
  }
  return w || null;
}
/* 编辑器用：这个成长写法能不能对上转盘？
   返回 null 表示没问题；否则返回一句提示。 */
function growHintFor(label){
  const s = String(label || '');
  if (!/[＋+]/.test(s)) return null;
  if (/无属性成长|虚度光阴/.test(s)) return null;          // 明确不成长
  const words = [];
  const mAll = s.match(/[（(]([^）)]*)[＋+]/);
  [mAll ? mAll[1] : null, s].filter(Boolean).forEach(body => {
    const re = new RegExp('([^＋+\\d（()）]{1,' + GROW_WORD_MAX + '}?)\\s*[＋+]\\s*(\\d+)', 'g');
    let m;
    while ((m = re.exec(body))) m[1].split(/[与和、,，]/).forEach(nm => words.push(nm));
  });
  if (!words.length) return null;                          // 没解析到词，不以为是成长
  const bad = words.filter(w => !growTargetWheel(w));
  if (bad.length) return '看不出「' + bad.join('、') + '」对应哪个转盘 —— 这个成长不会生效（写转盘名或它的一部分）';
  /* 词太长的情况：整体写法可能已经被正则截断 */
  if (s.length > GROW_WORD_MAX && !/无属性成长/.test(s)) {
    const anyByName = words.some(w => growTargetWheel(w));
    if (!anyByName && s.length > GROW_WORD_MAX) return '写法太长了，成长词最多 ' + GROW_WORD_MAX + ' 字';
  }
  return null;
}
/* 解析一次抽屉结果的成长项：[{ wheel, steps }]；「虚度光阴（无属性成长）」返回空
   支持这些写法：
     体术+1                        简称（走别名表）
     咒力操纵+1 / 剑术造诣+1        转盘名（或名字的一部分）
     体质（基础体质）+1             **写全名、带括号**也行（见下面"括号名"那段）
     我掌握了咒力的核心！（咒操与效率+1）   括号里的补充说明；「与/和/、」隔开的多目标共用 +N
     我悟了！（阴阳术+1）（剑术+1）         多个括号各算各的 */
function parseGrowth(label){
  const s = String(label || '');
  if (/无属性成长|虚度光阴/.test(s)) return [];
  const out = [], seen = {};
  const push = (word, n) => {
    const w = growTargetWheel(word);
    if (!w || seen[w.id]) return;
    seen[w.id] = 1;
    out.push({ wheel: w, steps: Math.max(1, Math.min(5, n)) });
  };
  const scan = (body, allowParens) => {
    /* allowParens：允许匹配段里出现括号 —— 用来认「（咒操与效率+1）」这种整段，
       以及「体质（基础体质）+1」这种名字自带括号的写法 */
    const cls = allowParens ? '[^＋+\\d）)]' : '[^＋+\\d（()）]';
    const re = new RegExp('(' + cls + '{1,' + GROW_WORD_MAX + '}?)\\s*[＋+]\\s*(\\d+)', 'g');
    let m;
    while ((m = re.exec(body))) {
      const n = parseInt(m[2], 10) || 1;
      m[1].split(/[与和、,，]/).forEach(nm => push(nm, n));   // 「咒操与效率+1」→ 两个目标共用 +1
    }
  };
  scan(s, false);                       // ① 正常扫一遍（不含括号的写法）
  /* ② 名字自带括号的情况：「体质（基础体质）+1」
        上面的扫描会在括号处截断，解析不出「体质（基础体质）」→ 这里补一轮特殊处理。
        做法：找「（…）」紧跟 +N 的片段，把括号里的内容**并进**它前面的词。
        ⚠️ 这一步只在"值本身带括号"时才做，避免把「我悟了！（阴阳术+1）」
           这种"说明文字里带成长"的写法误读成一整个长名字。 */
  {
    const re2 = /([^＋+\d（()）]{1,24})\s*[（(]([^）)]*)[）)]\s*[＋+]\s*(\d+)/g;
    let m2;
    while ((m2 = re2.exec(s))) {
      const n = parseInt(m2[3], 10) || 1;
      if (growTargetWheel(m2[1] + '（' + m2[2] + '）')) push(m2[1] + '（' + m2[2] + '）', n);
    }
  }
  /* ③ 括号里的补充说明也可能带成长：我掌握了咒力的核心！（咒操与效率+1）
        也可能有多个括号：我悟了！（阴阳术+1）（剑术+1） */
  {
    const re3 = new RegExp('[（(]([^）)]{1,80}?)[）)]\\s*(?=[（(]|$)', 'g');
    let m3;
    while ((m3 = re3.exec(s))) scan(m3[1], true);
  }

}

  for (let i = 0; i < n; i++) {

    const cos = Math.cos(a);

    ctx.textBaseline = 'middle';
    const avail = Math.abs(cos) < 0.25 ? (w / 2 - 8) : (cos > 0 ? (w - lx - 6) : (lx - 6));

    ctx.fillStyle = c.muted;
    ctx.fillText(nameTxt, lx, ly - 9);
    let fs2 = 14;
    ctx.font = '700 ' + fs2 + 'px ' + WFONT;
    while (fs2 > 9 && ctx.measureText(valTxt).width > avail) { fs2 -= 0.5; ctx.font = '700 ' + fs2 + 'px ' + WFONT; }

function askDialog(o){

    $('#cTitle').textContent = o.title || '提示';
    const d = $('#cDesc'); d.textContent = o.desc || ''; d.hidden = !o.desc;
    const inp = $('#cInput');
    const isInput = o.value !== undefined && o.value !== null;
    inp.hidden = !isInput;
    if (isInput) inp.value = o.value;
    const ok = $('#cOk');
    ok.textContent = o.ok || '确定';
    ok.classList.toggle('danger', !!o.danger);
    ov.classList.add('open');

      try {
        if (isInput) { inp.focus(); inp.select(); }
        else ok.focus();
      } catch(e){}
    }, 60);
    const finish = v => {
      ov.classList.remove('open');
      ok.onclick = null; cancel.onclick = null; inp.onkeydown = null; ov.onclick = null; ov.onkeydown = null;
      if (previousFocus && previousFocus.focus && document.contains(previousFocus)) {
        setTimeout(() => { try { previousFocus.focus(); } catch(e){} }, 0);
      }
      resolve(v);
    };
    ok.onclick = () => finish(isInput ? inp.value : true);
    cancel.onclick = () => finish(isInput ? null : false);
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ok.click(); } };
    ov.onclick = e => { if (e.target === ov) finish(isInput ? null : false); };
    ov.onkeydown = e => {
      if (e.key === 'Escape') { e.preventDefault(); finish(isInput ? null : false); return; }
      if (e.key !== 'Tab') return;
      const focusables = isInput ? [inp, cancel, ok] : [cancel, ok];
      const at = focusables.indexOf(document.activeElement);
      if (e.shiftKey && at <= 0) { e.preventDefault(); focusables[focusables.length - 1].focus(); }
      else if (!e.shiftKey && at === focusables.length - 1) { e.preventDefault(); focusables[0].focus(); }
    };
  });
}

function flowDiagnostics(){
  const issues = [];
  const normal = state.wheels.filter(w => !w.branch);
  const ids = new Set(state.wheels.map(w => w.id));
  const graph = new Map(state.wheels.map(w => [w.id, []]));
  const incoming = new Map(state.wheels.map(w => [w.id, 0]));
  const addEdge = (from, to) => {
    if (!from || !ids.has(to) || to === END || to === STAY) return;
    if (graph.get(from).indexOf(to) < 0) graph.get(from).push(to);
    incoming.set(to, (incoming.get(to) || 0) + 1);
  };
  state.wheels.forEach(w => {
    const fallback = w.next || ((!w.branch && nextInOrderAfter(w.id)) ? nextInOrderAfter(w.id).id : '');
    addEdge(w.id, fallback);
    [w.options || []].concat((w.faces || []).map(facet => facet.options || [])).forEach(list => {
      list.forEach(option => addEdge(w.id, option.next));
    });
    if (!wheelOptions(w).some(option => num(option.weight) > 0)) {
      issues.push({ level:'error', text:'「' + w.name + '」没有可抽选项' });
    }
  });
  state.wheels.filter(w => w.branch && !(incoming.get(w.id) > 0)).forEach(w => {
    issues.push({ level:'warn', text:'分支盘「' + w.name + '」没有任何入口，正常流程到不了这里' });
  });
  const root = (state.flow.rootId && wheelById(state.flow.rootId)) || normal[0] || state.wheels[0];
  const seen = new Set();
  const walk = id => {
    if (!id || seen.has(id)) return;
    seen.add(id);
    (graph.get(id) || []).forEach(walk);
  };
  if (root) walk(root.id);
  state.wheels.filter(w => !seen.has(w.id) && (!w.branch || incoming.get(w.id) > 0)).forEach(w => {
    issues.push({ level:'warn', text:'从起点无法到达「' + w.name + '」' });
  });
  const visiting = new Set(), done = new Set(), cycleNames = new Set();
  const visit = id => {
    if (visiting.has(id)) { const w = wheelById(id); if (w) cycleNames.add(w.name); return; }
    if (done.has(id)) return;
    visiting.add(id);
    (graph.get(id) || []).forEach(visit);
    visiting.delete(id); done.add(id);
  };
  state.wheels.forEach(w => visit(w.id));
  if (cycleNames.size) issues.push({ level:'warn', text:'检测到可能循环：' + Array.from(cycleNames).join('、') + '（运行时仍会在连续循环后暂停）' });
  return issues;
}

/* 取多面转盘的「分面依据」转盘对象。

/* ============================== 多面转盘的面管理 ==============================

/* 改一个面的条件：先选条件类型，再选值（等级档位从那个属性盘的选项里取） */
function viewFaceWhen(){
  const w = wheelById(ui.faceWheelId);

  if (!w || !f) return head + '<div class="sheet-body"><div class="empty">这个面已经没了</div></div>';
  const when = f.when || { type:'else' };
  const src = faceSource(w);

  let valueBlock = '';
  if (when.type !== 'else') {
    /* 值从「依据转盘」的选项里挑，这样不会和实际标签对不上 */
    const pool = src ? wheelOptions(src) : [];
    const isGrade = when.type !== 'labelIs' && when.type !== 'labelHas';
    valueBlock = '<div class="sec-title">值</div>';

      valueBlock += '<div class="tools">' + GRADE_LADDER.map(g =>

        '<div class="hint">阶梯：' + GRADE_LADDER.join(' → ') + '。' +

    } else {
      valueBlock += '<div class="list">' + (pool.length
        ? pool.map(o => '<button class="pick-row' + (when.value === o.label ? ' on' : '') +
            '" data-act="setFaceWhenValue" data-val="' + esc(o.label) + '"><span>' + esc(o.label) + '</span></button>').join('')
        : '<div class="empty">依据的那个转盘还没有选项</div>') + '</div>' +

      '<button class="mini' + (when.type === x[0] ? ' on' : '') + '" data-act="setFaceWhenType" data-val="' + x[0] + '" title="' + esc(x[2]) + '">' +
      x[1] + '</button>').join('') + '</div>' +
    '<div class="hint">' + esc((FACE_WHEN.filter(x => x[0] === when.type)[0] || FACE_WHEN[5])[2]) + '</div>' +
    valueBlock +
    '<div class="hint">这个面当前是：<b>' + esc(whenLabel(when)) + '</b></div>' +
  '</div>';
}

      '<button class="mini" data-act="exportCurrentPack">导出此盘/支线</button>' +
      '<button class="mini" data-act="shuffle">' + icon('shuffle') + ' 打乱顺序</button>' +

      '<input type="checkbox" data-wheel-toggle="grade"' + (w.grade === true ? ' checked' : '') + '><i></i></label>' +

      '抽完一轮后可以在结果面板或「记录」页看维度图。' +
      '<button class="mini" data-act="gradeAuto" data-id="' + w.id + '" style="margin-left:6px">恢复自动判断</button></div>' +
    '<div class="hint">权重越大，扇区越大、被抽中的概率越高（例如 <b>五条悟*3</b> 的扇区面积是普通选项的 3 倍）。权重填 <b>0</b> 表示停用该选项，它不会出现在转盘上。</div>' +

function viewSimulation(){
  const data = ui.simResults || simulateWheel(currentWheel(), 10000);
  return '<div class="sheet-head"><button class="icon-btn" data-act="back" aria-label="返回">' + icon('back') + '</button>' +
    '<h3 class="sheet-title">概率模拟 · ' + esc(currentWheel().name) + '</h3><button class="icon-btn" data-act="close" aria-label="关闭">' + icon('close') + '</button></div>' +
    '<div class="sheet-body"><div class="hint">在本机独立模拟 <b>' + data.runs.toLocaleString() + '</b> 次，不会消耗正式抽取的随机序列。</div>' +
    '<div class="sim-table"><div class="sim-head"><span>选项</span><span>理论</span><span>模拟</span></div>' +
    data.rows.map(row => '<div class="sim-row"><span>' + esc(row.label) + '</span><b>' + (row.expected * 100).toFixed(1) + '%</b><em>' + (row.observed * 100).toFixed(1) + '%</em></div>').join('') +
    '</div></div>';

function refreshOptionProbabilities(){
  const opts = editFaceOptions(currentWheel());
  const total = opts.reduce((sum, option) => sum + Math.max(0, num(option.weight)), 0);
  opts.forEach(option => {
    const el = $('[data-prob="' + option.id + '"]');
    if (!el) return;
    const probability = total > 0 ? Math.max(0, num(option.weight)) / total * 100 : 0;
    el.textContent = probability.toFixed(probability < 1 ? 2 : 1) + '%';
  });
  const summary = $('#sheet .prob-summary b');
  if (summary) summary.textContent = total;
}

/* 成长写法的自查提示：选项里写了「XX+N」但 XX 对不上任何转盘时提醒一下 ——

function growHintBlock(w, list){
  const bad = (list || []).map(o => o.label).filter(l => growHintFor(l));

/* ============================== 导航：单一视图栈 + 返回键 ==============================
   · 所有面板都是「压栈」的一层，任何位置返回 = 退回上一层
   · 浏览器 / 安卓返回手势、Esc、左上返回键 三者走同一条 navBack()
   · 关掉整个面板时把之前压入的历史条目一次性回退，避免污染浏览历史
   ================================================================================= */
const NAV = { stack: [], swallowPop: 0, lastFocus: null, hideTimer: null };
const scrollMemo = {};
function isOverlayOpen(){ return $('#overlay').classList.contains('open'); }
function topNav(){ return NAV.stack.length ? NAV.stack[NAV.stack.length - 1] : null; }

function navHist(){ try { history.pushState({ nav: NAV.stack.length }, ''); } catch(e){} }
function showOverlay(){
  const ov = $('#overlay');
  NAV.lastFocus = document.activeElement;
  ov.classList.remove('closing');
  ov.classList.add('open');
}
function hideOverlay(){
  const ov = $('#overlay');
  if (!ov.classList.contains('open')) return;
  ov.classList.add('closing');
  clearTimeout(NAV.hideTimer);
  NAV.hideTimer = setTimeout(() => {
    ov.classList.remove('open', 'closing');
    const lf = NAV.lastFocus;
    if (lf && lf.focus && document.contains(lf)) { try { lf.focus(); } catch(e){} }
  }, 200);
}
/* 栈顶永远是「当前状态」；返回 = 弹出栈顶并应用新的栈顶 */
function navPush(entry, dir){
  NAV.stack.push(entry);
  ui.view = entry.view;
  if (entry.mtab) ui.mtab = entry.mtab;
  navHist();
  renderSheet(dir || 'push');
}
function navTo(view, opts){
  opts = opts || {};
  if (!NAV.stack.length) NAV.stack.push({ view:'none', mtab:ui.mtab });   // 根：主页
  const cur = topNav();
  if (cur && cur.view === view && !opts.force) {                          // 已在同一层：只切标签
    if (opts.mtab && opts.mtab !== ui.mtab) { navPush({ view:view, mtab:opts.mtab }, 'swap'); return; }
    if (opts.mtab) ui.mtab = opts.mtab;
    renderSheet('swap');
    return;
  }
  const first = !isOverlayOpen();
  navPush({ view:view, mtab: opts.mtab || ui.mtab }, opts.dir || 'push');
  if (first) {
    showOverlay();
    const sh = $('#sheet');
    if (sh && sh.focus) { try { sh.focus({ preventScroll:true }); } catch(e){} }
  }
}
function navBack(){
  if (navDepth() <= 0) {                      // 已在根：交给浏览器（真的退出页面）
    if (isOverlayOpen()) { NAV.stack.length = 0; ui.view = 'none'; hideOverlay(); return true; }
    return false;
  }
  NAV.stack.pop();
  const prev = topNav();
  ui.view = prev.view;
  if (prev.mtab) ui.mtab = prev.mtab;
  if (prev.view === 'none') hideOverlay();
  else renderSheet('pop');
  return true;
}
function navCloseAll(){
  const n = navDepth();
  const wasChart = ui.view === 'chart';
  NAV.stack.length = 0;
  ui.view = 'none';
  hideOverlay();
  if (n > 0) { NAV.swallowPop = 1; try { history.go(-n); } catch(e){} }
  if (wasChart) afterChartDismiss();          // 自动弹的维度图被关了 → 流程接着走
}
/* 界面上的「返回 / Esc」：本地退一层，同时把浏览器历史也退一格，
   否则会留下“按了没反应”的历史条目（下次真的按返回键会空跳） */
function navGoBack(){
  if (chartAutoTimer) { clearTimeout(chartAutoTimer); chartAutoTimer = null; }
  hideToast();                      // 自动弹图的提示条别跟着飘在下一站
  if (navDepth() <= 0) { if (isOverlayOpen()) navCloseAll(); return false; }
  const wasChart = ui.view === 'chart';
  NAV.swallowPop++;
  try { history.go(-1); } catch(e){ NAV.swallowPop--; }
  const r = navBack();
  if (wasChart) afterChartDismiss();          // 自动弹的维度图被关了 → 流程接着走
  return r;
}

function packWheelIds(mode){
  if (mode === 'all') return new Set(state.wheels.map(w => w.id));

    const wheel = wheelById(id);
    const refs = [wheel.next, wheel.faceBy];
    [wheel.options || []].concat((wheel.faces || []).map(facet => facet.options || [])).forEach(list => list.forEach(option => refs.push(option.next)));
    refs.forEach(ref => { if (ref !== END && ref !== STAY) visit(ref); });
  };

      ui.newChartName = ui.newChartName || ('属性维度图 ' + (state.charts.length + 1));
      navTo('newchart');
      break;
    case 'setAnchor': {
      const inp = $('#newChartName');
      if (inp && inp.value) ui.newChartName = inp.value;
      ui.newChartAnchor = el.dataset.val || '';
      renderSheet('swap');
      break;
    }
    case 'doCreateChart': {
      const inp = $('#newChartName');
      const nm = inp ? inp.value : ui.newChartName;
      const r = createChartSnapshot(nm, ui.newChartAnchor || '');
      if (!r.ok) { toast(r.msg); break; }
      ui.chartItem = r.item;
      dropLayerIf('newchart');
      navTo('chart');
      toast(r.prev ? '已生成，从「' + r.prev.name + '」变形过来' : '已生成第一张维度图');
      break;
    }
    case 'delChart': {
      const c = state.charts.filter(x => x.id === id)[0];
      if (!c) break;
      const okDel = await askDialog({ title:'删除维度图', desc:'确定删除「' + c.name + '」？删掉后它的快照就没了。', ok:'删除', danger:true });
      if (!okDel) return;
      pushUndo('删除维度图');
      state.charts = state.charts.filter(x => x.id !== id);
      if (ui.chartItem && ui.chartItem.id === id) ui.chartItem = null;
      save();
      if (ui.view === 'chart') navGoBack();
      else { ui.view = 'manager'; renderSheet('swap'); }
      undoToast('已删除维度图');
      break;
    }
    case 'use':
      state.currentId = id; state.flow.retStack = []; state.flow.paused = false;
      save(); refreshTitle(); requestDraw(); renderSheet();
      toast('已切换到「' + currentWheel().name + '」'); break;
    case 'rename': {
      const x = wheelById(id);
      if (!x) break;
      const name = await askDialog({ title:'重命名转盘', desc:'数据文件里的转盘名也会用这个名字', value:x.name, ok:'保存' });
      if (name === null) return;
      const v = String(name).trim();
      if (!v) { toast('名字不能为空'); break; }
      x.name = v;
      save(); refreshTitle(); renderSheet();
      toast('已改名为「' + v + '」');
      break;
    }
    case 'dup': {
      const src = state.wheels.filter(x => x.id === id)[0];
      if (!src) break;
      /* 复制要连"多面"的整套配置一起复制（面 + 分面依据），不然副本会变成普通转盘 */
      const copyOpt = o => ({ id:uid(), label:o.label, weight:o.weight, color:o.color, next:o.next || '' });
      const nw = { id:uid(), name:src.name + ' 副本', next:src.next || '',
                   branch:!!src.branch, grade:(src.grade === true ? true : (src.grade === false ? false : null)),
                   removeAfterPick:src.removeAfterPick,
                   multi:!!src.multi, faceBy:src.faceBy || '',
                   faces:(src.faces || []).map(f => ({
                     when: Object.assign({}, f.when || { type:'else' }),
                     options:(f.options || []).map(copyOpt)
                   })),
                   options:src.options.map(copyOpt) };
      state.wheels.splice(state.wheels.indexOf(src) + 1, 0, nw);
      save(); renderSheet(); toast('已复制转盘' + (src.multi ? '（含 ' + nw.faces.length + ' 个面）' : '')); break;
    }
    case 'del': {
      if (state.wheels.length <= 1) { toast('至少要保留一个转盘'); break; }
      const wheel = state.wheels.filter(x => x.id === id)[0];
      if (!wheel) break;
      const ok = await askDialog({ title:'删除转盘', desc:'确定删除「' + wheel.name + '」及其 ' + wheel.options.length + ' 个选项？', ok:'删除', danger:true });
      if (!ok) return;
      pushUndo('删除转盘');
      state.wheels = state.wheels.filter(x => x.id !== id);
      if (state.currentId === id) state.currentId = state.wheels[0].id;
      save(); refreshTitle(); requestDraw(); renderSheet(); undoToast('已删除「' + wheel.name + '」'); break;
    }
    case 'toggleBranch': {
      const x = wheelById(id);
      if (!x) break;
      x.branch = !x.branch;
      if (x.branch) { x.next = ''; }                 // 分支转盘不参与默认链
      save(); renderSheet(); renderFlowBar();
      toast(x.branch
        ? '「' + x.name + '」已标记为分支转盘：不进默认顺序，只能被选项分支指到'
        : '「' + x.name + '」已恢复为普通转盘');
      break;
    }
    case 'up': moveWheel(id, -1); break;
    case 'down': moveWheel(id, 1); break;
    case 'addOpt':
      editOpts(w, true).push(makeOption(''));
      save(); renderSheet(); requestDraw();
      (function(){ const rows = $$('#sheet .opt-row'); const last = rows[rows.length - 1];
        if (last) { const inp = last.querySelector('.opt-input'); if (inp) inp.focus(); } })();
      break;
    case 'delOpt': {
      const arr = editOpts(w, true);
      const i = arr.map(o => o.id).indexOf(id);
      if (i >= 0) { pushUndo('删除选项'); arr.splice(i, 1); }
      save(); renderSheet(); requestDraw(); undoToast('已删除选项'); break;
    }
    case 'autoColor':
      (editOpts(w, true).filter(o => o.id === id)[0] || {}).color = null;
      save(); renderSheet(); requestDraw(); break;
    case 'shuffle': shuffleArr(editOpts(w, true)); save(); renderSheet(); requestDraw(); break;
    case 'recolor': editOpts(w, true).forEach(o => { o.color = null; }); save(); renderSheet(); requestDraw(); toast('已按主题重新配色'); break;
    case 'clearOpts': {
      const ok = await askDialog({ title:'清空选项',
        desc:'将删除「' + w.name + '」' + (editOptsName(w) ? '的' + editOptsName(w) : '') + '的全部选项', ok:'清空', danger:true });
      if (!ok) return;
      pushUndo('清空选项');
      const arr = editOpts(w, true);
      arr.length = 0;                       // 原地清空，别换数组引用（多面转盘的面里存的也是它）
      save(); renderSheet(); requestDraw(); undoToast('已清空选项'); break;
    }
    case 'batch': navTo('batch'); break;
    case 'batchApply': {
      const mode = el.dataset.mode;
      const text = ($('#batchText') || {}).value || '';
      const list = parseBatch(text);
      if (!list.length) { toast('没有解析到内容'); break; }
      const opts = list.map(o => makeOption(o.label, o.weight));
      const arr = editOpts(w, true);
      if (mode !== 'append') pushUndo('批量覆盖选项');
      if (mode === 'append') { opts.forEach(o => arr.push(o)); }
      else { arr.length = 0; opts.forEach(o => arr.push(o)); }
      save(); requestDraw();
      if (ui.view === 'batch') navGoBack();          // 回到进来时那一页（并把栈同步好）
      else { ui.view = 'manager'; ui.mtab = 'content'; renderSheet('swap'); }
      if (mode === 'append') toast('已追加 ' + opts.length + ' 个选项' + (editOptsName(w) ? '（' + editOptsName(w) + '）' : ''));
      else undoToast('已覆盖为 ' + opts.length + ' 个选项' + (editOptsName(w) ? '（' + editOptsName(w) + '）' : ''));
      break;
    }
    case 'wheelFilter':
      ui.wheelFilter = el.dataset.val || 'all';
      renderSheet('swap');
      break;
    case 'simulate':
      ui.simResults = simulateWheel(currentWheel(), 10000);
      navTo('simulation');
      break;
    case 'setPalette': state.settings.palette = el.dataset.val; save(); renderSheet(); requestDraw(); break;
    case 'setTheme': state.settings.theme = el.dataset.val; applyTheme(); save(); renderSheet(); break;
    case 'setSeed': {
      const value = await askDialog({ title:'设置随机种子', desc:'同版本、同数据使用同一种子，会得到相同的抽取顺序。', value:randomSeed() || '我的世界线', ok:'启用' });
      if (value === null) return;
      state.settings.randomSeed = String(value).trim();
      setRandomSeed(state.settings.randomSeed); save(); renderSheet('swap');
      toast(state.settings.randomSeed ? '可复现随机已启用' : '已恢复真随机');
      break;
    }
    case 'clearSeed':
      state.settings.randomSeed = ''; setRandomSeed(''); save(); renderSheet('swap'); toast('已恢复真随机'); break;
    case 'copyReplay': {
      const code = replayCode({ app:STATE_VER });
      if (!code) { toast('请先设置随机种子'); break; }
      copyText(code); break;
    }
    case 'loadReplay': {
      const code = await askDialog({ title:'载入复盘码', desc:'会设置其中的随机种子并从头开始本轮。转盘数据必须与分享者一致。', value:'', ok:'载入' });
      if (code === null) return;
      const parsed = parseReplayCode(code);
      if (!parsed) { toast('复盘码格式不正确'); break; }
      state.settings.randomSeed = parsed.seed;
      setRandomSeed(parsed.seed); resetFlow(); save(); renderSheet('swap');
      toast(parsed.app && parsed.app !== STATE_VER ? '已载入；来源版本不同，结果可能有差异' : '复盘码已载入，可从起点重放');
      break;
    }
    case 'addProfile': await addProfile(); break;
    case 'renameProfile': await renameProfile(); break;
    case 'deleteProfile': await deleteProfile(); break;
    case 'exportData': exportData(); break;
    case 'exportCurrentPack': exportWheelPack('current'); break;
    case 'exportAllPack': exportWheelPack('all'); break;
    case 'saveFolder': saveToFolder(); break;
    case 'reloadFiles': reloadFromFiles(); break;
    case 'importData': ui.importMode = 'backup'; $('#fileImport').click(); break;
    case 'importPack': ui.importMode = 'pack'; $('#fileImport').click(); break;
    case 'restoreImport':
      if (await restoreImportState()) toast('已恢复导入前的数据');
      else if (!storageStatus.ok) toast('恢复失败：浏览器存储不可用');
      break;
    case 'undoLast': undoLast(); break;
    case 'copyData': copyText(JSON.stringify(state)); break;
    case 'resetAll': {
      const ok = await askDialog({ title:'恢复默认', desc:'将清除全部转盘、选项与历史记录，恢复为初始内容', ok:'恢复', danger:true });
      if (!ok) return;
      pushUndo('恢复默认');
      loadState(seed()); save(); applyTheme(); refreshTitle(); requestDraw(); renderSheet(); undoToast('已恢复默认内容'); break;
    }

    /* ---- 分支流程 ---- */
    case 'pickNext': {
      const o = optById(w.id, id);
      if (!o) break;
      ui.targetCtx = { kind:'opt', wheel:w.id, opt:o.id, cur:o.next || '' };
      navTo('target'); break;
    }
    case 'setTarget': {
      const ctx = ui.targetCtx || {}, val = el.dataset.val || '';
      if (ctx.kind === 'root') state.flow.rootId = val;
      else if (ctx.kind === 'def') { const x = wheelById(ctx.wheel); if (x) x.next = val; }
      else if (ctx.kind === 'opt') { const o = optById(ctx.wheel, ctx.opt); if (o) o.next = val; }
      if (val) state.flow.enabled = true;
      save();
      navBack(); renderFlowBar();
      toast(val ? '已设置为「' + slotText(val) + '」' : '已清除设置');
      break;
    }
    case 'setSpinFx': {
      state.settings.spinFx = el.dataset.val || 'bounce';
      save(); renderSheet('swap');
      const fx = SPIN_FX.filter(x => x[0] === spinFxKey())[0];
      toast('旋转效果：' + fx[1]);
      break;
    }
    case 'setWheelColor': {
      state.settings.wheelColor = el.dataset.val || 'jin';
      save(); renderSheet('swap');
      toast('法轮颜色：' + (CHART_INKS.filter(x => x[0] === wheelInkKey())[0][1]));
      break;
    }
    case 'setChartColor': {
      state.settings.chartColor = el.dataset.val || 'zhu';
      save(); renderSheet('swap');
      toast('维度图颜色：' + (CHART_INKS.filter(x => x[0] === chartInkKey())[0][1]));
      break;
    }
    case 'expandFlow': expandFlowBar(); break;
    case 'gradeAuto': {
      const x = wheelById(id);
      if (!x) break;
      x.grade = null; save(); renderSheet('swap');
      toast('「' + x.name + '」已恢复自动判断（' + (isGradeWheel(x) ? '会计入' : '不会计入') + '属性图）');
      break;
    }
    case 'copyResult': copyText(ui.resultLabel || resultEl.textContent); break;
    case 'copyRound':
      copyText(roundResultText());
      break;
    case 'exportResultCard': exportResultCard(); break;
    case 'restartRound': closeSheet(); resetFlow(); break;
    case 'spinAgain': closeSheet(); setTimeout(() => spin(), 240); break;
    case 'removeWinner': {
      const ww = currentWheel();
      const oo = findOptionById(ww, ui.resultOptId);
      if (!oo) { toast('这个选项已经不在了'); break; }
      if (wheelOptions(ww).filter(x => num(x.weight) > 0).length <= 1) { toast('至少要保留一个选项'); break; }
      pushUndo('移除抽中选项');
      /* 从它实际所在的那一组里删（可能是某个面，也可能就是兜底面） */
      const arr = editOpts(ww, true);
      const at = arr.map(x => x.id).indexOf(oo.id);
      if (at >= 0) arr.splice(at, 1);
      else ww.options = ww.options.filter(x => x.id !== oo.id);
      ui.resultOptId = '';
      save(); requestDraw(); closeSheet();
      undoToast('已把「' + oo.label + '」移出转盘');
      break;
    }
    case 'editWheel': {
      const wid = id || (el && el.dataset ? el.dataset.id : '');
      const x = wheelById(wid);
      if (!x) break;
      state.currentId = x.id; save(); refreshTitle(); requestDraw();
      // 选项内容永远是「转盘列表」的下一层：不在列表上就先垫一层，保证返回必定回到列表
      const atList = isOverlayOpen() && ui.view === 'manager' && ui.mtab === 'wheels';
      if (!atList) navTo('manager', { mtab:'wheels', force:true });
      navTo('manager', { mtab:'content', force:true });
      break;
    }
    case 'clearLinks': {
      const ok = await askDialog({ title:'清除所有连接', desc:'将删除全部「默认下一站」与选项上的跳转设置', ok:'清除', danger:true });
      if (!ok) return;
      /* ⚠️ 面里的选项也有跳转设置，一起清（别只清兜底面） */
      const clearWheel = x => {
        x.next = '';
        x.options.forEach(o => { o.next = ''; });
        (x.faces || []).forEach(f => (f.options || []).forEach(o => { o.next = ''; }));
      };
      state.wheels.forEach(clearWheel);
      state.flow.rootId = ''; state.flow.path = []; state.flow.pendingId = '';
      save(); renderSheet(); renderFlowBar(); toast('已清除所有连接'); break;
    }
    case 'gotoStep': {
      const f = state.flow, i = num(el.dataset.idx), p = f.path[i];
      if (!p) break;
      clearJump();
      f.path = f.path.slice(0, i); f.pendingId = ''; f.finished = false;
      ui.flowCollapsed = false;
      save();
      if (p.wheelId && wheelById(p.wheelId)) switchTo(p.wheelId, { silent:true });
      else renderFlowBar();
      break;
    }
    case 'resetFlow': ui.flowCollapsed = false; resetFlow(); break;
    case 'goPending': {
      const pid = state.flow.pendingId;
      state.flow.pendingId = '';
      state.flow.paused = false;                    // 手动点「下一站」= 明确要继续
      if (pid && wheelById(pid)) switchTo(pid, { silent:false, spin:false });
      else renderFlowBar();
      break;
    }
    case 'resumeFlow': {
      state.flow.paused = false;
      save(); renderFlowBar();
      toast('已恢复自动跳转');
      break;
    }
    case 'backFlow': navGoBack(); break;

    /* ---- 多面转盘 ----
       和「分支」是两件事：分支改"跳到哪"，多面改"这个盘显示什么"。 */
    case 'toggleMulti': {
      const x = wheelById(id);
      if (!x) break;
      if (isMultiWheel(x)) {
        const okOff = await askDialog({ title:'恢复成普通转盘',
          desc:'「' + x.name + '」的 ' + faceCount(x) + ' 个面会被删掉，只留下兜底面（也就是现在的选项内容）。确定吗？',
          ok:'恢复', danger:true });
        if (!okOff) return;
        x.multi = false; x.faces = []; x.faceBy = '';
        save(); renderSheet(); renderFlowBar(); requestDraw();
        toast('「' + x.name + '」已恢复为普通转盘');
        break;
      }
      /* 打开多面：先猜一个分面依据（前一个属性盘最像），猜错了再自己改 */
      const i = state.wheels.indexOf(x);
      let guess = null;
      for (let k = i - 1; k >= 0; k--) if (isGradeWheel(state.wheels[k])) { guess = state.wheels[k]; break; }
      if (!guess) guess = state.wheels.filter(y => y.id !== x.id && isGradeWheel(y))[0] || null;
      x.multi = true;
      x.faceBy = guess ? guess.id : '';
      if (!Array.isArray(x.faces) || !x.faces.length) {
        /* 默认给两个面，条件留空等用户填（填好之前不会命中，用兜底面） */
        const mid = GRADE_LADDER[Math.floor(GRADE_LADDER.length / 2)];
        x.faces = [
          { when:{ type:'gradeAtLeast', value:mid }, options:[] },
          { when:{ type:'else' }, options:[] }
        ];
      }
      save(); renderSheet(); renderFlowBar(); requestDraw();
      ui.faceWheelId = x.id;
      navTo('faces');
      toast(guess ? ('已设为多面转盘，按「' + guess.name + '」分面（不对可以改）') : '已设为多面转盘，先选一个「按哪个转盘分面」');
      break;
    }
    case 'openFaces': {
      ui.faceWheelId = id || currentWheel().id;
      navTo('faces');
      break;
    }
    case 'setFaceBy': {
      const x = wheelById(id);
      if (!x) break;
      x.faceBy = el.dataset.val || '';
      save(); renderSheet('swap'); requestDraw();
      const src = faceSource(x);
      toast(src ? ('现在按「' + src.name + '」分面') : '已清除分面依据（只会用兜底面）');
      break;
    }
    case 'addFace': {
      const x = wheelById(id);
      if (!x) break;
      x.faces = Array.isArray(x.faces) ? x.faces : [];
      x.faces.push({ when:{ type:'gradeAtLeast', value:'A' }, options:[] });
      ui.faceWheelId = x.id;
      save(); renderSheet(); requestDraw();
      ui.faceWhenIdx = x.faces.length - 1;
      navTo('facewhen');
      toast('加了一个面，先设它的条件');
      break;
    }
    case 'delFace': {
      const x = wheelById(id), i = num(el.dataset.idx);
      if (!x || !x.faces || !x.faces[i]) break;
      const okDel = await askDialog({ title:'删除这个面',
        desc:'第 ' + (i + 1) + ' 面（' + faceWhenText(x.faces[i]) + '）的选项会一起删掉。确定吗？', ok:'删除', danger:true });
      if (!okDel) return;
      x.faces.splice(i, 1);
      save(); renderSheet(); requestDraw();
      toast('已删除');
      break;
    }
    case 'faceUp': case 'faceDown': {
      const x = wheelById(id), i = num(el.dataset.idx);
      if (!x || !x.faces) break;
      const j = i + (act === 'faceUp' ? -1 : 1);
      if (j < 0 || j >= x.faces.length) break;
      const t = x.faces[i]; x.faces[i] = x.faces[j]; x.faces[j] = t;
      save(); renderSheet('swap'); requestDraw();
      break;
    }
    case 'editFace': {
      const x = wheelById(id);
      if (!x) break;
      const i = num(el.dataset.idx);
      ui.faceWheelId = x.id;
      ui.faceEdit = i < 0 ? -1 : i;
      if (state.currentId !== x.id) { state.currentId = x.id; save(); refreshTitle(); requestDraw(); }
      if (ui.view !== 'faces') { navTo('faces'); }
      navTo('manager', { mtab:'content', force:true });
      break;
    }
    case 'pickEditFace': {
      ui.faceEdit = el.dataset.val === 'auto' ? 'auto' : num(el.dataset.val);
      renderSheet('swap');
      requestDraw();
      break;
    }
    case 'pickFaceWhen': {
      ui.faceWheelId = id;
      ui.faceWhenIdx = num(el.dataset.idx);
      navTo('facewhen');
      break;
    }
    case 'setFaceWhenType': {
      const x = wheelById(ui.faceWheelId), i = num(ui.faceWhenIdx);
      const f = x && x.faces ? x.faces[i] : null;
      if (!f) break;
      const t = el.dataset.val || 'else';
      f.when = { type:t };
      if (t !== 'else' && t !== 'labelIs' && t !== 'labelHas') f.when.value = 'A';
      save(); renderSheet('swap'); requestDraw();
      break;
    }
    case 'setFaceWhenValue': {
      const x = wheelById(ui.faceWheelId), i = num(ui.faceWhenIdx);
      const f = x && x.faces ? x.faces[i] : null;
      if (!f) break;
      f.when = Object.assign({}, f.when, { value: el.dataset.val || '' });
      save(); renderSheet('swap'); requestDraw();
      break;
    }

    /* ---- 记录页 ---- */
    case 'clearHistory': {
      const ok = await askDialog({ title:'清空记录', desc:'确定清空全部抽奖历史？', ok:'清空', danger:true });
      if (!ok) return;
      pushUndo('清空记录');
      state.history = []; save(); renderSheet(); undoToast('已清空记录'); break;
    }
    case 'copyHistory':
      copyText(state.history.map(h => h.label + '（' + (h.wheel || '') + '）').join('\n')); break;
  }
}


/* ---- 转盘列表：按住 / 长按拖动排序 ---- */
let rowHold = null, rowDrag = null, suppressClickUntil = 0;
function clearRowHold(){ if (rowHold) { clearTimeout(rowHold.timer); rowHold = null; } }
function beginRowDrag(){
  if (!rowHold) return;
  const el = rowHold.el, list = el.closest('.list');
  const rect = el.getBoundingClientRect();
  rowDrag = { el:el, list:list, id:el.dataset.id, startY:rowHold.y, target:null, line:null };
  rowHold = null;
  el.classList.add('dragging');
  document.body.classList.add('row-dragging');
  if (list) {
    const line = document.createElement('div');
    line.className = 'drop-line';
    list.appendChild(line);
    rowDrag.line = line;
  }
  vibrate(12);
  beep(560, 0.05, 'sine', 0.028);
  updateDropLine(rect.top + rect.height / 2);
}
function updateDropLine(y){
  const d = rowDrag;
  if (!d || !d.line || !d.list) return;
  const rows = $$('.wheel-row', d.list).filter(r => r !== d.el);
  let idx = rows.length;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].getBoundingClientRect();
    if (y < r.top + r.height / 2) { idx = i; break; }
  }
  d.target = idx;
  const ref = rows[idx];
  const top = ref ? ref.offsetTop : d.list.scrollHeight;
  d.line.style.top = Math.max(0, top - 1) + 'px';
}
function autoScrollBy(y){
  const body = $('#sheet .sheet-body');
  if (!body) return;
  const r = body.getBoundingClientRect();
  if (y < r.top + 44) body.scrollTop = Math.max(0, body.scrollTop - 12);
  else if (y > r.bottom - 44) body.scrollTop = body.scrollTop + 12;
}
function onRowPointerMove(e){
  if (rowHold) {
    const moved = Math.abs(e.clientY - rowHold.y) + Math.abs(e.clientX - rowHold.x);
    if (rowHold.type === 'mouse') { if (moved > 5) beginRowDrag(); }
    else if (moved > 10) clearRowHold();          // 触屏上移动＝滚动列表，不算长按
  }
  if (!rowDrag) return;
  rowDrag.el.style.transform = 'translateY(' + (e.clientY - rowDrag.startY) + 'px)';
  autoScrollBy(e.clientY);
  updateDropLine(e.clientY);
  if (e.cancelable) e.preventDefault();
}
function endRowDrag(drop){
  clearRowHold();
  const d = rowDrag;
  if (!d) return;
  rowDrag = null;
  suppressClickUntil = Date.now() + 400;          // 拖完别把这次松手当成点击
  d.el.classList.remove('dragging');
  d.el.style.transform = '';
  document.body.classList.remove('row-dragging');
  if (d.line && d.line.parentNode) d.line.parentNode.removeChild(d.line);
  if (!drop) return;
  const from = state.wheels.findIndex(w => w.id === d.id);
  if (from < 0) return;
  const arr = state.wheels.slice();
  const moved = arr.splice(from, 1)[0];
  const to = Math.max(0, Math.min(arr.length, d.target == null ? from : d.target));
  if (to === from) return;
  arr.splice(to, 0, moved);
  state.wheels = arr;
  save(); renderSheet('swap');
  toast('「' + moved.name + '」已移到第 ' + (to + 1) + ' 位');
}

  document.addEventListener('contextmenu', e => { if (rowDrag) e.preventDefault(); });

  // 顶部流程条
  $('#flowBar').addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (btn) handleAction(btn.dataset.act, null, btn);

  const ro = new ResizeObserver(() => { fitWheel(); requestDraw(); });
  ro.observe($('.stage'));

/* ============================== 单文件转盘数据（「转盘」文件夹） ==============================
   每个转盘一个数据文件，双击打开网页时自动读取。
   为什么数据文件是 .js 而不是 .json：file:// 页面被禁止 fetch 本地 json（CORS），
   而 <script src> 加载本地 js 是允许的，所以数据文件里是「纯 JSON + 一行注册调用」。
   读不到文件夹就退回页面内置数据，程序照样能用。
   ==================================================================================== */
const WHEEL_DIR = '转盘';
const FILE_INDEX = '_index.js';
let fileWheelCount = 0;
let dirHandle = null;        // 已授权写入的「转盘」文件夹
let dirUsable = false;       // 本次会话能不能直接写文件
let booting = true;          // 启动阶段不触发自动写回
function registerWheelFile(def){ (window.__ZW_WHEELS = window.__ZW_WHEELS || []).push(def); }
function loadWheelFiles(done, bust){
  window.__ZW_REGISTER = registerWheelFile;
  window.__ZW_WHEELS = [];
  const q = bust ? ('?t=' + Date.now()) : '';
  let finished = false;
  const finish = () => { if (!finished) { finished = true; done((window.__ZW_WHEELS || []).slice()); } };
  const idx = document.createElement('script');
  idx.src = WHEEL_DIR + '/' + FILE_INDEX + q;
  idx.onerror = () => { finished = true; done([]); };          // 没有文件夹 → 用内置数据
  idx.onload = () => {
    const list = window.__ZW_INDEX || [];
    if (!list.length) { finish(); return; }
    let left = list.length;
    const tick = () => { if (--left <= 0) finish(); };
    list.forEach(f => {
      const s = document.createElement('script');
      s.src = WHEEL_DIR + '/' + f + q;
      s.onload = tick; s.onerror = tick;                       // 单个文件坏了也不卡住
      document.head.appendChild(s);
    });
    setTimeout(finish, 5000);                                  // 兜底
  };
  document.head.appendChild(idx);
}
/* ---- 多面转盘的存档读写 ----
   存进数据文件时 faceBy 写「转盘名」（和 next 一样，方便手改）；
   内存里存 id。faces[].when 里的名字类条件直接存原文。 */
function faceToFile(f){
  const out = { when: f.when || { type:'else' }, options: f.options.map(o => {
    const z = { label:o.label, weight:num(o.weight) };
    if (o.color) z.color = o.color;
    if (o.next) z.next = slotText(o.next);
    return z;
  }) };
  return out;
}
function applyWheelFiles(defs){
  if (!defs || !defs.length) return false;
  const wheels = defs.filter(d => d && d.name).map(d => {
    const w = { id:uid(), name:String(d.name), category:WHEEL_CATEGORIES.indexOf(d.category) >= 0 ? d.category : inferWheelCategory(d.name), next:'', branch:!!d.branch,
                grade:(d.grade === true ? true : (d.grade === false ? false : null)),
                removeAfterPick:!!d.removeAfterPick, options:[] };
    w._order = (typeof d.order === 'number' && isFinite(d.order)) ? d.order : null;
    w._nextName = typeof d.next === 'string' ? d.next : '';
    w.options = (Array.isArray(d.options) ? d.options : []).map(o => {
      if (typeof o === 'string' || typeof o === 'number') return makeOption(o);
      const op = makeOption(o.label, o.weight == null ? 1 : o.weight, o.color || null);
      op._nextName = typeof o.next === 'string' ? o.next : '';
      return op;
    });
    /* 多面转盘：先原样收着，等下面的 byName 建好再解析 faceBy / 选项跳转 */
    w.multi = d.multi === true || (Array.isArray(d.faces) && d.faces.length > 0);
    w._faceByName = typeof d.faceBy === 'string' ? d.faceBy : '';
    w._facesRaw = Array.isArray(d.faces) ? d.faces : [];
    return w;
  });
  if (!wheels.length) return false;
  const byName = {};
  wheels.forEach(w => { byName[w.name] = w; });
  const resolve = v => {
    if (!v) return '';
    if (v === '结束' || v === 'END' || v === '__end__') return END;
    if (v === '留在本盘' || v === '__stay__') return STAY;
    return byName[v] ? byName[v].id : '';
  };
  wheels.forEach(w => {
    w.next = resolve(w._nextName); delete w._nextName;
    w.options.forEach(o => { o.next = resolve(o._nextName); delete o._nextName; });
    /* 面：选项的 next 也要解析，faceBy 用名字换成 id */
    w.faces = (w._facesRaw || []).map(f => ({
      when: (f && f.when && typeof f.when === 'object') ? f.when : { type:'else' },
      options: ((f && Array.isArray(f.options)) ? f.options : []).map(o => {
        if (typeof o === 'string' || typeof o === 'number') return makeOption(o);
        const op = makeOption(o.label, o.weight == null ? 1 : o.weight, o.color || null);
        op.next = resolve(typeof o.next === 'string' ? o.next : '');
        return op;
      })
    }));
    delete w._facesRaw;
    const src = w._faceByName ? byName[w._faceByName] : null;
    w.faceBy = src ? src.id : String(w._faceByName || '');
    delete w._faceByName;
    if (!w.multi) { w.multi = false; w.faces = []; w.faceBy = ''; }
  });
  // 文件里写了 "order" 就按它排序（方便手改顺序），没写就按文件顺序
  if (wheels.some(w => w._order != null)) {
    wheels.forEach((w, i) => { if (w._order == null) w._order = i + 1; });
    wheels.sort((a, b) => a._order - b._order);
  }
  wheels.forEach(w => { delete w._order; });
  state.wheels = wheels;                                   // 文件为准
  if (!state.wheels.some(x => x.id === state.currentId)) state.currentId = state.wheels[0].id;
  if (!state.flow.rootId || !state.wheels.some(x => x.id === state.flow.rootId)) state.flow.rootId = state.wheels[0].id;
  state.flow.path = []; state.flow.pendingId = '';
  fileWheelCount = wheels.length;
  return true;
}
/* 当前数据 → 文件文本（格式与数据文件夹里完全一致，可以来回改）
   idx = 这个转盘在列表里的位置（0 起），会写成显式的 "order" 字段 */
/* 一个选项写成文件里的那一行 */
function optionFileLine(o, last){
  const no = wheelById(o.next);
  let line = '    { "label": ' + JSON.stringify(o.label);
  if (num(o.weight) !== 1) line += ', "weight": ' + num(o.weight);
  if (o.color) line += ', "color": ' + JSON.stringify(o.color);
  if (o.next === END) line += ', "next": "结束"';
  else if (o.next === STAY) line += ', "next": "留在本盘"';
  else if (no) line += ', "next": ' + JSON.stringify(no.name);
  line += ' }' + (last ? '' : ',');
  return line;
}
function wheelFileText(w, idx){
  const order = (typeof idx === 'number' && idx >= 0) ? (idx + 1) : (state.wheels.indexOf(w) + 1);
  const L = [];
  L.push('/* 咒术转盘 · 单转盘数据文件');
  L.push('   转盘名：' + w.name);
  L.push('   顺序：第 ' + order + ' 位（order 字段；顺序也可以在网页的「转盘」页拖动调整）');
  L.push('   改完保存、刷新网页即可生效（浏览器直接读这个文件）');
  L.push('   next 写「转盘名字」表示下一步去哪个转盘；写 "结束" 表示流程到此为止；不写就留在本盘');
  L.push('   branch: true 表示这是「分支转盘」：不在默认顺序里，只能被别的转盘的选项分支指到；');
  L.push('           它抽完若没给该选项设 next，会自动接着「拐进来的那个转盘」的默认下一站继续。');
  if (w.multi) {
    const src = faceSource(w);
    L.push('   multi/faceBy/faces 表示这是「多面转盘」：**照常参与默认顺序**，位置随便放，');
    L.push('           但展示什么内容取决于 faceBy 那个转盘抽到了什么（可以写多个面，按顺序取第一个命中的）。');
    L.push('           faces 里没命中的时候用最下面那个 options（兜底面）。');
    L.push('           当前分面依据：' + (src ? src.name : '（没设置）'));
  }
  L.push('   weight 是权重（决定扇区大小与概率），留空默认 1；color 可写 "#B23A2F" 固定扇区颜色 */');
  L.push('window.__ZW_REGISTER({');
  L.push('  "order": ' + order + ',');
  L.push('  "name": ' + JSON.stringify(w.name) + ',');
  L.push('  "category": ' + JSON.stringify(w.category || inferWheelCategory(w.name)) + ',');
  const nw = wheelById(w.next);
  L.push('  "next": ' + (w.next === END ? '"结束"' : (nw ? JSON.stringify(nw.name) : '""')) + ',');
  if (w.branch) L.push('  "branch": true,');
  if (w.grade === true) L.push('  "grade": true,');
  if (w.grade === false) L.push('  "grade": false,');
  if (w.multi) {
    L.push('  "multi": true,');
    L.push('  "faceBy": ' + JSON.stringify((faceSource(w) || {}).name || '') + ',');
    L.push('  "faces": [');
    (w.faces || []).forEach((f, i) => {
      L.push('    { "when": ' + JSON.stringify(f.when || { type:'else' }) + ', "options": [');
      (f.options || []).forEach((o, j) => L.push(optionFileLine(o, j === f.options.length - 1)));
      L.push('    ] }' + (i < w.faces.length - 1 ? ',' : ''));
    });
    L.push('  ],');
    L.push('  // ↑ 面都按条件从上往下试，第一个命中的生效；下面 options 是兜底面');
  }
  L.push('  "removeAfterPick": ' + (!!w.removeAfterPick) + ',');
  L.push('  "options": [');
  w.options.forEach((o, j) => L.push(optionFileLine(o, j === w.options.length - 1)));
  L.push('  ]');
  L.push('});');
  L.push('');
  return L.join('\n');
}
function wheelFileName(w, i){
  return String(i + 1).padStart(2, '0') + '-' + String(w.name).replace(/[\\/:*?"<>|]/g, '_') + '.js';
}
function indexFileText(wheels){
  const head = ['/* 转盘清单 —— 这里的顺序就是网页里「转盘」页的顺序，也是「按列表顺序串联」的顺序。',
                '   顺序变化时这个文件会跟着重写（文件名前的 01/02… 也是顺序，每个文件里还有 "order" 字段）。',
                '   新增转盘：照抄一份上面的文件、改名，再把文件名加到下面这个列表里。',
                '   当前顺序：'];
  wheels.forEach((w, i) => {
    head.push('     ' + (i + 1) + '. ' + w.name +
      (w.branch ? '  [分支转盘·不进默认顺序]' : '') +
      (isMultiWheel(w) ? '  [多面转盘·按「' + ((faceSource(w) || {}).name || '？') + '」分面]' : '') +
      '  →  ' + wheelFileName(w, i));
  });
  head.push('*/');
  return head.concat(['window.__ZW_INDEX = ['])
    .concat(wheels.map((w, i) => '  ' + JSON.stringify(wheelFileName(w, i)) + (i < wheels.length - 1 ? ',' : '')))
    .concat(['];', '']).join('\n');
}
function downloadText(name, text){
  const blob = new Blob([text], { type:'text/javascript' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
/* 记住「转盘」文件夹的授权，下次打开尽量免选（Chrome/Edge） */
function idbOpen(){
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('zswheel-db', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch(e) { rej(e); }
  });
}
async function idbSet(k, v){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(v, k);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(k){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readonly');
    const q = tx.objectStore('kv').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
/* 拿到可写目录：interactive=true 时允许弹一次目录选择/授权 */
async function getDir(interactive){
  if (!window.showDirectoryPicker) return null;
  try {
    if (!dirHandle) { try { dirHandle = (await idbGet('dir')) || null; } catch(e){ dirHandle = null; } }
    if (dirHandle) {
      let p = 'denied';
      try { p = await dirHandle.queryPermission({ mode:'readwrite' }); } catch(e) { p = 'denied'; }
      if (p === 'granted') return dirHandle;
      if (!interactive) return null;
      const r = await dirHandle.requestPermission({ mode:'readwrite' });
      if (r === 'granted') return dirHandle;
      dirHandle = null;
    }
    if (!interactive) return null;
    dirHandle = await window.showDirectoryPicker({ mode:'readwrite', id:'zswheel-dir' });
    try { await idbSet('dir', dirHandle); } catch(e){}
    return dirHandle;
  } catch(e) { return null; }
}
/* 把当前转盘写回「转盘」文件夹（顺带清掉已删除转盘留下的旧文件） */
async function syncToFolder(opts){
  opts = opts || {};
  const wheels = state.wheels;
  if (!wheels.length) return false;
  const dir = await getDir(!!opts.interactive);
  if (!dir) { if (opts.interactive) toast('没有拿到文件夹写入权限'); return false; }
  try {
    const keep = {};
    for (let i = 0; i < wheels.length; i++) {
      const name = wheelFileName(wheels[i], i);
      keep[name] = 1;
      const fh = await dir.getFileHandle(name, { create:true });
      const ws = await fh.createWritable();
      await ws.write(wheelFileText(wheels[i], i));
      await ws.close();
    }
    const fh2 = await dir.getFileHandle(FILE_INDEX, { create:true });
    const ws2 = await fh2.createWritable();
    await ws2.write(indexFileText(wheels));
    await ws2.close();
    // 清掉已经不存在的转盘文件（只动 01-xx.js 这种命名的）
    try {
      for await (const h of dir.values()) {
        if (h.kind === 'file' && /^\d{2}-.*\.js$/.test(h.name) && !keep[h.name]) await dir.removeEntry(h.name);
      }
    } catch(e){}
    dirUsable = true;
    ui.fileError = '';
    ui.lastSync = Date.now();
    if (opts.toast) toast('已写回 ' + wheels.length + ' 个文件到「' + WHEEL_DIR + '」');
    return true;
  } catch(e) {
    dirUsable = false;
    ui.fileError = (e && e.message) || String(e || '未知错误');
    if (opts.toast) toast('写回失败：' + ((e && e.message) || e));
    return false;
  }
}
let syncTimer = null, hintedNoDir = false;
function scheduleSync(){
  if (booting || state.settings.autoSave === false) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    syncTimer = null;
    syncToFolder({}).then(ok => {
      if (ok) {
        if (isOverlayOpen() && ui.view === 'manager' && ui.mtab === 'settings') renderSheet('swap');
      } else if (!hintedNoDir && fileWheelCount && !booting) {
        hintedNoDir = true;
        toast('改动已存进浏览器；要同步到「' + WHEEL_DIR + '」数据文件，需要授权一次目录', { action:'授权并写回', fn:() => saveToFolder() });
      }
    });
  }, 900);
}
/* 手动「重新读取文件」：会用文件内容覆盖网页上的转盘 */
async function reloadFromFiles(){
  const ok = await askDialog({ title:'重新读取数据文件', ok:'读取',
    desc:'会用「' + WHEEL_DIR + '」文件夹里的内容覆盖网页上的转盘。网页上还没写回文件的改动会丢失，确定吗？' });
  if (!ok) return;
  loadWheelFiles(defs => {
    if (!defs.length) { toast('没读到数据文件'); return; }
    pushUndo('从文件重新读取');
    applyWheelFiles(defs); save();
    refreshTitle(); requestDraw(); renderSheet();
    undoToast('已从文件读取 ' + defs.length + ' 个转盘');
  }, true);
}
function fileStatusShort(){
  if (!fileWheelCount) return '数据文件：没读到「' + WHEEL_DIR + '」文件夹（当前用网页内置数据）';
  if (ui.fileError) return '数据文件：<b>写回失败</b> —— ' + esc(ui.fileError);
  if (dirUsable) return '数据文件：已同步' + (ui.lastSync ? '（' + fmtTime(ui.lastSync) + ' 写回，含顺序）' : '（含顺序）');
  return '数据文件：<b>未授权写入</b> —— 顺序等改动目前只存在浏览器里';
}
function fileStatusText(){
  const a = fileWheelCount
    ? '已读到「' + WHEEL_DIR + '」里的 <b>' + fileWheelCount + '</b> 个数据文件'
    : '没读到「' + WHEEL_DIR + '」文件夹（当前用网页内置数据）';
  const b = ui.fileError
    ? '，<b>文件写回失败</b>：' + esc(ui.fileError) + '；浏览器内的数据仍然保留'
    : dirUsable
    ? '，文件夹<b>已授权写入</b>' + (ui.lastSync ? '（上次写回 ' + fmtTime(ui.lastSync) + '）' : '')
    : '，文件夹<b>尚未授权</b>：改动先存在浏览器里（刷新不丢），点下面「保存回文件夹」选一次目录即可自动同步';
  return a + b + '。';
}
async function saveToFolder(){
  const wheels = state.wheels;
  if (!wheels.length) { toast('还没有转盘'); return; }
  if (await syncToFolder({ interactive:true, toast:true })) { renderSheet('swap'); return; }
  if (!window.showDirectoryPicker) {
    // 老浏览器：退回逐个下载
    wheels.forEach((w, i) => setTimeout(() => downloadText(wheelFileName(w, i), wheelFileText(w, i)), i * 350));
    setTimeout(() => downloadText(FILE_INDEX, indexFileText(wheels)), wheels.length * 350 + 200);
    toast('正在下载 ' + (wheels.length + 1) + ' 个文件（浏览器可能询问是否允许多个下载）');
  }
}

/* ============================== 调试出口 ==============================
   平时什么都不做（`ZW.__app` 保持 undefined），所以对用户零影响。
   想在浏览器里做验证时，在地址栏 / 控制台先设一个开关再刷新：

     localStorage.setItem('zhoushu-wheel.debug', '1')   // 然后刷新

   之后控制台就能直接用内部函数了（不用改代码、不用暴露给普通用户）：
     __app.state         当前存档
     __app.ui            界面状态（含 chartDims / chartItem）
     __app.openChart()   打开第一张维度图（等价于点「记录」页里那张）
     __app.spin()        抽一次
     __app.flowJump(...) 手动推进流程
   ==================================================================== */
function exposeDebug(){
  try { if (localStorage.getItem('zhoushu-wheel.debug') !== '1') return; } catch(e){ return; }
  ZW.__app = {
    version: ZW.version,
    get state(){ return state; },
    get ui(){ return ui; },
    get nav(){ return NAV; },
    openChart: id => {
      const c = id ? (state.charts.filter(x => x.id === id)[0] || null) : state.charts[0];
      if (!c) { toast('还没有维度图'); return null; }
      clearTimeout(chartAutoTimer); chartAutoTimer = null;   // 手动打开：别被自动收起打断
      chartFlowDone = null;
      ui.chartItem = c;
      navTo('chart');
      return c;
    },
    closeChart: () => navGoBack(),
    spin: () => spin(),
    flowJump: (wid, label) => {
      const w = wheelById(wid) || currentWheel();
      flowJump(w, { label: label || '（调试）' }, label || '（调试）');
      return w;
    },
    draw: () => draw(),
    navTo: view => navTo(view),
    navBack: () => navBack(),
    navCloseAll: () => navCloseAll(),
    importDataText: (text, confirm) => importDataText(text, confirm),
    flowDiagnostics: () => flowDiagnostics(),
    canvasCalls: () => {
      const cv = $('#chartCv');
      if (!cv || !cv.getContext) return null;
      const c = cv.getContext('2d');
      return { width: cv.width, height: cv.height, calls: c && c.__calls ? c.__calls.length : '(真实浏览器里没有记账)' };
    },
    help: 'ZW.__app：state / ui / nav / openChart(id?) / closeChart() / spin() / flowJump(id,label) / draw() / navTo(view) / navBack() / navCloseAll() / importDataText()'
  };
  console.log('调试出口已开启 →', ZW.__app.help);
}

function boot(){
  $$('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
  refreshTitle();
  applyTheme();
  bindEvents();
  fitWheel();
  requestDraw();
  loadGearSfx();                                  // 提前解码齿轮音，第一次打开维度图就能响
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
  booting = false;
  exposeDebug();                                  // 开了调试开关才生效（见上面的说明）
  try {
    if (!localStorage.getItem(HINT_KEY)) {
      localStorage.setItem(HINT_KEY, '1');
      setTimeout(() => toast('第 1 步：点中间的转盘开始，键盘也可按空格'), 700);
      setTimeout(() => toast('第 2 步：点顶部名称，可搜索、切换和管理转盘'), 3000);
      setTimeout(() => toast('第 3 步：底部按钮可编辑选项、查看设置与记录'), 5300);
    }
  } catch(e){}
}
function init(){
  const hadLocal = (() => { try { return !!localStorage.getItem(LS_KEY); } catch(e){ return false; } })();
  loadWheelFiles(defs => {
    fileWheelCount = defs.length;
    /* 关键：默认「浏览器缓存为准」——
       文件只在「第一次打开」或用户点「从文件重新读取」时生效，
       否则网页上的增删改会在刷新后被文件覆盖（以前就是这个坑）。 */
    const useFiles = defs.length && (!hadLocal || state.settings.fromFiles === true);
    if (useFiles) { applyWheelFiles(defs); save(); }
    if (defs.length) {
      getDir(false).then(d => {
        dirUsable = !!d;
        if (dirUsable && isOverlayOpen() && ui.mtab === 'settings') renderSheet('swap');
      });
    }
    boot();
  });
}
init();
