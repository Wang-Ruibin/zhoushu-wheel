<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F3EFE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>咒术转盘</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="seal" aria-hidden="true">咒</span>
    <button class="title-pill" id="btnSwitch" aria-label="切换或管理转盘" aria-haspopup="dialog">
      <span class="pico" data-icon="menu"></span>
      <span class="pname" id="wheelName">咒术转盘</span>
      <span class="pico chev" data-icon="chevron"></span>
    </button>
  </header>
  <div class="flow-bar" id="flowBar" hidden></div>

  <main class="stage">
    <div class="result" id="result" role="button" tabindex="0" aria-label="当前没有结果" title="点开结果操作">？</div>
    <span class="sr-only" id="resultLive" role="status" aria-live="polite" aria-atomic="true"></span>
    <div class="wheel-wrap" id="wheelWrap"><canvas id="wheel" role="button" tabindex="0" aria-label="旋转当前转盘"></canvas></div>
  </main>

  <footer class="controls">
    <button class="round" id="btnPanel" title="设置与记录" aria-label="设置与记录" data-icon="sliders"></button>
    <button class="round" id="btnEdit" title="编辑当前转盘选项" aria-label="编辑当前转盘选项" data-icon="edit"></button>
  </footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="面板">
  <div class="sheet" id="sheet" tabindex="-1"></div>
</div>

<div class="overlay confirm-overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="cTitle" aria-describedby="cDesc">
  <div class="dialog" tabindex="-1">
    <h4 id="cTitle">提示</h4>
    <p id="cDesc"></p>
    <input class="c-input" id="cInput" type="text" hidden>
    <div class="c-acts">
      <button class="btn ghost" id="cCancel">取消</button>
      <button class="btn" id="cOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<!-- 插件：普通 <script>（不是 ES module，这样双击 html 也能用），按顺序加载 -->
<script src="js/_ns.js"></script>

<script>
(function(){
'use strict';

/* ============================== 命名空间转发 ==============================
   js/*.js 里的工具都挂在 window.ZW 上。这里把它们转成本文件里的短名，
   这样下面的业务代码写法和以前一模一样（$ / esc / clamp / colorOf …）。
   ⚠️ 加新的 js 文件时：在那个文件里 Object.assign(ZW, {...})，
      再到这里补一行转发（顺序要对齐 index.html 里 <script src> 的顺序）。
   ========================================================================= */
const { TAU,
        FONT,
        WFONT,
        PALETTES,
        $,
        $$,
        esc,
        uid,
        num,
        norm,
        clamp,
        random,
        setRandomSeed,
        randomSeed,
        randomDraws,
        replayCode,
        parseReplayCode,
        hslToHex,
        hexToRgb,
        colorOf,
        textOn,
        shuffleArr,
        usePalette,
        paletteOf,
        paletteKeyNow,
        svg,
        ICONS,
        icon,
        audio,
        beep,
        tickSound,
        loadGearSfx,
        playGearSfx,
        gearTick,
        winSound,
        vibrate,
        useAudioConfig,
        hasGearSfx,
        spin,
        animateSpin,
        applySpinFx,
        startSpinFx,
        endSpinFx,
        spinFxKey,
        SPIN_FX,
        setResult,
        setLiveText,
        beginRolling,
        endRolling,
        useSpinHooks,
        prefersReducedMotion,
        FACE_WHEN,

        gradeIndex,
        matchWhen,
        isMultiWheel,
        faceSourceName,
        faceCount,
        lastResultOf,
        faceOf,
        optionsOf,
        faceDesc,
        useMultiHooks,
        byRef,
        state,
        chartDwellSec,
        RECOVERY_KEY,
        currentWheel,
        activeOptions,
        layoutSectors,
        seed,
        wheelById,
        save,
        nextOf,
        nextInOrderAfter,
        BASE_FLOW,
        optById,
        wheelOptions,
        STAY,
        END,
        saveSoon,
        makeWheel,
        pushUndo,
        storageStatus,
        CHART_DWELL_MIN,
        profileIndex,
        undoStack,
        findOptionById,
        wheelMatchesFilter,
        inferWheelCategory,
        editFaceIndex,
        faceOptions,
        slotText,
        defaultTargetLabel,
        simulateWheel,
        editOpts,
        editOptsName,
        STATE_VER,
        normalize,
        undoToast,
        version,
        LS_KEY,
        PROFILE_PREFIX,
        loadState,
        storageErrorReset,
        moveWheel,
        makeOption,
        parseBatch,
        addProfile,
        renameProfile,
        deleteProfile,
        undoLast,
        switchProfile,
        WHEEL_CATEGORIES,
        winnerIndex,
        pickIndex,
        addHistory,
        HINT_KEY,
        parseGrade,

        ui,

        toast,
        saveRoundChart,
        isOverlayOpen,
        navTo,
        showChartForEnd,
        CHART_SHOW_DELAY,
        chartMidAt,

        prevChartOf,

        CHART_INKS,

        growHintFor,
        GROW_WORD_MAX,
        askDialog,

        drawRadar,

        topNav,

        createTemplateWheels,
        cssVar,
        drawHub,
        dropLayerIf,

        endRowDrag,
        faceEditBar,
        faceSource,
        faceWhenText,
        fitWheel,
        flowModeText,
        fmtTime,
        getRot,
        growHintBlock,
        handleAction,
        onRowPointerMove,
        refreshOptionProbabilities,
        requestDraw,
        resultEl,
        setRot,
        sketchCircle,
        splitTwoLines,

        switchRow,
        tabContent,
        tabHistory,
        tabSettings,
        tabWheels,
        updateDropLine,
        viewBatch,

        viewFaces,

        viewManager,
        viewNewChart,
        viewNewPick,
        viewResult,
        viewSimulation,
        viewTarget,
        viewTemplates } = ZW;
/* 多面转盘模块也不认识 state，这里把主逻辑里的东西喂给它 */
useMultiHooks({
  parseGrade: label => parseGrade(label),
  grownLabel: (id, label) => grownLabel(id, label),
  flowPath: () => (state.flow && state.flow.path) || [],
  history: () => state.history || [],
  wheels: () => state.wheels || []
});

/* 图标（svg / ICONS / icon）在 js/icons.js 里 */

/* 维度图自动弹窗的停留时长（秒）→ 规范成 [下限, 上限] 里的数；没设/设成 0 用默认值。
   放在最前面是因为 normalize() 会用到它。 */










function exposeDebug(){
  try { if (localStorage.getItem('zhoushu-wheel.debug') !== '1') return; } catch(e){ return; }
  ZW.__app = {
    version: ZW.version,
    get state(){ return state; },
    get ui(){ return ui; },
    get nav(){ return NAV; },
    openChart: id => {
      const c = id ? (state.charts.filter(x => x.id === id)[0] || null) : state.charts[0];
      if (!c) { toast('还没有维度图'); return null; }
      chartManualOpen();   // 手动打开：别被自动收起打断
      
      ui.chartItem = c;
      navTo('chart');
      return c;
    },
    closeChart: () => navGoBack(),
    spin: () => spin(),
    flowJump: (wid, label) => {
      const w = wheelById(wid) || currentWheel();
      flowJump(w, { label: label || '（调试）' }, label || '（调试）');
      return w;
    },
    draw: () => draw(),
    navTo: view => navTo(view),
    navBack: () => navBack(),
    navCloseAll: () => navCloseAll(),
    importDataText: (text, confirm) => importDataText(text, confirm),
    flowDiagnostics: () => flowDiagnostics(),
    canvasCalls: () => {
      const cv = $('#chartCv');
      if (!cv || !cv.getContext) return null;
      const c = cv.getContext('2d');
      return { width: cv.width, height: cv.height, calls: c && c.__calls ? c.__calls.length : '(真实浏览器里没有记账)' };
    },
    help: 'ZW.__app：state / ui / nav / openChart(id?) / closeChart() / spin() / flowJump(id,label) / draw() / navTo(view) / navBack() / navCloseAll() / importDataText()'
  };
  console.log('调试出口已开启 →', ZW.__app.help);
}

/* 主脚本仍持有的函数也挂到 ZW：先加载的模块（state/flow/storage…）运行时要反查 */
Object.assign(ZW, { boot, exposeDebug, init });

/* ============================== 启动 ============================== */
/* 启动之前把 js/spin.js 需要的依赖注入齐（放在这里是因为要用到上面所有定义） */
useSpinHooks({
  draw:           () => draw(),
  requestDraw:    () => requestDraw(),
  winnerIndex:    (secs, r) => winnerIndex(secs, r),
  layoutSectors:  (opts, w) => layoutSectors(opts, w),
  pickIndex:      opts => pickIndex(opts),
  currentWheel:   () => currentWheel(),
  activeOptions:  w => activeOptions(w),
  setResultLabel: (label, optId) => { ui.resultLabel = label; ui.resultOptId = optId; },
  addHistory:     (w, label) => addHistory(w, label),
  applyGrowth:    label => applyGrowth(label),
  flowJump:       (w, opt, label) => flowJump(w, opt, label),
  clearJump:      () => clearJump(),
  pendingClear:   () => { state.flow.pendingId = ''; },
  expandFlowBar:  () => { ui.flowCollapsed = false; renderFlowBar(); },
  openContent:    () => openSheet('manager', 'content'),
  saveSoon:       () => saveSoon(),
  toast:          (m, o) => toast(m, o),
  copyText:       t => copyText(t),
  config: {
    sound:    () => state.settings.sound !== false,
    vibrate:  () => state.settings.vibrate !== false,
    duration: () => state.settings.duration,
    rolling:  () => state.settings.rolling,
    spinFx:   () => state.settings.spinFx,
    autoFlip: () => state.settings.autoFlip
  }
});

function boot(){
  $$('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
  refreshTitle();
  applyTheme();
  bindEvents();
  fitWheel();
  requestDraw();
  loadGearSfx();                                  // 提前解码齿轮音，第一次打开维度图就能响
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
  setBooting(false);
  exposeDebug();                                  // 开了调试开关才生效（见上面的说明）
  try {
    if (!localStorage.getItem(HINT_KEY)) {
      localStorage.setItem(HINT_KEY, '1');
      setTimeout(() => toast('第 1 步：点中间的转盘开始，键盘也可按空格'), 700);
      setTimeout(() => toast('第 2 步：点顶部名称，可搜索、切换和管理转盘'), 3000);
      setTimeout(() => toast('第 3 步：底部按钮可编辑选项、查看设置与记录'), 5300);
    }
  } catch(e){}
}
function init(){
  const hadLocal = (() => { try { return !!localStorage.getItem(LS_KEY); } catch(e){ return false; } })();
  loadWheelFiles(defs => {
    setFileWheelCount(defs.length);
    /* 关键：默认「浏览器缓存为准」——
       文件只在「第一次打开」或用户点「从文件重新读取」时生效，
       否则网页上的增删改会在刷新后被文件覆盖（以前就是这个坑）。 */
    const useFiles = defs.length && (!hadLocal || state.settings.fromFiles === true);
    if (useFiles) { applyWheelFiles(defs); save(); }
    if (defs.length) {
      getDir(false).then(d => {
        setDirUsable(!!d);
        if (dirUsable && isOverlayOpen() && ui.mtab === 'settings') renderSheet('swap');
      });
    }
    boot();
  });
}
init();
})();
</script>
</body>
</html>
